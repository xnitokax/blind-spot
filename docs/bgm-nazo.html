<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>BLIND//SPOT 曲の聞き比べ</title>
    <!-- 任務2（謎解き）の曲の候補を聞き比べるページ（テスト用） -->
    <style>
      :root {
        --bg: #070a0a;
        --fg: #d7e4e0;
        --dim: #7d8f8a;
        --line: #1f3b36;
        --accent: #8fc8ff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: "BIZ UDGothic", "Hiragino Sans", system-ui, sans-serif;
        display: flex;
        justify-content: center;
      }
      main {
        width: min(420px, 100%);
        padding: 32px 16px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 18px;
        letter-spacing: 0.15em;
        margin: 0 0 6px;
      }
      p {
        color: var(--dim);
        font-size: 13px;
        line-height: 1.8;
        margin: 0 0 18px;
      }
      button {
        display: block;
        width: 100%;
        margin: 0 0 10px;
        padding: 14px;
        background: none;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
      }
      button small {
        display: block;
        margin-top: 4px;
        color: var(--dim);
        font-size: 12px;
        line-height: 1.6;
      }
      button.on {
        border-color: var(--accent);
        color: var(--accent);
      }
      #stop {
        margin-top: 18px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>曲の聞き比べ</h1>
      <p>任務2（謎解き）の曲の候補です。押すと流れます。曲は始まりが静かで、少しずつ楽器が増えていくので、30秒くらい聞いてみてください。マナーモードは解除してください。</p>
      <div id="list"></div>
      <button id="stop">■ 止める</button>
    </main>
    <script src="js/sound.js"></script>
    <script>
      const LIST = [
        ["nazo", "A　時計", "木琴のような音が、時計のように同じ形で刻み続ける。和音が変わるたびに、少しずつ不安な響きに。考えごとに集中する感じ"],
        ["watch", "B　監視", "ゆっくりの心臓の音（ドクン）と、秒針。ときどき冷たいピアノが鳴る。見られている、落ち着かない感じ"],
        ["think", "C　推理", "エレピの和音と、歩くベース、ブラシ。後半にビブラフォンの短いフレーズ。夜に一人で推理している感じ"],
        ["run", "今の曲（爽快版）", "比べる用。前へ走るボーナスタイムの曲"],
      ];
      const list = document.getElementById("list");
      const btns = LIST.map(([id, name, desc]) => {
        const b = document.createElement("button");
        b.innerHTML = `${name}<small>${desc}</small>`;
        b.onclick = () => {
          SFX.wake();
          if (SFX.muted) SFX.toggle();
          if (!SFX.bgmOn) SFX.toggleBgm();
          SFX.music(true, { track: id });
          btns.forEach(x => x.classList.toggle("on", x === b));
        };
        list.appendChild(b);
        return b;
      });
      document.getElementById("stop").onclick = () => {
        SFX.music(false);
        btns.forEach(x => x.classList.remove("on"));
      };
    </script>
  </body>
</html>
