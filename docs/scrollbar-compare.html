<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>スクロールバー比較</title>
<style>
  :root { --bg:#05090a; --panel:#0b1214; --line:#1c3a34; --fg:#b8f5d8; --dim:#5d8f7c; --accent:#3dffa8; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"BIZ UDGothic","Consolas","MS Gothic",monospace; font-size:14px; line-height:1.7; }
  h1 { font-size:16px; color:var(--accent); letter-spacing:.1em; margin:16px; }
  p.note { color:var(--dim); margin:0 16px 12px; font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; padding:0 16px 24px; }
  .card h2 { font-size:14px; margin:0 0 6px; color:var(--fg); }
  .card h2 span { color:var(--dim); font-weight:normal; font-size:12px; margin-left:6px; }
  .box { position:relative; height:360px; border:1px solid var(--line); border-radius:6px; background:var(--panel); }
  .scroll { height:100%; overflow-y:auto; padding:10px 14px; box-sizing:border-box; }
  .scroll p { margin:0; }
  .scroll .s { color:#8fc8ff; }
  .scroll .d { color:var(--dim); }

  /* A：完全に消す */
  .a .scroll { scrollbar-width:none; }
  .a .scroll::-webkit-scrollbar { display:none; }

  /* B：スクロール中だけ出る */
  .b .scroll { scrollbar-width:thin; scrollbar-color:transparent transparent; transition:scrollbar-color .4s; }
  .b .scroll.moving { scrollbar-color:color-mix(in srgb,var(--accent) 45%,transparent) transparent; }
  .b .scroll::-webkit-scrollbar { width:6px; }
  .b .scroll::-webkit-scrollbar-track { background:transparent; }
  .b .scroll::-webkit-scrollbar-thumb { background:transparent; border-radius:3px; }
  .b .scroll.moving::-webkit-scrollbar-thumb { background:color-mix(in srgb,var(--accent) 45%,transparent); }
  .b .scroll::-webkit-scrollbar-button { display:none; }

  /* C：端末らしいデザイン（ブラウザのバーは消して、目盛りと ▮ で位置を出す） */
  .c .scroll { scrollbar-width:none; padding-right:26px; }
  .c .scroll::-webkit-scrollbar { display:none; }
  .c .rail { position:absolute; top:8px; bottom:8px; right:6px; width:12px; cursor:pointer;
    background:repeating-linear-gradient(to bottom, color-mix(in srgb,var(--accent) 22%,transparent) 0 1px, transparent 1px 8px);
    background-size:6px 100%; background-repeat:repeat-y; background-position:center; }
  .c .mark { position:absolute; left:0; width:12px; height:14px; color:var(--accent); font-size:12px; line-height:14px; text-align:center;
    text-shadow:0 0 6px color-mix(in srgb,var(--accent) 70%,transparent); cursor:grab; user-select:none; }
  .c .mark::before { content:"▮"; }
  .c .rail .end { position:absolute; left:0; width:12px; font-size:9px; line-height:9px; text-align:center; color:var(--dim); }
  .c .rail .end.top { top:-8px; } .c .rail .end.bot { bottom:-8px; }
</style>
</head>
<body>
<h1>スクロールバー比較</h1>
<p class="note">それぞれの枠の中を、ホイール・ドラッグ・スワイプでスクロールしてみてください。</p>
<div class="grid">
  <div class="card a"><h2>A<span>完全に消す</span></h2><div class="box"><div class="scroll"></div></div></div>
  <div class="card b"><h2>B<span>スクロール中だけ出る</span></h2><div class="box"><div class="scroll"></div></div></div>
  <div class="card c"><h2>C<span>端末らしいデザイン</span></h2><div class="box"><div class="scroll"></div><div class="rail"><span class="end top">▴</span><span class="mark"></span><span class="end bot">▾</span></div></div></div>
</div>
<script>
  // 中身：ゲームのログっぽい行
  const rows = [];
  for (let i = 0; i < 6; i++) {
    rows.push('<p class="d">nitoka@nippo:~$ search 1770</p>', "<p>日報 ─ 「1770」 1,826 件（上位 1 件を表示）</p>",
      "<p>2026/07/01　dept:1770　室長</p>", "<p>本プロジェクトは、発足から5年を迎えました。</p>",
      '<p class="s">▸ 師匠　……「妨げになるものは、何であれ取り除く」。</p>', '<p class="s">▸ 師匠　5年分のあいさつの中で、この1文だけが浮いてる。</p>',
      '<p class="d">nitoka@nippo:~$ back</p>', "<p>▶ ssh://portal.teiwa.local</p>", "<p>帝和ホールディングス　社内ポータル</p>", "<p>&nbsp;</p>");
  }
  document.querySelectorAll(".scroll").forEach(s => (s.innerHTML = rows.join("")));

  // B：動かしているあいだだけ、moving を付ける
  const b = document.querySelector(".b .scroll");
  let t;
  b.addEventListener("scroll", () => { b.classList.add("moving"); clearTimeout(t); t = setTimeout(() => b.classList.remove("moving"), 700); });

  // C：▮ の位置を、スクロールの位置に合わせる。▮ をつかんで動かす・目盛りを押して飛ぶ
  const c = document.querySelector(".c .scroll"), rail = document.querySelector(".c .rail"), mark = rail.querySelector(".mark");
  const place = () => {
    const max = c.scrollHeight - c.clientHeight, h = rail.clientHeight - mark.offsetHeight;
    mark.style.top = (max > 0 ? (c.scrollTop / max) * h : 0) + "px";
  };
  c.addEventListener("scroll", place); addEventListener("resize", place); place();
  const jump = y => { const r = rail.getBoundingClientRect(); const p = Math.min(1, Math.max(0, (y - r.top - mark.offsetHeight / 2) / (r.height - mark.offsetHeight))); c.scrollTop = p * (c.scrollHeight - c.clientHeight); };
  let drag = false;
  rail.addEventListener("pointerdown", e => { drag = true; rail.setPointerCapture(e.pointerId); jump(e.clientY); });
  rail.addEventListener("pointermove", e => drag && jump(e.clientY));
  rail.addEventListener("pointerup", () => (drag = false));
</script>
</body>
</html>
