<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>BLIND//SPOT 目の出かた</title>
    <!-- 赤い目の出かたを見比べるページ（テスト用）。ゲームと同じ css/style.css を使う -->
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #05090a;
        color: #b8f5d8;
        font-family: "BIZ UDGothic", "Hiragino Sans", system-ui, sans-serif;
        display: flex;
        justify-content: center;
      }
      main {
        width: min(420px, 100%);
        padding: 32px 16px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 18px;
        letter-spacing: 0.15em;
        margin: 0 0 6px;
      }
      p {
        color: #5d8f7c;
        font-size: 13px;
        line-height: 1.8;
        margin: 0 0 18px;
      }
      button {
        display: block;
        width: 100%;
        margin: 0 0 10px;
        padding: 14px;
        background: none;
        color: #b8f5d8;
        border: 1px solid #1c3a34;
        border-radius: 6px;
        font: inherit;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
      }
      button small {
        display: block;
        margin-top: 4px;
        color: #5d8f7c;
        font-size: 12px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>目の出かた</h1>
      <p>押すと、赤い目が出て、砂嵐で戻る直前まで（約2秒）を流します。音もゲームと同じです。マナーモードは解除してください。</p>
      <div id="list"></div>
    </main>
    <script src="js/sound.js"></script>
    <script>
      // ゲームの WATCH_EYE（js/effects.js）と同じ形
      const EYE = `<svg viewBox="0 0 200 100" aria-hidden="true">
  <defs>
    <radialGradient id="weIris"><stop offset="0" stop-color="#ff6a4a"/><stop offset="0.65" stop-color="#b3000f"/><stop offset="1" stop-color="#3a0004"/></radialGradient>
    <clipPath id="weClip"><path d="M6 50 Q100 -12 194 50 Q100 112 6 50 Z"/></clipPath>
  </defs>
  <g class="we-lid">
  <path d="M6 50 Q100 -12 194 50 Q100 112 6 50 Z" fill="#070000"/>
  <g clip-path="url(#weClip)"><g class="we-ball"><circle cx="100" cy="50" r="30" fill="url(#weIris)"/><ellipse cx="100" cy="50" rx="5" ry="23" fill="#000"/></g></g>
  <path d="M6 50 Q100 -12 194 50 Q100 112 6 50 Z" fill="none" stroke="#ff2a2a" stroke-width="2.5"/>
  </g>
</svg>`;
      const STYLES = [
        ["on", "前の", "ふっと出る"],
        ["emerge", "A　浮かび上がる", "暗がりから、ぼやけた暗い目が、ゆっくりはっきりしてくる。いまゲームで使っている出かた"],
        ["open", "B　閉じた状態から開く", "細い赤い線から、一度うっすら開きかけて、かっと見開く"],
      ];
      let playing = false;
      const wait = ms => new Promise(r => setTimeout(r, ms));
      for (const [cls, name, desc] of STYLES) {
        const b = document.createElement("button");
        b.innerHTML = `${name}<small>${desc}</small>`;
        b.onclick = async () => {
          if (playing) return;
          playing = true;
          SFX.wake();
          if (SFX.muted) SFX.toggle();
          const eye = document.createElement("div");
          eye.className = "fx-eye";
          eye.innerHTML = EYE;
          document.body.appendChild(eye);
          SFX.gwan(2.18, { open: true, drift: true, peak: true });
          await wait(20);
          eye.classList.add(cls);
          await wait(2160);
          SFX.snow(0.5);
          eye.remove();
          await wait(500);
          playing = false;
        };
        document.getElementById("list").appendChild(b);
      }
    </script>
  </body>
</html>
