<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLIND//SPOT</title>
<style>
  :root {
    --bg: #05090a; --panel: #0b1214; --line: #1c3a34;
    --fg: #b8f5d8; --dim: #5d8f7c; --accent: #3dffa8; --alert: #ff4d6a; --warn: #ffc14d; --voice: #8fc8ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "BIZ UDGothic", "Consolas", "MS Gothic", monospace;
    font-size: 15px; line-height: 1.7; overflow: hidden;
  }
  /* ブラウン管：走査線と周辺の暗がり */
  body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40; }
  body::before { background: repeating-linear-gradient(to bottom, rgba(255,255,255,.03) 0 1px, transparent 1px 3px); }
  body::after { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6)); }

  .wrap {
    max-width: 1100px; height: 100%; margin: 0 auto; padding: 16px;
    display: grid; grid-template-columns: 1fr 260px; grid-template-rows: auto 1fr; gap: 16px;
    animation: flicker 5s infinite;
  }
  @keyframes flicker { 0%, 96%, 100% { opacity: 1; } 97% { opacity: .93; } 98% { opacity: 1; } 99% { opacity: .96; } }
  header { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  header h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: .2em; text-shadow: 0 0 10px rgba(61,255,168,.5); flex: 1; }
  #mute {
    font: inherit; font-size: 12px; background: transparent; color: var(--dim); border: 1px solid var(--line);
    border-radius: 4px; padding: 2px 8px; cursor: pointer;
  }
  #mute:hover { color: var(--accent); border-color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-height: 0; }
  h2 { font-size: 13px; color: var(--dim); margin: 0 0 6px; letter-spacing: .1em; font-weight: normal; }

  /* ターミナル */
  #term { overflow-y: auto; cursor: text; text-shadow: 0 0 6px rgba(61,255,168,.22); }
  .line { white-space: pre-wrap; word-break: break-word; }
  .line.node { white-space: normal; }
  .echo { color: var(--fg); }
  .echo .ps, .ps { color: var(--accent); }
  .dim { color: var(--dim); }
  .sys { color: var(--accent); }
  .alert { color: var(--alert); text-shadow: 0 0 8px rgba(255,77,106,.5); }
  .warn { color: var(--warn); }
  .meta { color: var(--dim); font-size: 13px; margin: 0; }
  .node-head { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .node-head b { font-size: 17px; font-weight: normal; }
  .doc { border-left: 2px solid var(--line); padding: 2px 12px; margin: 10px 0; white-space: normal; }
  .doc p { margin: 4px 0; }
  .node p { margin: 6px 0; white-space: normal; }
  .log { background: #000; border: 1px solid var(--line); padding: 10px; overflow-x: auto; font-size: 13px; margin: 8px 0; white-space: pre; }
  .doc .log { margin: 4px 0; }
  .tlink { color: var(--accent); border-bottom: 1px dashed var(--accent); }
  .tag { color: var(--accent); }
  .ls { display: grid; grid-template-columns: max-content 1fr; column-gap: 20px; row-gap: 2px; margin: 8px 0 4px; }
  .ls .n { color: var(--accent); }
  .ls .ow { color: var(--warn); }
  /* 師匠のセリフ */
  .say { color: var(--voice); padding-left: 3.6em; text-indent: -3.6em; text-shadow: 0 0 8px rgba(143,200,255,.35); }
  .say .who { display: inline-block; width: 3.6em; text-indent: 0; color: var(--dim); }
  .say .who::before { content: "▸ "; color: var(--voice); }
  .noise { font-size: 12px; opacity: .85; }
  /* タップ／クリックで入力欄にコマンドが入る */
  .pick { cursor: pointer; border-radius: 3px; padding: 1px 5px; margin: -1px -5px; }
  .pick:hover, .pick:active { background: var(--accent); color: var(--bg); text-shadow: none; }
  .ow.pick:hover, .ow.pick:active { background: var(--warn); }
  #run {
    font: inherit; font-size: 14px; background: transparent; color: var(--accent); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 12px; cursor: pointer;
  }
  #run:hover { border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: baseline; }
  #cmd {
    flex: 1; min-width: 0; font: inherit; background: transparent; color: var(--fg); border: none; outline: none; padding: 0;
    caret-color: var(--accent); text-shadow: inherit;
  }
  #cmd.ghost { color: var(--alert); }

  /* 入力欄と「NEXT」欄：画面の下に固定して、次にできることを常に見せる */
  #term { padding-bottom: 0; }
  .dock {
    position: sticky; bottom: 0; z-index: 2; background: var(--panel);
    margin-top: 10px; padding: 8px 0 14px; border-top: 1px dashed var(--line);
    transition: opacity .3s;
  }
  .dock.busy #next { opacity: .3; pointer-events: none; }
  #next { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  #next:empty { display: none; }
  #next .next-label { color: var(--dim); font-size: 11px; letter-spacing: .25em; margin-right: 2px; }
  #next .chip {
    margin: 0; padding: 1px 9px; border: 1px solid var(--line); border-radius: 12px; color: var(--accent);
    white-space: nowrap; text-shadow: none;
  }
  #next .chip.ow, #next .chip.warn { color: var(--warn); border-color: rgba(255,193,77,.4); }
  #next .chip.go { border-color: rgba(61,255,168,.45); }

  /* タイトル */
  .title-logo {
    font-size: clamp(30px, 8vw, 60px); letter-spacing: .12em; color: var(--accent); margin: 18px 0 6px; line-height: 1.2;
    text-shadow: -2px 0 rgba(255,0,80,.75), 2px 0 rgba(0,200,255,.75), 0 0 24px rgba(61,255,168,.55);
    animation: rgbsplit 4s infinite;
  }
  @keyframes rgbsplit {
    0%, 90%, 100% { transform: none; }
    91% { transform: translate(-3px, 0) skewX(-8deg); text-shadow: -6px 0 rgba(255,0,80,.9), 6px 0 rgba(0,200,255,.9); }
    93% { transform: translate(2px, 0); }
  }
  .subtitle { color: var(--dim); letter-spacing: .3em; font-size: 12px; margin-bottom: 14px; }

  /* 任務開始のカード */
  .mission {
    border: 1px solid var(--warn); border-radius: 4px; padding: 10px 16px; margin: 12px 0; position: relative;
    background: linear-gradient(90deg, rgba(255,193,77,.08), transparent 70%); animation: cardIn .6s ease-out;
    white-space: normal;
  }
  .mission .m-label { color: var(--warn); font-size: 12px; letter-spacing: .5em; }
  .mission .m-title { font-size: 22px; color: var(--warn); letter-spacing: .12em; text-shadow: 0 0 14px rgba(255,193,77,.5); }
  .mission .m-obj { margin-top: 4px; }
  .mission .m-meta { color: var(--dim); font-size: 12px; }
  @keyframes cardIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  /* 認証の結果 */
  .banner {
    display: inline-block; margin: 6px 0; padding: 4px 22px; border: 1px solid currentColor; font-size: 20px;
    letter-spacing: .45em; text-shadow: 0 0 14px currentColor; box-shadow: 0 0 18px -4px currentColor inset;
    animation: bannerIn .45s ease-out;
  }
  .banner.ok { color: var(--accent); }
  .banner.bad { color: var(--alert); }
  @keyframes bannerIn { 0% { transform: scale(1.6); opacity: 0; filter: blur(4px); } 100% { transform: none; opacity: 1; filter: none; } }

  /* 手がかり */
  .evidence { color: var(--warn); }
  .evi-tag { background: var(--warn); color: var(--bg); padding: 0 6px; margin-right: 8px; font-size: 12px; letter-spacing: .12em; text-shadow: none; }
  .evidence { animation: evidenceIn .8s ease-out; }
  @keyframes evidenceIn { 0% { background: rgba(255,193,77,.35); } 100% { background: transparent; } }

  /* ニュース */
  .news { border-left: 3px solid var(--voice); padding: 2px 12px; margin: 6px 0; background: rgba(143,200,255,.05); animation: slideIn .4s ease-out; }
  .news .meta { font-size: 11px; }
  @keyframes slideIn { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* 見ている目（マウスを追いかける） */
  .eye-wrap { display: flex; flex-direction: column; align-items: center; margin: 20px 0; gap: 8px; }
  .eye {
    width: 180px; height: 90px; position: relative; border-radius: 50%; border: 2px solid var(--alert); overflow: hidden;
    background: radial-gradient(ellipse at center, #1a0006, #000 70%);
    box-shadow: 0 0 34px rgba(255,77,106,.55), inset 0 0 22px rgba(255,77,106,.45);
    animation: eyeOpen 1.4s ease-out, eyeBlink 5s 1.4s infinite;
  }
  .eye i {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
    background: radial-gradient(circle, #000 28%, var(--alert) 31%, #6a0014 62%, #2a0008 72%); transition: transform .12s;
  }
  .eye-cap { color: var(--alert); letter-spacing: .6em; font-size: 13px; }
  @keyframes eyeOpen { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes eyeBlink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.04); } }

  /* トレースメーター */
  .trace-label { display: flex; justify-content: space-between; font-size: 13px; }
  .bar { height: 10px; background: #000; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin: 4px 0 16px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s, background .6s; box-shadow: 0 0 10px currentColor; }
  .bar.racing i { transition: width .1s linear, background .3s; }
  aside.danger .bar { animation: dangerBar .8s infinite; }
  aside.danger #traceNum { color: var(--alert); animation: blink .8s steps(1) infinite; }
  @keyframes dangerBar { 50% { box-shadow: 0 0 14px var(--alert); border-color: var(--alert); } }
  /* アクセスログと手がかり */
  #log { list-style: none; padding: 0; margin: 0 0 14px; font-size: 12px; max-height: 32vh; overflow-y: auto; }
  #log li, #evi li { color: var(--dim); border-bottom: 1px dotted var(--line); padding: 2px 0; }
  #log li.bad { color: var(--alert); }
  #log li.ow { color: var(--warn); }
  #evi { list-style: none; padding: 0; margin: 0; font-size: 12px; max-height: 30vh; overflow-y: auto; }
  #evi li { color: var(--warn); }
  #evi li.new { animation: evidenceIn 1.6s ease-out; }
  .evi-head { display: flex; justify-content: space-between; }

  .flash { animation: flash .5s 2; }
  @keyframes flash { 50% { background: #3a0a12; } }
  .flash-ok { animation: flashOk .6s; }
  @keyframes flashOk { 30% { background: #0a3a24; } }
  .shake { animation: shake .45s; }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 0); } 20%, 80% { transform: translate(4px, 1px); }
    30%, 50%, 70% { transform: translate(-6px, -1px); } 40%, 60% { transform: translate(6px, 1px); }
  }
  .jolt { animation: jolt .16s steps(2); }
  @keyframes jolt { 50% { transform: translate(2px, -1px); filter: hue-rotate(120deg) saturate(3); } }

  /* 回線をつなぐ演出 */
  .warp { animation: warp .8s ease-out; }
  @keyframes warp {
    0%   { filter: blur(8px) brightness(2.6); transform: scale(1.05); }
    40%  { filter: blur(1px) hue-rotate(40deg); transform: scale(.99); }
    100% { filter: none; transform: none; }
  }
  /* 画面が消える（ブラウン管の電源を切ったように） */
  .crt-off { animation: crtOff .75s forwards ease-in; }
  @keyframes crtOff {
    0% { transform: none; filter: none; }
    55% { transform: scale(1, .004); filter: brightness(5); }
    100% { transform: scale(0, .004); filter: brightness(8); opacity: 0; }
  }

  /* 逆ハッキング・接続遮断 */
  .glitch { animation: glitch .14s steps(2) infinite; }
  @keyframes glitch {
    0%   { transform: translate(0, 0); filter: none; }
    25%  { transform: translate(-4px, 2px); filter: hue-rotate(90deg) saturate(3); }
    50%  { transform: translate(3px, -2px); filter: invert(1); }
    75%  { transform: translate(-2px, -1px); filter: hue-rotate(-60deg); }
    100% { transform: translate(2px, 1px); filter: none; }
  }
  .unstable { animation: unstable 1.8s steps(1) infinite; }
  @keyframes unstable {
    0%, 100% { transform: none; filter: none; }
    82% { transform: translate(-3px, 1px); filter: hue-rotate(80deg) saturate(2.5); }
    86% { transform: translate(2px, -1px); filter: invert(.9); }
    90% { transform: none; filter: none; }
  }
  /* 画面全体の色（赤＝警報、青＝師匠が回線を奪い返した） */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 35; opacity: 0; transition: opacity .6s; }
  body.red #fx { opacity: 1; background: radial-gradient(ellipse at center, rgba(255,0,40,.06), rgba(255,0,40,.38)); animation: redPulse 1s infinite; }
  body.blue #fx { opacity: 1; background: radial-gradient(ellipse at center, rgba(80,160,255,.04), rgba(80,160,255,.3)); }
  @keyframes redPulse { 50% { opacity: .45; } }

  #overlay {
    position: fixed; inset: 0; z-index: 30; background: #000; display: none;
    overflow-y: auto; cursor: pointer; opacity: 0; transition: opacity 1s;
  }
  #overlay.on { display: flex; }
  #overlay.visible { opacity: 1; }
  #overlay.cut { transition: none; }
  #overlay .inner { margin: auto; max-width: 640px; padding: 48px 24px 80px; }
  #overlay .text { white-space: pre-wrap; line-height: 2.1; font-size: 16px; min-height: 1em; }
  #overlay .text::after { content: "▌"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  #overlay.typed .text::after { content: ""; }
  @keyframes blink { 50% { opacity: 0; } }
  #overlay .clues { margin-top: 28px; font-size: 13px; }
  #overlay .clues li { color: var(--warn); list-style: "◆ "; animation: slideIn .4s ease-out; }
  #overlay .endtag {
    margin-top: 40px; text-align: center; font-size: 28px; letter-spacing: .3em; color: var(--accent);
    opacity: 0; transform: scale(1.3); transition: opacity 2s, transform 2s; text-shadow: 0 0 18px currentColor;
  }
  #overlay .endtag.show { opacity: 1; transform: none; }
  #overlay .endtag.bad { color: var(--alert); }
  #overlay .hint { margin-top: 48px; text-align: center; color: var(--dim); font-size: 13px; opacity: 0; transition: opacity 1s; }
  #overlay .hint.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .wrap, .title-logo, .unstable, .glitch, body.red #fx { animation: none !important; }
  }

  /* スマホ：TRACE は1行、アクセスログは最新1件だけ（タップで開閉）
     ※ 上の通常ルールを上書きするため、必ずスタイルの最後に置く */
  @media (max-width: 800px) {
    .wrap { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: 100dvh; padding: 12px; gap: 8px; }
    header { order: -2; padding-bottom: 6px; }
    header h1 { font-size: 15px; letter-spacing: .1em; }
    #term { padding: 12px 12px 0; }
    aside {
      order: -1; padding: 8px 12px; cursor: pointer;
      display: grid; grid-template-columns: max-content 1fr max-content max-content; column-gap: 10px; align-items: center;
    }
    aside::after { content: "▾"; color: var(--dim); font-size: 12px; grid-row: 1; grid-column: 4; }
    /* 手がかりの数は TRACE と同じ1行目に「◆ 2/3」とだけ出す */
    aside h2.evi-head { display: block; grid-row: 1; grid-column: 3; margin: 0; font-size: 12px; }
    aside h2.evi-head span:first-child { display: none; }
    #eviCount { color: var(--warn); }
    #eviCount:not(:empty)::before { content: "◆ "; }
    aside.open::after { content: "▴"; }
    .trace-label { gap: 8px; }
    .bar { margin: 0; }
    aside h2 { display: none; }
    /* スマホ：NEXT 欄は1行で、横にスクロール */
    #next { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #next::-webkit-scrollbar { display: none; }
    #log { grid-column: 1 / -1; max-height: 1.8em; overflow: hidden; margin: 4px 0 0; }
    #log li { border-bottom: none; padding: 0; }
    aside.open #log { max-height: 25vh; overflow-y: auto; }
    aside.open #log li { border-bottom: 1px dotted var(--line); padding: 2px 0; }
    #evi { display: none; grid-column: 1 / -1; }
    aside.open #evi { display: block; max-height: 20vh; margin-top: 6px; }
    .mission .m-title { font-size: 18px; }
    .banner { font-size: 15px; letter-spacing: .25em; padding: 3px 12px; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <h1 id="gameTitle">BLIND//SPOT</h1>
    <button id="mute" type="button" aria-label="音のオン・オフ">SOUND ON</button>
    <span id="clock" class="meta"></span>
  </header>

  <main class="panel" id="term">
    <div id="out"></div>
    <div class="dock" id="dock">
      <div id="next" aria-label="次にできること"></div>
      <form class="row" id="form" autocomplete="off">
        <span class="ps" id="prompt"></span>
        <input id="cmd" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" enterkeyhint="go" aria-label="コマンド入力">
        <button id="run" type="submit" aria-label="実行">⏎</button>
      </form>
    </div>
  </main>

  <aside class="panel" id="side">
    <div class="trace-label"><span>TRACE（逆探知）</span><span id="traceNum">0%</span></div>
    <div class="bar"><i id="traceBar"></i></div>
    <h2>ACCESS LOG</h2>
    <ul id="log"></ul>
    <h2 class="evi-head"><span>EVIDENCE</span><span id="eviCount"></span></h2>
    <ul id="evi"></ul>
  </aside>
</div>

<div id="fx"></div>
<div id="overlay"></div>

<script src="nz-crypto.js"></script>
<script src="scenario.data.js"></script>
<script>
// =========================================================
//  エンジン（シナリオは src/scenario.js 側で編集 → tools/build.html でビルド）
//  ?dev を付けて開くと、ビルドせずに src/scenario.js を直接読み込む
//  ?line=回線コード を付けて開くと、その任務から始まる（uzu から渡すリンク用）
//
//  流れ：回線コードを入力 → 回線をつなぐ演出 → 任務 → 任務完了 → uzu に戻って報告
//  操作はターミナルのコマンド。ssh（接続）、back（戻る）、search（検索）、cd（フォルダ移動）
//  演出中は画面をクリック（または Enter）すると早送りできる
// =========================================================

// ---------------- 効果音（Web Audio でその場で合成する。音声ファイルは使わない） ----------------
// 方針：ピコピコした矩形波は使わない。サイン波・フィルターをかけたノイズ・低音で、映画の UI のような質感にする
const SFX = (() => {
  let ctx = null, out = null, echo = null, noiseBuf = null, siren = null, ambient = null;
  let muted = false;
  try { muted = localStorage.getItem("uzu-muted") === "1"; } catch {}

  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
      // 全体：音量 → コンプレッサー（大きな音をまとめる）→ スピーカー
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 4;
      out = ctx.createGain();
      out.gain.value = 0.6;
      out.connect(comp).connect(ctx.destination);
      // エコー：音が空間に残る感じ
      const delay = ctx.createDelay(1), fb = ctx.createGain(), lp = ctx.createBiquadFilter(), wet = ctx.createGain();
      delay.delayTime.value = 0.28; fb.gain.value = 0.38; lp.type = "lowpass"; lp.frequency.value = 2200; wet.gain.value = 0.5;
      echo = ctx.createGain();
      echo.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(wet); wet.connect(out);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function env(g, t, vol, dur, attack = 0.004) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function route(node, o) {
    node.connect(out);
    if (o.echo) { const s = ctx.createGain(); s.gain.value = o.echo; node.connect(s).connect(echo); }
  }
  // 音程のある音（既定はサイン波。filter を付けるとこもった音になる）
  function tone(freq, dur, o = {}) {
    if (muted) return;
    const c = ac(); if (!c) return;
    const t = c.currentTime + (o.at || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    env(g, t, o.vol ?? 0.1, dur, o.attack);
    let last = osc;
    if (o.filter) { const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = o.filter; last = last.connect(f); }
    last.connect(g);
    route(g, o);
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  // ノイズ（フィルターで「ザッ」「ゴォ」「カチ」などに変える。sweep で周波数を動かす）
  function hiss(dur, o = {}) {
    if (muted) return;
    const c = ac(); if (!c) return;
    const t = c.currentTime + (o.at || 0);
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const f = c.createBiquadFilter();
    f.type = o.filter || "bandpass"; f.frequency.setValueAtTime(o.freq || 2000, t); f.Q.value = o.q ?? 1;
    if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
    const g = c.createGain(); env(g, t, o.vol ?? 0.1, dur, o.attack);
    src.connect(f).connect(g);
    route(g, o);
    src.start(t, Math.random()); src.stop(t + dur + 0.05);
  }

  return {
    get muted() { return muted; },
    toggle() {
      muted = !muted;
      try { localStorage.setItem("uzu-muted", muted ? "1" : "0"); } catch {}
      if (muted) { this.siren(false); this.ambient(false); } else ac();
      return muted;
    },
    wake() { if (!muted) ac(); },
    // キー入力：小さく乾いたクリック
    key: () => hiss(0.012, { vol: 0.035, freq: 5200, q: 1.2 }),
    // 師匠の無線：行の頭で一度だけ「ザッ」
    radio: () => { hiss(0.1, { vol: 0.07, freq: 1700, q: 2.5 }); tone(2800, 0.035, { vol: 0.012 }); },
    tick: () => tone(3400, 0.008, { vol: 0.01 }),
    enter: () => { tone(160, 0.09, { vol: 0.09 }); hiss(0.02, { vol: 0.03, freq: 3000 }); },
    // 中継点を通過：ソナーのような短いピン
    hop: i => tone(1320 + i * 40, 0.14, { vol: 0.025, echo: 0.5 }),
    // 転移：低い地鳴りと、こもった音が開いていくノイズ
    warp: () => {
      tone(42, 1.4, { vol: 0.3, slide: 30, attack: 0.05 });
      hiss(1.1, { vol: 0.12, filter: "lowpass", freq: 180, sweep: 5500, q: 0.7, attack: 0.6, echo: 0.3 });
    },
    // 任務開始のカード・結末の見出し：重い一撃と、高い残響
    card: () => {
      tone(55, 1.8, { vol: 0.38, slide: 36 });
      hiss(0.5, { vol: 0.14, filter: "lowpass", freq: 900, sweep: 120 });
      tone(1760, 1.4, { vol: 0.012, echo: 0.7, attack: 0.02 });
    },
    granted: () => {
      tone(90, 0.3, { vol: 0.15 });
      tone(440, 0.6, { vol: 0.045, echo: 0.4 });
      tone(660, 0.7, { vol: 0.04, at: 0.09, echo: 0.4 });
    },
    denied: () => {
      tone(68, 0.55, { type: "sawtooth", filter: 420, vol: 0.2 });
      tone(71.5, 0.55, { type: "sawtooth", filter: 420, vol: 0.16 });
      hiss(0.16, { vol: 0.1, filter: "lowpass", freq: 700 });
    },
    alert: () => { tone(1000, 0.14, { vol: 0.04, echo: 0.3 }); tone(1000, 0.14, { vol: 0.04, at: 0.2, echo: 0.3 }); },
    // 手がかり：澄んだベルのような音
    evidence: () => {
      tone(110, 0.25, { vol: 0.1 });
      tone(1318, 1.1, { vol: 0.035, echo: 0.6, attack: 0.005 });
      tone(1975, 1.0, { vol: 0.02, at: 0.07, echo: 0.6 });
    },
    static: () => hiss(0.18, { vol: 0.09, freq: 1200, q: 0.6 }),
    power: () => { tone(900, 0.6, { vol: 0.07, slide: 40 }); hiss(0.2, { vol: 0.07, filter: "lowpass", freq: 1500 }); },
    boom: () => {
      tone(48, 2.2, { vol: 0.45, slide: 26 });
      hiss(1.4, { vol: 0.2, filter: "lowpass", freq: 1400, sweep: 90, echo: 0.3 });
    },
    // 警報：こもったうねり
    siren(on) {
      if (siren) { try { siren.stop(); } catch {} siren = null; }
      if (!on || muted) return;
      const c = ac(); if (!c) return;
      const osc = c.createOscillator(), lfo = c.createOscillator(), depth = c.createGain(), f = c.createBiquadFilter(), g = c.createGain();
      osc.type = "sawtooth"; osc.frequency.value = 440;
      lfo.frequency.value = 0.55; depth.gain.value = 110;
      f.type = "lowpass"; f.frequency.value = 900;
      lfo.connect(depth).connect(osc.frequency);
      g.gain.value = 0.035;
      osc.connect(f).connect(g).connect(out);
      osc.start(); lfo.start();
      siren = { stop() { osc.stop(); lfo.stop(); } };
    },
    // 任務中ずっと鳴っている、ごく小さい低い唸り
    ambient(on) {
      if (ambient) { try { ambient.stop(); } catch {} ambient = null; }
      if (!on || muted) return;
      const c = ac(); if (!c) return;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.02, c.currentTime + 3);
      g.connect(out);
      const a = c.createOscillator(), b = c.createOscillator();
      a.frequency.value = 55; b.frequency.value = 55.35;
      a.connect(g); b.connect(g);
      const src = c.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 320; f.Q.value = 0.8;
      const ng = c.createGain(); ng.gain.value = 0.35;
      src.connect(f).connect(ng).connect(g);
      a.start(); b.start(); src.start();
      ambient = { stop() { a.stop(); b.stop(); src.stop(); } };
    },
  };
})();

// 回線コードで任務を開く：開発モードは平文比較、公開データは復号

  if (DEV) {
    const hit = Object.entries(S.chapters).find(([, ch]) => NZ.norm(ch.code) === c);
    return hit ? { id: hit[0], ...hit[1] } : null;
  }
  for (const box of S.chapters) {

  return null;
}

// 鍵付きノード：開けたら中身を合わせたノードを返す
async function tryUnlock(node, input) {
  const v = NZ.norm(input);
  if ("pass" in node.lock) return [].concat(node.lock.pass).map(NZ.norm).includes(v) ? node : null;
  for (const box of node.lock.boxes) {
    const text = await NZ.unlock(box, v);
    if (text !== null) return { ...node, ...JSON.parse(text) };
  }
  return null;
}

const nodeOf = id => state.opened.get(id) || CH.nodes[id];

// ---------------- 入力のロック ----------------
// 演出の途中はコマンドを受け付けない（入れ子で呼んでもよい）
let busyDepth = 0;
const isBusy = () => busyDepth > 0;
function focusCmd() { if (finePointer) cmd.focus(); }
async function busy(fn) {
  busyDepth++;
  cmd.disabled = true;
  $("dock").classList.add("busy");
  try {
    return await fn();
  } finally {
    if (--busyDepth <= 0) {
      busyDepth = 0;
      fast = false;
      $("dock").classList.remove("busy");

// ---------------- NEXT 欄：次にできることを、入力欄の上に常に出す ----------------
function chip(fill, label, cls = "") {

}
function updateNext() {

  } else if (mode?.type === "confirm") {

  } else if (state.current) {

// 文字化けした状態から、左から順に正しい文字に戻っていく（解読の演出）
const GLYPH_A = "!#$%&*+=?@0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
const GLYPH_W = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン";
const glyphFor = ch => /\s/.test(ch) ? ch : ch.charCodeAt(0) < 0x2000 ? pickOne(GLYPH_A) : pickOne(GLYPH_W);
function textNodes(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.trim() ? 1 : 3 });
  const list = [];
  while (w.nextNode()) list.push(w.currentNode);
  return list;
}
async function decode(el, ms = 450) {
  if (REDUCED || fast) return;
  const nodes = textNodes(el);
  const orig = nodes.map(n => [...n.nodeValue]);
  const frames = Math.max(4, Math.round(ms / 30));
  for (let f = 1; f <= frames; f++) {
    if (fast) break;
    const p = f / frames;
    nodes.forEach((n, i) => {
      const o = orig[i], k = Math.floor(o.length * p);
      n.nodeValue = o.slice(0, k).join("") + o.slice(k).map(glyphFor).join("");
    });
    await sleep(30);
  }
  nodes.forEach((n, i) => { n.nodeValue = orig[i].join(""); });
}

// 台本の1行：[師匠] はセリフ、[!] は警告、[*] [+] はシステム。1文字ずつ打ち出す
function lineParts(s) {
  if (s.startsWith("[師匠]")) return { cls: "say", text: s.replace(/^\[師匠\]\s*/, ""), say: true };
  if (s.startsWith("[!")) return { cls: "alert", text: s };
  if (/^\[[*+]\]/.test(s)) return { cls: "sys", text: s };
  return { cls: "", text: s };
}
function printLine(s) {
  const { cls, text, say } = lineParts(s);
  return print(say ? `<span class="who">師匠</span>${esc(text)}` : esc(text), cls);
}
async function typeLine(s) {
  const { cls, text, say } = lineParts(s);
  const d = print(say ? `<span class="who">師匠</span><span class="t"></span>` : `<span class="t"></span>`, cls);
  const t = d.querySelector(".t");
  if (cls === "alert") SFX.alert();
  if (say) SFX.radio();
  const chars = [...text];
  for (let i = 0; i < chars.length; i++) {
    if (fast || REDUCED) break;
    t.textContent += chars[i];
    if (i % 6 === 0) scrollDown();
    await sleep("。、…！？".includes(chars[i]) ? 90 : say ? 28 : 16);
  }
  t.textContent = text;
  scrollDown();
  return d;
}
async function speak(lines) {

}

// 演出用：トレースの表示だけを一気に上げる（100% になってもゲームオーバーにしない）

async function enterNode(id, opt = {}) {
  const node = nodeOf(id);

  state.current = id;
  updateClock();

  const first = !state.visited.has(id);

  showNode();
  await busy(async () => {

      if (node.clue) { await wait(500); addClue(node.clue); }
      await speak(node.say);
    }
    if (node.goal) await runGoal(node.goal);
  });

// 転移（演出つき）。鍵付きなら先にパスワードを聞く
async function connect(id, opt = {}) {

    line.innerHTML += ` <span class="sys">${10 + Math.floor(Math.random() * 60)}ms</span>`;

    disablePicks();
    print(`<span class="banner bad" style="font-size:14px">LOCKED</span>\n<span class="warn">認証が必要です。</span>\n${esc(lock.hint || "")}`
      + (lock.user?.hint ? `\n${esc(lock.user.hint)}` : "")
      + (len ? `\nパスワード：<span class="warn" style="letter-spacing:.2em;white-space:nowrap">${"_".repeat(len)}</span>（${len}文字）` : "")
      + `\n<span class="dim">※ パスワードを間違えるとトレースが上昇します</span>\n<span class="dim">※ 何も入力せずに Enter（または back）で、入力せずに戻れます</span>　<span class="n pick" data-cancel>[やめる]</span>`);
    if (!state.said.has("lock:" + id)) { state.said.add("lock:" + id); await speak(lock.say); }
    if (lock.user) askUser(id, opt);
    else askPass(id, opt);
    return;
  }
  await enterNode(id, opt);
}

// ---------------- 認証（ユーザーID → パスワード） ----------------
// パスワードの文字数（showLength のときだけ見せる。公開データではビルド時に len を入れておく）
const lockLen = lock => lock.showLength ? (lock.len ?? [...[].concat(lock.pass)[0]].length) : 0;

function askUser(id, opt) {
  const u = nodeOf(id).lock.user;
  state.mode = { type: "user", id, opt, label: u.prompt || "user" };
  cmd.type = "text";
  setPrompt(`${state.mode.label}:`);
  focusCmd();
}
function askPass(id, opt, user) {
  const lock = nodeOf(id).lock;
  state.mode = { type: "password", id, opt, user, label: lock.prompt || "password" };
  cmd.type = lock.prompt ? "text" : "password";
  passPrompt();
  focusCmd();
}
// 文字数を見せる鍵では、打った文字数を [5/17] のように出す
function passPrompt() {
  const m = state.mode, len = lockLen(nodeOf(m.id).lock);
  setPrompt(len ? `${m.label} [${[...cmd.value].length}/${len}]:` : `${m.label}:`);
}
// ユーザーID を確かめる（大文字小文字・全角半角・空白は区別しない）
function checkUser(lock, raw) {
  const u = lock.user, v = NZ.norm(raw);
  const key = Object.keys(u.ids).find(k => NZ.norm(k) === v);
  if (!key) return { error: "そのユーザーIDは登録されていません。" };
  const account = u.ids[key];
  if (u.disabled?.[account]) return { error: u.disabled[account] };
  return { account };
}

// ---------------- 検索 ----------------
function searchText(e) {
  if (!e._text) {
    const box = document.createElement("div");
    box.innerHTML = e.html;
    box.querySelectorAll(".nosearch").forEach(el => el.remove());
    e._text = lower(box.textContent + " " + (e.keys || ""));
  }
  return e._text;
}

async function search(arg) {
  const node = here();
  if (!node.search) return print("search: ここには検索できるものがありません。", "dim");
  const q = arg.trim();
  if (!q) return print("使い方：search &lt;言葉&gt;（スペースで区切ると条件を重ねられます）", "dim");

  const conf = node.search, limit = conf.limit ?? 3;
  const terms = lower(q).split(/\s+/);
  const hits = conf.entries.filter(e => terms.every(t => searchText(e).includes(t)));
  const shown = hits.slice(0, limit);
  state.minutes += 1;
  updateClock();
  addLog(`QUERY "${q}" @${shortHost(node.host)}`);

  await busy(async () => {
    // 検索中の演出：件数が回っていく
    const total = conf.records ?? 10000, frames = 14;
    const line = print("", "dim");
    for (let f = 1; f <= frames; f++) {
      line.textContent = `scanning [${"▮".repeat(f)}${"·".repeat(frames - f)}] ${Math.round(total * f / frames).toLocaleString()} records`;
      SFX.tick();
      await wait(32);
    }
    await showResults(conf, q, terms, hits, shown, limit);
  });
}

async function showResults(conf, q, terms, hits, shown, limit) {
  // 見せかけの総件数（totals）：その言葉1つだけで検索したときに、大企業らしい件数を出す
  const key = Object.keys(conf.totals || {}).find(k => NZ.norm(k) === NZ.norm(q));
  const total = hits.length ? Math.max(hits.length, key ? conf.totals[key] : 0) : 0;
  print(`${esc(conf.label)}：「${esc(q)}」の検索結果 ${total.toLocaleString()} 件${total > limit ? `（上位 ${limit} 件を表示）` : ""}`, hits.length ? "sys" : "dim");
  if (!hits.length) print(esc(conf.empty || "該当するものはありません。"), "dim");
  shown.forEach(e => decode(print(`<div class="doc">${e.html}</div>`, "node"), 380));

  const clues = shown.map(e => e.clue).filter(c => c && !state.clues.includes(c));
  if (clues.length) { await sleep(450); clues.forEach(addClue); }

  // 師匠のひとこと（それぞれ一度だけ）
  const lines = [];
  for (const e of shown) {
    if (e.say && !state.said.has(e)) { state.said.add(e); lines.push(...e.say); }
  }
  const goal = shown.find(e => e.goal)?.goal;
  if (!goal) {
    (conf.notes || []).forEach((n, i) => {
      const key = `${state.current}:note${i}`;
      if (state.said.has(key)) return;
      if ([].concat(n.when).some(w => terms.some(t => t.includes(NZ.norm(w))))) { state.said.add(key); lines.push(...n.say); }
    });
  }
  await speak(lines);
  if (goal) await runGoal(goal);
}

// ---------------- 任務の開始 ----------------
function resetScreen() {
  fast = false;
  SFX.siren(false);
  SFX.ambient(false);
  document.body.classList.remove("red", "blue");
  $("overlay").className = "";
  $("wrap").classList.remove("glitch", "unstable", "crt-off");
  $("form").style.visibility = "";
  cmd.disabled = isBusy();
  cmd.type = "text";
  cmd.classList.remove("ghost");
  out.innerHTML = "";
  $("log").innerHTML = "";
  $("evi").innerHTML = "";
  updateTrace();
  updateClock();
  updateClueCount();
  updateNext();
}

async function startChapter(ch) {
  CH = ch;
  state = freshState();
  resetScreen();

  // 師匠が回線をつなぐ（移動の演出）
  await busy(async () => {
    await typeLine("[師匠] 回線をつなぐ。しっかり掴まってろ。");
    await wait(500);
    const route = CH.route || ["uzu://safehouse", "tor-entry.anon", "tor-exit.anon"];
    for (const [i, hop] of route.entries()) {
      const l = print(`  ${i === route.length - 1 ? "└" : "├"}─ ${esc(hop)} `, "dim");
      for (let k = 0; k < 6; k++) { await wait(32); l.innerHTML += "▓"; }
      l.innerHTML += ` <span class="sys">${20 + Math.floor(Math.random() * 180)}ms OK</span>`;
      SFX.hop(i);
      await wait(110);
    }
    SFX.warp();
    pulse($("wrap"), "warp", 800);
    await wait(600);
    SFX.ambient(true);
    print(`[+] 接続完了：${esc(route.at(-1))}`, "sys");
    addLog(`LINE OPEN  ${CH.label}`);

    // 任務開始のカード
    await wait(300);
    SFX.card();
    const card = print(`<div class="mission">
      <div class="m-label">${CH.objective ? "MISSION" : "LOG"}</div>
      <div class="m-title">${esc(CH.label)}</div>
      ${CH.objective ? `<div class="m-obj">目的：${esc(CH.objective)}</div>` : ""}
      <div class="m-meta">${esc(CH.date)} ${esc(CH.clock || "")}</div>
    </div>`);
    await decode(card, 700);
    await wait(400);
  });
  await speak(CH.intro);
  await enterNode(CH.start);
}

// ---------------- 任務完了 ----------------
// 演出の台本を再生する（書き方は src/scenario.js の先頭を参照）
async function play(steps) {
  for (const s of steps) {
    if (typeof s === "string") { await typeLine(s); await wait(420); continue; }
    if (s.wait) await wait(s.wait);
    if ("glitch" in s) $("wrap").classList.toggle("unstable", s.glitch);
    if ("mode" in s) {
      document.body.classList.remove("red", "blue");
      if (s.mode) document.body.classList.add(s.mode);
      SFX.siren(s.mode === "red");
      if (s.mode === "blue") SFX.granted();
    }
    if (s.sound) SFX[s.sound]?.();
    if ("trace" in s) await raceTrace(s.trace, s.ms || 2000);
    if (s.hex) {
      for (let i = 0; i < s.hex; i++) { print(`0x${(0x7f3a00 + i * 16).toString(16)}  ${randHex(16)}`, "dim"); SFX.tick(); await wait(28); }
    }
    if (s.spam) {
      // 逆探知が回線をたどってくる
      for (let i = 0; i < s.spam; i++) { addLog(`TRACE ← ${randIp()}  hop ${i + 1}`, "bad"); SFX.tick(); await wait(90); }
    }
    if (s.ghost) {
      // 入力欄を乗っ取られ、勝手にコマンドが打たれる
      setPrompt("root@???:~#");
      $("form").style.visibility = "";
      cmd.classList.add("ghost");
      for (const ch of s.ghost) { cmd.value += ch; SFX.key(); await wait(95); }
      await wait(400);
      print(`<span class="alert">root@???:~#</span> ${esc(cmd.value)}`, "echo");
      cmd.value = "";
      cmd.classList.remove("ghost");
      $("form").style.visibility = "hidden";
      await wait(400);
    }
    if (s.predict) {
      for (const p of s.predict) {
        await wait(750);
        const ok = !p.node || state.visited.has(p.node);
        SFX.tick();
        decode(print(`<span class="${ok ? "sys" : "dim"}">${ok ? "✔ 一致" : "… 未到達"}</span>　${esc(p.text)}　<span class="dim">${esc(p.p || "")}</span>`), 300);
      }
    }
    if (s.replay) {
      // この任務でプレイヤーが実際に打ったコマンドを、「予測済み」として流す
      for (const c of state.cmdLog) {
        await wait(260);
        SFX.tick();
        print(`<span class="dim">${esc(c.t)}</span>　<span class="alert">予測済</span>　$ ${esc(c.c)}`);
      }
    }
    if (s.eye) {
      SFX.boom();
      print(`<div class="eye-wrap"><div class="eye"><i></i></div><div class="eye-cap">${esc(s.eye === true ? "見ている" : s.eye)}</div></div>`);
      await wait(1800);
    }
    if (s.news) {
      for (const n of s.news) {
        await wait(900);
        SFX.enter();
        decode(print(`<div class="news"><div class="meta">${esc(n.meta || "Seek ニュース")}</div>${esc(n.text || n)}</div>`, "node"), 350);
      }
    }
    if (s.corrupt) {
      // 画面の文字がどんどん崩れていく
      const nodes = textNodes(out);
      const end = Date.now() + s.corrupt;
      let k = 0;
      while (Date.now() < end && nodes.length) {
        const rate = 20 + Math.floor(80 * (1 - (end - Date.now()) / s.corrupt));
        for (let i = 0; i < rate; i++) {
          const n = pickOne(nodes), chars = [...n.nodeValue];
          const j = Math.floor(Math.random() * chars.length);
          chars[j] = glyphFor(chars[j]);
          n.nodeValue = chars.join("");
        }
        if (k++ % 4 === 0) SFX.static();
        await sleep(45);
      }
    }
  }
}

async function runGoal(goal) {
  state.over = true;
  updateNext();
  const cut = goal.end === "cut";
  await busy(async () => {
    $("form").style.visibility = "hidden";
    await play(goal.script || []);
    await wait(900);
    if (!cut) { await typeLine("[*] 回線を切断しました。"); await wait(700); }
  });
  if (cut) {
    // 何の前触れもなく、真っ暗になる（音も全部止まる）
    SFX.siren(false);
    SFX.ambient(false);
    document.body.classList.remove("red", "blue");
    $("wrap").classList.remove("glitch", "unstable");
  } else {
    await powerOff();
  }
  await showEnding(`${goal.report || ""}\n\n── ${goal.tag || "COMPLETE"}`, { cut, clues: !cut });
}

// 暗転 → 文章を1文字ずつ表示 → 回収した手がかり → 見出し
async function showEnding(text, opt = {}) {
  state.over = true;
  state.mode = null;
  state.retry = !!opt.retry;
  cmd.disabled = true;

  const lines = text.trim().split("\n");
  const tag = lines.at(-1).startsWith("──") ? lines.pop().replace(/^──\s*/, "") : "";
  const body = lines.join("\n").trim();

  const ov = $("overlay");
  ov.className = "on" + (opt.cut ? " cut visible" : "");
  ov.innerHTML = `<div class="inner"><div class="text"></div><div class="clues"></div><div class="endtag"></div><div class="hint">クリック / Enter で${opt.retry ? "この任務をやり直す" : "タイトルに戻る"}</div></div>`;
  await sleep(50);
  ov.classList.add("visible");
  await sleep(opt.cut ? 3000 : 1400);
  $("wrap").classList.remove("glitch", "unstable");

  const el = ov.querySelector(".text");
  state.skip = false;
  for (const ch of body) {
    if (state.skip) break;
    el.textContent += ch;
    if (ch.trim() && Math.random() < 0.3) SFX.tick();
    await sleep(ch === "\n" ? 240 : "。』」".includes(ch) ? 200 : "、…".includes(ch) ? 100 : 34);
  }
  el.textContent = body;
  ov.classList.add("typed");

  if (opt.clues && CH && countClues(CH)) {
    const box = ov.querySelector(".clues");
    box.innerHTML = `<div class="dim">回収した手がかり　${state.clues.length} / ${countClues(CH)}</div><ul></ul>`;
    for (const c of state.clues) {
      if (!state.skip) await sleep(260);
      const li = document.createElement("li");
      li.textContent = c;
      box.querySelector("ul").appendChild(li);
      SFX.tick();
    }
  }
  await sleep(700);
  const t = ov.querySelector(".endtag");
  t.textContent = tag;
  if (/GAME OVER/.test(tag)) t.classList.add("bad");
  t.classList.add("show");
  SFX.card();
  await sleep(1500);
  ov.querySelector(".hint").classList.add("show");
  state.endReady = true;
}

function overlayInput() {
  if (!state.endReady) { state.skip = true; return; }
  $("overlay").className = "";
  if (state.retry) busy(() => startChapter(CH));
  else boot();
}
$("overlay").addEventListener("click", overlayInput);
document.addEventListener("keydown", e => {
  if ($("overlay").classList.contains("on") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); overlayInput(); return; }
  if (isBusy() && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); fast = true; }
});

const COMMANDS = {
  help() {
    const node = here();
    const rows = [
      ["ssh <名前>", "接続先へ移動する（例：ssh portal）"],
      ["back", "ひとつ前の場所へ戻る"],
      ["search <言葉>", "検索できる場所で検索する（スペース区切りで条件を重ねる）"],
      ["cd <フォルダ名>", "ファイルサーバーでフォルダを移動する"],
      ["ls", "今いる場所の接続先をもう一度表示"],
      ["help", "この一覧"],
    ].map(([c, d]) => `<span class="n">${esc(c)}</span><span>${esc(d)}</span>`).join("");
    print(`<div class="ls">${rows}</div><span class="dim">Tab で補完 ／ ↑↓ で履歴 ／ 演出中はクリックで早送り${node.search ? " ／ ここでは search が使えます" : ""}${node.dir ? " ／ ここでは cd が使えます" : ""}</span>`);
  },
  ssh(arg) {
    if (!arg) return print("使い方：ssh &lt;名前&gt;", "dim");
    const link = state.links.find(l => l.name.toLowerCase() === arg.toLowerCase());
    if (!link) return print(`ssh: 接続先が見つかりません: ${esc(arg)}`, "alert");
    if (link.oneway) {
      disablePicks();
      SFX.alert();
      print(`⚠ 一方通行です。この先は戻れません。　<span class="n pick ow" data-fill="y">y 進む</span>　<span class="n pick" data-fill="n">n やめる</span>`, "warn");
      state.mode = { type: "confirm", id: link.go };
      setPrompt("続けますか？ [y/N]");
      return;
    }
    return connect(link.go);
  },
  async cd(arg) {
    const node = here();
    if (!node.dir) return COMMANDS.ssh(arg);
    if (!arg) return print("使い方：cd &lt;フォルダ名&gt;", "dim");
    const a = NZ.norm(arg);
    const byAlias = node.dir.find(d => d.go && (d.alias || []).some(x => NZ.norm(x) === a));
    if (byAlias) {
      addLog(`cd ${arg}`);
      SFX.granted();
      print(`<span class="banner ok" style="font-size:14px">FOUND</span>　${esc(node.host)}/${esc(arg.toUpperCase())}`);
      await sleep(600);
      return connect(byAlias.go);
    }
    const d = node.dir.find(d => NZ.norm(d.name) === a);
    if (!d) return print(`cd: ${esc(arg)}: そのようなフォルダはありません。`, "alert");
    decode(print(`<span class="dim">${esc(node.host)}/${esc(d.name)}</span>\n${esc(d.text || "ファイルがありません。")}`), 300);
    if (d.clue) addClue(d.clue);
    if (d.say && !state.said.has(d)) { state.said.add(d); await speak(d.say); }
  },
  search,
  back() {
    if (!state.history.length) return print("back: これ以上戻れません。", "dim");
    return connect(state.history.pop(), { isBack: true });
  },
  ls() {
    const node = here();
    if (node.dir) printDir(node);
    if (node.search) printSearchHelp(node);
    printLinks();
    if (!node.dir && !node.search && !state.links.length) print("接続先はありません。", "dim");
  },
  // 隠しコマンド（help には出さない）
  reboot: () => boot(),
};
COMMANDS.exit = COMMANDS.back;

// 認証をやめて、元いた場所に戻る
function cancelAuth() {
  if (!["user", "password"].includes(state.mode?.type)) return;
  const label = state.mode.label;
  state.mode = null;
  disablePicks();
  print(`<span class="ps">${esc(label)}:</span> <span class="dim">（入力しない）</span>`, "echo");
  print("認証をやめました。", "dim");
  SFX.enter();
  printLinks();
  normalPrompt();
  cmd.value = "";
  focusCmd();
}

async function run(raw) {
  const mode = state.mode;
  if (mode?.type === "line") {
    print(`<span class="ps">line:</span> ${esc(raw)}`, "echo");
    if (!raw.trim()) return;
    const ch = await busy(async () => {
      const line = print("", "dim");
      let done = false;
      const anim = (async () => {
        while (!done) { line.textContent = `回線コードを照合中... ${randHex(6)}`; SFX.tick(); await sleep(60); }
      })();
      const [found] = await Promise.all([openChapter(raw), sleep(700)]);
      done = true;
      await anim;
      line.textContent = "回線コードを照合中... done";
      return found;
    });
    if (!ch) {
      SFX.denied();
      pulse($("wrap"), "shake", 450);
      return print("回線コードが違います。師匠に確認してください。", "alert");
    }
    state.mode = null;
    return startChapter(ch);
  }
  // 何も入力しない／back と打つと、認証をやめて戻る（トレースは上がらない）
  const quit = !raw.trim() || /^(back|exit|cancel)$/i.test(raw.trim());
  if (mode?.type === "user") {
    if (quit) return cancelAuth();
    const lock = nodeOf(mode.id).lock;
    print(`<span class="ps">${esc(mode.label)}:</span> ${esc(raw)}`, "echo");
    const r = checkUser(lock, raw);
    if (r.error) {
      SFX.denied();
      print(esc(r.error), "alert");
      return askUser(mode.id, mode.opt);
    }
    SFX.enter();
    return askPass(mode.id, mode.opt, r.account);
  }
  if (mode?.type === "password") {
    if (quit) return cancelAuth();
    state.mode = null;
    const node = nodeOf(mode.id);
    const shown = node.lock.prompt ? esc(raw) : "*".repeat([...raw].length);
    print(`<span class="ps">${esc(mode.label)}:</span> ${shown}`, "echo");
    // 照合中の演出（復号が終わるまで、鍵がくるくる回る）
    const opened = await busy(async () => {
      const line = print("", "dim");
      let done = false;
      const anim = (async () => {
        while (!done) { line.textContent = `decrypting ${randHex(10)}`; SFX.tick(); await sleep(50); }
      })();
      // ユーザーID がある鍵では、パスワードの持ち主の ID のときだけ照合する
      const owner = !node.lock.user || mode.user === node.lock.user.owner;
      const [result] = await Promise.all([owner ? tryUnlock(node, raw) : null, sleep(900)]);
      done = true;
      await anim;
      line.remove();
      return result;
    });
    if (opened) {
      state.opened.set(mode.id, opened);
      SFX.granted();
      pulse($("term"), "flash-ok", 600);
      print(`<span class="banner ok">ACCESS GRANTED</span>`);
      addLog(`AUTH OK  ${node.host}`);
      await sleep(700);
      return enterNode(mode.id, mode.opt);
    }
    SFX.denied();
    print(`<span class="banner bad">ACCESS DENIED</span>`);
    addLog(`AUTH FAIL  ${node.host}`, "bad");
    addTrace(node.lock.penalty ?? 10);
    // 入力画面のまま、続けてもう一度打てる（接続が切られたときを除く）
    if (!state.over) askPass(mode.id, mode.opt, mode.user);
    return;
  }
  if (mode?.type === "confirm") {
    state.mode = null;
    print(`<span class="ps">続けますか？ [y/N]</span> ${esc(raw)}`, "echo");
    if (/^y(es)?$/i.test(raw.trim())) return connect(mode.id, { oneway: true });
    print("中止しました。", "dim");
    printLinks();
    return normalPrompt();
  }

  print(`<span class="ps">${esc($("prompt").textContent)}</span> ${esc(raw)}`, "echo");
  const [name, ...args] = raw.trim().split(/\s+/);
  if (!name) return;
  state.cmdLog.push({ t: clockText(), c: raw.trim() });
  const fn = COMMANDS[name.toLowerCase()];
  if (!fn) return print(`${esc(name)}: コマンドが見つかりません（help で一覧）`, "alert");
  await fn(args.join(" "));
}

// Tab 補完：1語目はコマンド、ssh の後は接続先、cd の後はフォルダ
function complete() {
  const v = cmd.value;
  const node = here();
  const m = v.match(/^\s*(\S+)\s+(\S*)$/);
  let pool, prefix, head;
  if (m && /^ssh$/i.test(m[1])) pool = state.links.map(l => l.name);
  else if (m && /^cd$/i.test(m[1])) pool = node.dir ? node.dir.map(d => d.name) : state.links.map(l => l.name);
  else if (!m && /^\s*\S*$/.test(v)) pool = ["ssh", "back", "help", "ls", ...(node.search ? ["search"] : []), ...(node.dir ? ["cd"] : [])];
  else return;
  if (m) { prefix = m[2]; head = v.slice(0, v.length - prefix.length); }
  else { prefix = v.trim(); head = ""; }
  const hits = pool.filter(p => p.toLowerCase().startsWith(prefix.toLowerCase()));
  if (hits.length === 1) cmd.value = head + hits[0] + (m ? "" : " ");
  else if (hits.length > 1) print(hits.map(esc).join("    "), "dim");
}

// ---------------- 入力 ----------------
const hist = [];
let histPos = 0;

$("form").onsubmit = async e => {
  e.preventDefault();
  SFX.wake();
  if (isBusy()) { fast = true; return; }
  if (state.over) return;
  const raw = cmd.value;
  cmd.value = "";
  SFX.enter();
  const plain = !state.mode;
  if (plain && raw.trim()) hist.push(raw);
  histPos = hist.length;
  // コマンドの処理（演出を含む）が終わるまで、次の入力は受け付けない
  await busy(() => run(raw));
  if (plain) maybeNoise();
};

// パスワード入力中は、打った文字数を [5/17] のように出す
cmd.addEventListener("input", () => { if (state.mode?.type === "password") passPrompt(); });

cmd.addEventListener("keydown", e => {
  const inGame = CH && !state.mode;
  if (e.key.length === 1 || e.key === "Backspace") SFX.key();
  if (e.key === "Escape" && ["user", "password"].includes(state.mode?.type)) { e.preventDefault(); cancelAuth(); }
  else if (e.key === "Tab") { e.preventDefault(); if (inGame) complete(); }
  else if (e.key === "ArrowUp" && inGame && histPos > 0) { e.preventDefault(); cmd.value = hist[--histPos]; }
  else if (e.key === "ArrowDown" && inGame) {
    e.preventDefault();
    histPos = Math.min(hist.length, histPos + 1);
    cmd.value = hist[histPos] ?? "";
  }
});

// 音のオン・オフ
function updateMute() { $("mute").textContent = SFX.muted ? "SOUND OFF" : "SOUND ON"; }
$("mute").addEventListener("click", () => {
  SFX.toggle();
  updateMute();
  if (!SFX.muted) { SFX.enter(); if (CH && !state.over) SFX.ambient(true); }
});
updateMute();

// スマホ：TRACE 欄をタップでアクセスログと手がかりを開閉
$("side").addEventListener("click", e => e.currentTarget.classList.toggle("open"));

// 名前をタップ → 入力欄にコマンドを入れる（実行は Enter か ⏎ ボタン）
// 「search 」のように続きを打つものは、スマホでもキーボードを出す
// 演出中にクリック → 早送り
$("term").addEventListener("click", e => {
  SFX.wake();
  if (e.target.closest("#run")) return;
  if (isBusy()) { fast = true; return; }
  const pick = e.target.closest(".pick");
  if (pick) {
    if ("cancel" in pick.dataset) return cancelAuth();
    if ("reuser" in pick.dataset && state.mode?.type === "password") {
      print("ユーザーIDを入力し直します。", "dim");
      cmd.value = "";
      return askUser(state.mode.id, state.mode.opt);
    }
    if (["user", "password"].includes(state.mode?.type)) return;
    cmd.value = pick.dataset.fill;
    SFX.tick();
    if (finePointer || cmd.value.endsWith(" ")) cmd.focus(); else cmd.blur();
    return;
  }
  if (!getSelection().toString()) cmd.focus();
});

// 見ている目：瞳がマウス（指）を追いかける
function lookAt(x, y) {
  document.querySelectorAll(".eye i").forEach(p => {
    const r = p.parentElement.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy) || 1;
    p.style.transform = `translate(${dx / d * Math.min(48, d / 6)}px, ${dy / d * Math.min(16, d / 12)}px)`;
  });
}
document.addEventListener("pointermove", e => lookAt(e.clientX, e.clientY));
document.addEventListener("touchstart", e => lookAt(e.touches[0].clientX, e.touches[0].clientY), { passive: true });

// ---------------- 起動 ----------------
function freshState() {
  return {
    current: null, history: [], visited: new Set(), opened: new Map(), links: [], said: new Set(), clues: [], cmdLog: [],
    trace: 0, minutes: 0, commands: 0, over: false, mode: null, skip: false, endReady: false, retry: false,
  };
}

// タイトル画面：回線コードを待つ
async function boot(autoCode) {
  CH = null;
  state = freshState();
  resetScreen();
  await busy(async () => {
    const logo = print(`<div class="title-logo">${esc(S.title)}</div><div class="subtitle">ANON-NET TERMINAL</div>`);
    SFX.warp();
    await decode(logo, 900);
    for (const l of ["[ ok ] kernel modules", "[ ok ] tor client  3 guards", "[ ok ] relay  uzu://safehouse … online"]) {
      await wait(140);
      print(esc(l), "dim");
      SFX.tick();
    }
    await wait(250);
    await typeLine("師匠から受け取った回線コードを入力してください。");
  });
  if (DEV) {
    const rows = Object.values(S.chapters).map(ch =>
      `<span class="n pick" data-fill="${esc(ch.code)}">${esc(ch.code)}</span><span>${esc(ch.label)}</span>`).join("");
    print(`<span class="warn">[開発モード] 回線コード一覧</span><div class="ls">${rows}</div>`);
  }
  state.mode = { type: "line" };
  setPrompt("line:");
  focusCmd();
  if (autoCode) busy(() => run(autoCode));
}

try {
  S = await loadScenario();
} catch (err) {
  print(`シナリオを読み込めませんでした：${esc(err.message)}`, "alert");
  return;
}
$("gameTitle").textContent = S.title;
document.title = S.title;
boot(params.get("line"));
})();
</script>
