async function startChapter(ch) {
  CH = ch;
  state = freshState();
  resetScreen();

  // 師匠が回線をつなぐ（移動の演出）
  await busy(async () => {
    await typeLine("[師匠] 回線をつなぐ。しっかり掴まってろ。");
    await wait(500);
    const route = CH.route || ["uzu://safehouse", "tor-entry.anon", "tor-exit.anon"];
    for (const [i, hop] of route.entries()) {
      const l = print(`  ${i === route.length - 1 ? "└" : "├"}─ ${esc(hop)} `, "dim");
      for (let k = 0; k < 6; k++) { await wait(32); l.innerHTML += "▓"; }
      l.innerHTML += ` <span class="sys">${20 + Math.floor(Math.random() * 180)}ms OK</span>`;
      SFX.hop(i);
      await wait(110);
    }
    SFX.warp();
    pulse($("wrap"), "warp", 800);
    await wait(600);
    print(`[+] 接続完了：${esc(route.at(-1))}`, "sys");
    addLog(`LINE OPEN  ${CH.label}`);

    // 任務開始のカード
    await wait(300);
    SFX.card();
    const card = print(`<div class="mission">
      <div class="m-label">${CH.objective ? "MISSION" : "LOG"}</div>
      <div class="m-title">${esc(CH.label)}</div>
      ${CH.objective ? `<div class="m-obj">目的：${esc(CH.objective)}</div>` : ""}
      ${CH.objective && S.case ? `<div class="m-case">${S.case.map(([k, v]) => `${esc(k)}：${esc(v)}`).join("　／　")}</div>` : ""}
      <div class="m-meta">${esc(CH.date)} ${esc(CH.clock || "")}</div>
    </div>`);
    await decode(card, 700);
    // カードを読む時間を取ってから、師匠が話し出す
    await wait(1300);
  });
  // 導入の台本（{ music: true } で師匠が音楽を流し始める）
  await busy(async () => {
    await play(CH.intro || []);
    // 最初の目標
    if (nowObj()) {
      await wait(BEAT.small);
      showObjective(nowObj(), "OBJECTIVE");
      // カードと同時に、右の欄にも目標が現れる
      state.objShown = true;
      updateClueCount();
      $("evi").querySelector(".o-now")?.classList.add("new");
      await wait(900);
    }
  });
  await enterNode(CH.start);
}

// ---------------- 任務完了 ----------------
// 演出の台本を再生する（書き方は src/scenario.js の先頭を参照）
async function play(steps) {
  for (const s of steps) {
    if (typeof s === "string") { await typeLine(s); await wait(420); continue; }
    if (s.wait) await wait(s.wait);
    if ("glitch" in s) $("wrap").classList.toggle("unstable", s.glitch);
    if ("mode" in s) {
      document.body.classList.remove("red", "blue");
      if (s.mode) document.body.classList.add(s.mode);
      SFX.siren(s.mode === "red");
      // 警報で音楽がテープのように止まり、師匠が回線を奪い返すと戻ってくる
      if (s.mode === "red") SFX.music(false, { tape: true });
      if (s.mode === "blue") SFX.music(true);
      if (s.mode === "blue") SFX.granted();
    }
    if (s.sound) SFX[s.sound]?.();
    if ("music" in s) SFX.music(s.music);
    // { slow: "セリフ", ms: 1文字の間隔 } … ゆっくり1文字ずつ出す
    if (s.slow) { await typeLine(s.slow, { charMs: s.ms || 350 }); await wait(700); }
    if ("trace" in s) await raceTrace(s.trace, s.ms || 2000);
    if (s.hex) {
      for (let i = 0; i < s.hex; i++) { print(`0x${(0x7f3a00 + i * 16).toString(16)}  ${randHex(16)}`, "dim"); SFX.tick(); await wait(28); }
    }
    if (s.spam) {
      // 逆探知が回線をたどってくる
      for (let i = 0; i < s.spam; i++) { addLog(`TRACE ← ${randIp()}  hop ${i + 1}`, "bad"); SFX.tick(); await wait(90); }
    }
    if (s.ghost) {
      // 入力欄を乗っ取られ、勝手にコマンドが打たれる
      setPrompt("root@???:~#");
      $("form").style.visibility = "";
      cmd.classList.add("ghost");
      for (const ch of s.ghost) { cmd.value += ch; SFX.key(); await wait(95); }
      await wait(400);
      print(`<span class="alert">root@???:~#</span> ${esc(cmd.value)}`, "echo");
      cmd.value = "";
      cmd.classList.remove("ghost");
      $("form").style.visibility = "hidden";
      await wait(400);
    }
    if (s.predict) {
      print(`<div class="sec-head">PREDICTION LOG ── 対象：${esc(who())}</div>`);
      for (const p of s.predict) {
        await wait(750);
        const ok = !p.node || state.visited.has(p.node);
        SFX.tick();
        decode(print(`<div class="pred"><span class="${ok ? "sys" : "dim"}">${ok ? "✔ 一致" : "… 未到達"}</span><span>${esc(fill(p.text))}</span><span class="p">${esc(p.p || "")}</span></div>`), 300);
      }
    }
    if (s.replay) {
      // この任務でプレイヤーが実際に打ったコマンドを、「予測済み」として流す
      print(`<div class="sec-head">COMMAND LOG ── ${esc(who())}</div>`);
      for (const c of state.cmdLog) {
        await wait(260);
        SFX.tick();
        print(`<div class="rep"><span class="dim">${esc(c.t)}</span><span class="alert">予測済</span><span>$ ${esc(c.c)}</span></div>`);
      }
    }
    if (s.eye) {
      SFX.boom();
      print(`<div class="eye-wrap"><div class="eye"><i></i></div><div class="eye-cap">${esc(s.eye === true ? "見ている" : s.eye)}</div></div>`);
      await wait(1800);
    }
    if (s.news) {
      for (const n of s.news) {
        await wait(900);
        SFX.enter();
        decode(print(`<div class="news"><div class="meta">${esc(n.meta || "Seek ニュース")}</div>${esc(n.text || n)}</div>`, "node"), 350);
      }
    }
    if (s.corrupt) {
      // 画面の文字がどんどん崩れていく
      const nodes = textNodes(out);
      const end = Date.now() + s.corrupt;
      let k = 0;
      while (Date.now() < end && nodes.length) {
        const rate = 20 + Math.floor(80 * (1 - (end - Date.now()) / s.corrupt));
        for (let i = 0; i < rate; i++) {
          const n = pickOne(nodes), chars = [...n.nodeValue];
          const j = Math.floor(Math.random() * chars.length);
          chars[j] = glyphFor(chars[j]);
          n.nodeValue = chars.join("");
        }
        if (k++ % 4 === 0) SFX.static();
        await sleep(45);
      }
    }
  }
}

async function runGoal(goal) {
  state.over = true;
  updateNext();
  const cut = goal.end === "cut";
  await busy(async () => {
    $("form").style.visibility = "hidden";
    // 見つけたものを眺める余韻を残してから、任務の締めくくりが始まる
    await wait(BEAT.react);
    await play(goal.script || []);
    await wait(900);
    // 「任務完了まで」の目標は、師匠の締めのあとで済ませる（ぷつっと切れる結末では出さない）
    const o = nowObj();
    if (o?.until?.goal) {
      state.objIdx++;
      updateClueCount();
      if (!cut) {
        SFX.objective();
        print(`<div class="obj-card clear"><span class="o-tag">OBJECTIVE CLEAR</span><span class="o-text">${esc(o.text)}</span></div>`);
        addLog(`CLEAR  ${o.text}`);
        await wait(1400);
      }
    }
    if (!cut) { await typeLine("[*] 回線を切断しました。"); await wait(700); }
  });
  if (cut) {
    // 何の前触れもなく、真っ暗になる（音も全部止まる）
    SFX.siren(false);
    SFX.music(false, { fast: true });
    document.body.classList.remove("red", "blue");
    $("wrap").classList.remove("glitch", "unstable");
  } else {
    await powerOff();
  }
  await showEnding(`${goal.report || ""}\n\n── ${goal.tag || "COMPLETE"}`, { cut, clues: !cut, todo: goal.todo });
}

// 暗転 → 文章を1文字ずつ表示 → 回収した手がかり → 見出し
async function showEnding(text, opt = {}) {
  state.over = true;
  state.mode = null;
  state.retry = !!opt.retry;
  cmd.disabled = true;

  const lines = fill(text).trim().split("\n");
  const tag = lines.at(-1).startsWith("──") ? lines.pop().replace(/^──\s*/, "") : "";
  const body = lines.join("\n").trim();

  const ov = $("overlay");
  ov.className = "on" + (opt.cut ? " cut visible" : "");
  ov.innerHTML = `<div class="inner"><div class="text"></div><div class="clues"></div><div class="todo"></div><div class="endtag"></div><div class="hint">クリック / Enter で${opt.retry ? "この任務をやり直す" : "タイトルに戻る"}</div></div>`;
  await sleep(50);
  ov.classList.add("visible");
  await sleep(opt.cut ? 3000 : 1400);
  $("wrap").classList.remove("glitch", "unstable");

  const el = ov.querySelector(".text");
  state.skip = false;
  for (const ch of body) {
    if (state.skip) break;
    el.textContent += ch;
    if (ch.trim() && Math.random() < 0.3) SFX.tick();
    await sleep(ch === "\n" ? 240 : "。』」".includes(ch) ? 200 : "、…".includes(ch) ? 100 : 34);
  }
  el.textContent = body;
  ov.classList.add("typed");

  if (opt.clues && CH && countClues(CH)) {
    const box = ov.querySelector(".clues");
    box.innerHTML = `<div class="clue-head">EVIDENCE<span>回収した手がかり　${state.clues.length} / ${countClues(CH)}</span></div><ul></ul>`;
    for (const c of state.clues) {
      if (!state.skip) await sleep(260);
      const li = document.createElement("li");
      li.textContent = c;
      box.querySelector("ul").appendChild(li);
      SFX.tick();
    }
  }
  // 次にやること（uzu に戻って報告する、など）を、別枠で目立たせる
  if (opt.todo) {
    if (!state.skip) await sleep(500);
    const todo = ov.querySelector(".todo");
    todo.innerHTML = `<span class="todo-tag">NEXT</span><span>${esc(fill(opt.todo))}</span>`;
    todo.classList.add("show");
    SFX.select();
  }
  await sleep(700);
  const t = ov.querySelector(".endtag");
  t.textContent = tag;
  if (/GAME OVER/.test(tag)) t.classList.add("bad");
  t.classList.add("show");
  SFX.card();
  await sleep(1500);
  ov.querySelector(".hint").classList.add("show");
  state.endReady = true;
}

function overlayInput() {
  if (!state.endReady) { state.skip = true; return; }
  $("overlay").className = "";
  if (state.retry) busy(() => startChapter(CH));
  else boot();
}
$("overlay").addEventListener("click", overlayInput);
document.addEventListener("keydown", e => {
  if ($("overlay").classList.contains("on") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); overlayInput(); return; }
  if (isBusy() && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); fast = true; }
});

// 初めての人には、師匠が handle コマンドの使い方を教える（コマンド入力のチュートリアルを兼ねる）
async function titleCommand(raw) {
  print(`<span class="ps">${esc($("prompt").textContent)}</span> ${esc(raw)}`, "echo");
  const [name, ...rest] = raw.trim().split(/\s+/);
  if (!name) return;
  const c = name.toLowerCase(), arg = rest.join(" ");
  if (c === "handle") {
    if (!arg) return speak(["[師匠] 名前も一緒に打て。例えば handle anonymous"]);
    const h = arg.normalize("NFKC").trim();
    if ([...h].length > 16 || /\s/.test(h)) return speak(["[師匠] 呼び名は16文字まで、空白なしだ。"]);
    state.mode = { type: "handleConfirm", name: h, autoCode: state.mode.autoCode };
    setPrompt("決定する？ [y/n]");
    return speak([`[師匠] 「${h}」……それでいいんだな？`]);
  }
  if (!handle) return speak(["[師匠] まずは呼び名だ。handle と打って、その後ろに名前。例えば handle anonymous"]);
  if (c === "help") {
    const rows = [["connect <回線コード>", "師匠から受け取った回線につなぐ"], ["handle <名前>", "呼び名を変える"]]
      .map(([k, d]) => `<span class="n">${esc(k)}</span><span>${esc(d)}</span>`).join("");
    return print(`<div class="ls">${rows}</div>`);
  }
  if (c === "connect" && !arg) return print("使い方：connect &lt;回線コード&gt;", "dim");
  const code = c === "connect" ? arg : raw.trim(); // コードだけ打っても通す
  if (NZ.norm(code) === NZ.norm(EXAMPLE_CODE)) return idiotLine();
  if (S.author && NZ.norm(code) === NZ.norm(S.author.handle)) return authorLine();
  if (NZ.norm(code) === "uzu") return uzuLine();
  if (["師匠", "ししょう", "shishou", "shisho"].includes(NZ.norm(code))) return mentorLine();
  return connectLine(code);
}

// 本物っぽい接続の演出だけを見せる（小ネタ用）
// opt.hops：たどる中継点（最後が行き先）、opt.loop：出発点に戻ってきた（接続完了の代わりに警告を出す）
async function fakeRoute(dest, opt = {}) {
  const hops = opt.hops || ["uzu://safehouse", "tor-entry.anon", dest];
  const line = print("", "dim");
  for (let i = 0; i < 10; i++) { line.textContent = `回線コードを照合中... ${randHex(6)}`; SFX.tick(); await wait(60); }
  line.textContent = "回線コードを照合中... done";
  for (const [i, hop] of hops.entries()) {
    const last = i === hops.length - 1;
    const l = print(`  ${last ? "└" : "├"}─ ${esc(hop)} `, "dim");
    for (let k = 0; k < 6; k++) { await wait(32); l.innerHTML += "▓"; }
    l.innerHTML += ` <span class="sys">${20 + Math.floor(Math.random() * 180)}ms OK</span>`;
    SFX.hop(i);
    await wait(110);
  }
  if (opt.loop) {
    // 出発点に戻ってきた：エラーとして接続を止める
    await wait(250);
    SFX.denied();
    pulse($("wrap"), "shake", 450);
    print("[ERROR] 回線がループしています", "alert");
    await wait(350);
    print("[ERROR] 接続を停止しました。", "alert");
  } else {
    print(`[+] 接続完了：${esc(dest)}`, "sys");
  }
  await wait(900);
}

async function confirmHandle(raw) {
  const m = state.mode, v = raw.trim();
  print(`<span class="ps">決定する？ [y/n]</span> ${esc(raw)}`, "echo");
  if (/^(y|yes|はい)$/i.test(v)) {
    handle = m.name;
    try { localStorage.setItem("uzu-handle", handle); } catch {}
    SFX.granted();
    state.mode = { type: "title" };
    setPrompt(titlePrompt());
    await speak([`[師匠] よし、${handle}。覚えた。`, `[師匠] 次は回線だ。俺が渡したコードを、connect のあとに打て。connect ${EXAMPLE_CODE} のようにな。`]);
    if (m.autoCode) await autoConnect(m.autoCode);
    return;
  }
  if (/^(n|no|いいえ)$/i.test(v)) {
    state.mode = { type: "title", autoCode: m.autoCode };
    setPrompt(titlePrompt());
    return speak(["[師匠] なら、もう一度だ。handle のあとに名前を打て。"]);
  }
  print("y か n で答えてください。", "dim");
}

// uzu から渡されたリンク（?line=）のときは、connect コマンドが自動で打たれる
async function autoConnect(code) {
  await wait(400);
  cmd.value = "";
  for (const ch of `connect ${code}`) { cmd.value += ch; SFX.key(); await wait(45); }
  await wait(250);
  const raw = cmd.value;
  cmd.value = "";
  SFX.enter();
  await titleCommand(raw);
}

// 回線コードを照合して、任務を始める
async function connectLine(code) {
  {
    const ch = await busy(async () => {
      const line = print("", "dim");
      let done = false;
      const anim = (async () => {
        while (!done) { line.textContent = `回線コードを照合中... ${randHex(6)}`; SFX.tick(); await sleep(60); }
      })();
      const [found] = await Promise.all([openChapter(code), sleep(700)]);
      done = true;
      await anim;
      line.textContent = "回線コードを照合中... done";
      return found;
    });
    if (!ch) {
      SFX.denied();
      pulse($("wrap"), "shake", 450);
      return print("回線コードが違います。師匠に確認してください。", "alert");
    }
    state.mode = null;
    return startChapter(ch);
  }
}

async function run(raw) {
  const mode = state.mode;
  if (mode?.type === "title") return titleCommand(raw);
  if (mode?.type === "handleConfirm") return confirmHandle(raw);
  // 何も入力しない／back と打つと、認証をやめて戻る（トレースは上がらない）
  const quit = !raw.trim() || /^(back|exit|cancel)$/i.test(raw.trim());
  if (mode?.type === "user") {
    if (quit) return cancelAuth();
    const lock = nodeOf(mode.id).lock;
    print(`<span class="ps">${esc(mode.label)}:</span> ${esc(raw)}`, "echo");
    const r = checkUser(lock, raw);
    if (r.error) {
      SFX.denied();
      print(esc(r.error), "alert");
      return askUser(mode.id, mode.opt);
    }
    SFX.enter();
    return askPass(mode.id, mode.opt, r.account);
  }
  if (mode?.type === "password") {
    if (quit) return cancelAuth();
    state.mode = null;
    const node = nodeOf(mode.id);
    const shown = node.lock.prompt ? esc(raw) : "*".repeat([...raw].length);
    print(`<span class="ps">${esc(mode.label)}:</span> ${shown}`, "echo");
    // 照合中の演出（復号が終わるまで、鍵がくるくる回る）
    const opened = await busy(async () => {
      const line = print("", "dim");
      let done = false;
      const anim = (async () => {
        while (!done) { line.textContent = `decrypting ${randHex(10)}`; SFX.tick(); await sleep(50); }
      })();
      // ユーザーID がある鍵では、パスワードの持ち主の ID のときだけ照合する
      const owner = !node.lock.user || mode.user === node.lock.user.owner;
      const [result] = await Promise.all([owner ? tryUnlock(node, raw) : null, sleep(900)]);
      done = true;
      await anim;
      line.remove();
      return result;
    });
    if (opened) {
      state.opened.set(mode.id, opened);
      SFX.granted();
      pulse($("term"), "flash-ok", 600);
      print(panelHtml("unlock", "UNLOCKED", `ACCESS GRANTED ── ${esc(node.host)}`));
      addLog(`AUTH OK  ${node.host}`);
      // 南京錠が開くのを見届けてから（目標が済んだら、それも見せてから）、中へ入る
      await wait(1600);
      await busy(() => checkObjectives());
      return enterNode(mode.id, mode.opt);
    }
    SFX.denied();
    print(panelHtml("deny", "DENIED", "ACCESS DENIED ── 認証に失敗しました"));
    addLog(`AUTH FAIL  ${node.host}`, "bad");
    addTrace(node.lock.penalty ?? 10);
    // 入力画面のまま、続けてもう一度打てる（接続が切られたときを除く）
    if (!state.over) askPass(mode.id, mode.opt, mode.user);
    return;
  }
  if (mode?.type === "confirm") {
    state.mode = null;
    print(`<span class="ps">続けますか？ [y/N]</span> ${esc(raw)}`, "echo");
    if (/^y(es)?$/i.test(raw.trim())) return connect(mode.id, { oneway: true });
    print("中止しました。", "dim");
    printLinks();
    return normalPrompt();
  }

  print(`<span class="ps">${esc($("prompt").textContent)}</span> ${esc(raw)}`, "echo");
  const [name, ...args] = raw.trim().split(/\s+/);
  if (!name) return;
  state.cmdLog.push({ t: clockText(), c: raw.trim() });
  const fn = COMMANDS[name.toLowerCase()];
  if (!fn) return print(`${esc(name)}: コマンドが見つかりません（help で一覧）`, "alert");
  await fn(args.join(" "));
}

// Tab 補完：1語目はコマンド、ssh の後は接続先、cd の後はフォルダ
function complete() {
  const v = cmd.value;
  const node = here();
  const m = v.match(/^\s*(\S+)\s+(\S*)$/);
  let pool, prefix, head;
  if (m && /^ssh$/i.test(m[1])) pool = state.links.map(l => l.name);
  else if (m && /^cd$/i.test(m[1])) pool = node.dir ? node.dir.map(d => d.name) : state.links.map(l => l.name);
  else if (!m && /^\s*\S*$/.test(v)) pool = ["ssh", "back", "help", "ls", ...(node.search ? ["search"] : []), ...(node.dir ? ["cd"] : [])];
  else return;
  if (m) { prefix = m[2]; head = v.slice(0, v.length - prefix.length); }
  else { prefix = v.trim(); head = ""; }
  const hits = pool.filter(p => p.toLowerCase().startsWith(prefix.toLowerCase()));
  if (hits.length === 1) cmd.value = head + hits[0] + (m ? "" : " ");
  else if (hits.length > 1) print(hits.map(esc).join("    "), "dim");
}

// ---------------- 入力 ----------------
const hist = [];
let histPos = 0;

$("form").onsubmit = async e => {
  e.preventDefault();
  SFX.wake();
  if (isBusy()) { fast = true; return; }
  if (state.over) return;
  const raw = cmd.value;
  cmd.value = "";
  SFX.enter();
  const plain = !state.mode;
  if (plain && raw.trim()) hist.push(raw);
  histPos = hist.length;
  // コマンドの処理（演出を含む）が終わるまで、次の入力は受け付けない
  await busy(() => run(raw));
  if (plain) maybeNoise();
};

// パスワード入力中は、打った文字数を [5/17] のように出す
cmd.addEventListener("input", e => {
  if (state?.mode?.type === "password") passPrompt();
  // 日本語入力（変換中）は keydown では文字キーとして来ないので、入力のたびにここで鳴らす
  if (e.isComposing || e.inputType === "insertCompositionText" || e.inputType === "deleteCompositionText") SFX.key();
});
// 変換を確定したときも鳴らす
cmd.addEventListener("compositionend", () => SFX.key());

cmd.addEventListener("keydown", e => {
  const inGame = CH && !state.mode;
  // 普通のキー入力（日本語の変換中は input のほうで鳴らすので、ここでは鳴らさない）
  if (!e.isComposing && e.key !== "Process" && (e.key.length === 1 || e.key === "Backspace")) SFX.key();
  if (e.key === "Escape" && ["user", "password"].includes(state.mode?.type)) { e.preventDefault(); cancelAuth(); }
  else if (e.key === "Tab") { e.preventDefault(); if (inGame) complete(); }
  else if (e.key === "ArrowUp" && inGame && histPos > 0) { e.preventDefault(); cmd.value = hist[--histPos]; }
  else if (e.key === "ArrowDown" && inGame) {
    e.preventDefault();
    histPos = Math.min(hist.length, histPos + 1);
    cmd.value = hist[histPos] ?? "";
  }
});

  if (pick) {
    if ("cancel" in pick.dataset || "reuser" in pick.dataset) SFX.select();
    if ("cancel" in pick.dataset) return cancelAuth();

      print("ユーザーIDを入力し直します。", "dim");
      cmd.value = "";
      return askUser(state.mode.id, state.mode.opt);

    if (["user", "password"].includes(state.mode?.type)) return;
    cmd.value = pick.dataset.fill;
    SFX.select();
    if (finePointer || cmd.value.endsWith(" ")) cmd.focus(); else cmd.blur();
    return;
  }
  if (!getSelection().toString()) cmd.focus();
});

// 見ている目：瞳がマウス（指）を追いかける
function lookAt(x, y) {
  document.querySelectorAll(".eye i").forEach(p => {
    const r = p.parentElement.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy) || 1;
    p.style.transform = `translate(${dx / d * Math.min(48, d / 6)}px, ${dy / d * Math.min(16, d / 12)}px)`;
  });
}
document.addEventListener("pointermove", e => lookAt(e.clientX, e.clientY));
document.addEventListener("touchstart", e => lookAt(e.touches[0].clientX, e.touches[0].clientY), { passive: true });

function freshState() {

    current: null, history: [], visited: new Set(), opened: new Map(), links: [], said: new Set(), clues: [], cmdLog: [],
    trace: 0, minutes: 0, commands: 0, objIdx: 0, objShown: false, over: false, mode: null, skip: false, endReady: false, retry: false,

}

// 待機中、3.5〜8.5秒に一度、タイトルに一瞬ノイズを走らせる（タイトルが画面から消えたら止まる）
let titleNoiseTimer = null;
function titleNoise(el) {
  clearTimeout(titleNoiseTimer);
  if (!el || REDUCED) return;
  titleNoiseTimer = setTimeout(() => {
    if (!document.body.contains(el)) return;
    el.classList.remove("noise");
    void el.offsetWidth;
    el.classList.add("noise");
    setTimeout(() => el.classList.remove("noise"), 340);
    titleNoise(el);
  }, 3500 + Math.random() * 5000);
}

  resetScreen();
  await busy(async () => {
    // タイトルの登場：光の線が伸びる → 線から文字が開く → 線が下線になる → 光が横切る → 副題（動きは CSS、音はここで合わせる）
    const t = esc(S.title);
    const styled = t.replace("//", `<span class="tl-sep">//</span>`); // 「//」だけ控えめな色に
    const logo = print(`<div class="title-logo" data-text="${t}"><span class="tl-text">${styled}</span>`
      + `<span class="tl-shine" aria-hidden="true">${t}</span><span class="tl-noise"></span><span class="tl-line"></span></div>`
      + `<div class="subtitle">ANON-NET TERMINAL</div>`);
    SFX.titleLine();     // 0秒：細い光の線が伸びる「シュン」
    await wait(450);
    SFX.titleOpen();     // 0.45秒：文字が開く。低く温かい音がふくらむ
    await wait(1900);    // 2.35秒：副題まで出そろう
    titleNoise(logo.querySelector(".title-logo"));
    for (const l of ["[ ok ] kernel modules", "[ ok ] tor client  3 guards", "[ ok ] relay  uzu://safehouse … online"]) {
      await wait(140);
      print(esc(l), "dim");
      SFX.tick();
    }
    await wait(300);
    // 初めての人：師匠がハンドル名の決め方（＝コマンドの打ち方）を教える
    if (!handle) {
      await speak([
        "[師匠] ……繋がったな。聞こえるか。",
        "[師匠] 始める前に、お前の呼び名を決めておく。本名は使うなよ。",
        "[師匠] handle と打って、その後ろに名前だ。例えば handle anonymous",
      ]);
    } else {
      await speak([`[師匠] おかえり、${handle}。`, "[師匠] 回線コードは、connect のあとに打て。"]);
    }
  });
  if (DEV) {
    const rows = Object.values(S.chapters).map(ch =>
      `<span class="n pick" data-fill="connect ${esc(ch.code)}">${esc(ch.code)}</span><span>${esc(ch.label)}</span>`).join("");
    print(`<span class="warn">[開発モード] 回線コード一覧</span><div class="ls">${rows}</div>`);
  }
  // ハンドル名がまだなら、決まってから自動で接続する
  state.mode = { type: "title", autoCode: handle ? null : autoCode };
  setPrompt(titlePrompt());
  focusCmd();
  if (autoCode && handle) busy(() => autoConnect(autoCode));
}

try {
  S = await loadScenario();
} catch (err) {
  print(`シナリオを読み込めませんでした：${esc(err.message)}`, "alert");
  return;
}
$("gameTitle").textContent = S.title;
document.title = S.title;
// ページを開いたら、まず「CLICK TO CONNECT」を出す。押したら起動の演出（と音）を始める
showGate(() => boot(params.get("line")));

function showGate(start) {
  const g = $("gate");
  g.innerHTML = `<div class="gate-inner">
    <div class="gate-title">${esc(S.title)}</div>
    <div class="gate-cta">▶ CLICK TO CONNECT</div>
    <div class="gate-note">クリック / タップ / Enter で接続（音が出ます）</div>
  </div>`;
  g.className = "on";
  const go = e => {
    if (e.type === "keydown") {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
    }
    g.removeEventListener("click", go);
    document.removeEventListener("keydown", go);
    SFX.wake();
    SFX.select();
    g.classList.add("leaving");
    setTimeout(() => { g.className = ""; g.innerHTML = ""; start(); }, 450);
  };
  g.addEventListener("click", go);
  document.addEventListener("keydown", go);
}
})();
</script>
</body>
