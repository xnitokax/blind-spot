<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLIND//SPOT</title>
<!-- 製作者のサイン用の筆記体（connect nitoka の小ネタでだけ使う） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap">
<style>
  :root {
    --bg: #05090a; --panel: #0b1214; --line: #1c3a34;
    --fg: #b8f5d8; --dim: #5d8f7c; --accent: #3dffa8; --alert: #ff4d6a; --warn: #ffc14d; --voice: #8fc8ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "BIZ UDGothic", "Consolas", "MS Gothic", monospace;
    font-size: 15px; line-height: 1.7; overflow: hidden;
  }
  /* ブラウン管：走査線と周辺の暗がり */
  body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40; }
  body::before { background: repeating-linear-gradient(to bottom, rgba(255,255,255,.03) 0 1px, transparent 1px 3px); }
  body::after { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6)); }

  .wrap {
    max-width: 1100px; height: 100%; margin: 0 auto; padding: 16px;
    display: grid; grid-template-columns: 1fr 260px; grid-template-rows: auto 1fr; gap: 16px;
  }
  header { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  header h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: .2em; text-shadow: 0 0 10px rgba(61,255,168,.5); flex: 1; }
  #mute, #bgm {
    font: inherit; font-size: 12px; background: transparent; color: var(--dim); border: 1px solid var(--line);
    border-radius: 4px; padding: 2px 8px; cursor: pointer;
  }
  #mute:hover, #bgm:hover { color: var(--accent); border-color: var(--accent); }
  #bgm.off { text-decoration: line-through; opacity: .6; }
  /* 師匠が流している曲 */
  #np { font-size: 12px; color: var(--voice); opacity: 0; transition: opacity 1s; white-space: nowrap; }
  #np.on { opacity: 1; animation: npPulse 2.2s ease-in-out infinite; }
  @keyframes npPulse { 50% { opacity: .55; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-height: 0; }
  h2 { font-size: 13px; color: var(--dim); margin: 0 0 6px; letter-spacing: .1em; font-weight: normal; }

  /* ターミナル */
  #term { overflow-y: auto; cursor: text; text-shadow: 0 0 6px rgba(61,255,168,.22); }
  .line { white-space: pre-wrap; word-break: break-word; }
  .line.node { white-space: normal; }
  .echo { color: var(--fg); }
  /* 自分が打ったコマンドの行：上に余白を入れて、あとから「ここで何をしたか」を見つけやすくする */
  .line.echo { margin-top: 18px; }
  .echo .ps, .ps { color: var(--accent); }
  .dim { color: var(--dim); }
  .sys { color: var(--accent); }
  .alert { color: var(--alert); text-shadow: 0 0 8px rgba(255,77,106,.5); }
  .warn { color: var(--warn); }
  .meta { color: var(--dim); font-size: 13px; margin: 0; }
  .node-head { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .node-head b { font-size: 17px; font-weight: normal; }
  /* 移動先のアドレス：はっきりした緑で光らせて、「ここに移動した」感じを出す */
  .node-head .host { color: var(--accent); font-size: 14px; letter-spacing: .06em; text-shadow: 0 0 10px rgba(61,255,168,.6); }
  /* 今いる場所でできること：本文と間を空け、中はきゅっと詰める */
  .menu { margin-top: 26px; font-size: 14px; line-height: 1.5; white-space: normal; }
  .menu .ls { margin: 0; row-gap: 0; }
  .doc { border-left: 2px solid var(--line); padding: 2px 12px; margin: 10px 0; white-space: normal; }
  .doc p { margin: 4px 0; }
  .node p { margin: 6px 0; white-space: normal; }
  .log { background: #000; border: 1px solid var(--line); padding: 10px; overflow-x: auto; font-size: 13px; margin: 8px 0; white-space: pre; }
  .doc .log { margin: 4px 0; }
  .tlink { color: var(--accent); border-bottom: 1px dashed var(--accent); }
  .tag { color: var(--accent); }
  .ls { display: grid; grid-template-columns: max-content 1fr; column-gap: 20px; row-gap: 2px; margin: 8px 0 4px; }
  .ls .n { color: var(--accent); }
  .ls .ow { color: var(--warn); }
  /* 師匠のセリフ */
  .say { color: var(--voice); padding-left: 3.6em; text-indent: -3.6em; text-shadow: 0 0 8px rgba(143,200,255,.35); }
  /* 師匠のセリフは帯で囲み、前後に隙間を空ける（続けてしゃべるときは隙間なしで1つのかたまりに） */
  .line.say {
    background: rgba(143,200,255,.07); border-left: 2px solid rgba(143,200,255,.55);
    padding: 3px 10px 3px calc(3.6em + 10px); margin-top: 12px;
  }
  .line.say + .line.say { margin-top: 0; }
  .line.say + .line:not(.say) { margin-top: 12px; }
  .line.say + .line.echo { margin-top: 18px; } /* 師匠のセリフの後でも、自分が打った行の上は同じ余白に */
  .say .who { display: inline-block; width: 3.6em; text-indent: 0; color: var(--dim); }
  .say .who::before { content: "▸ "; color: var(--voice); }
  .noise { font-size: 12px; opacity: .85; }
  /* タップ／クリックで入力欄にコマンドが入る */
  .pick { cursor: pointer; border-radius: 3px; padding: 1px 5px; margin: -1px -5px; }
  .pick:hover, .pick:active { background: var(--accent); color: var(--bg); text-shadow: none; }
  .ow.pick:hover, .ow.pick:active { background: var(--warn); }
  #run {
    font: inherit; font-size: 14px; background: transparent; color: var(--accent); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 12px; cursor: pointer;
  }
  #run:hover { border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: baseline; }
  #cmd {
    flex: 1; min-width: 0; font: inherit; background: transparent; color: var(--fg); border: none; outline: none; padding: 0;
    caret-color: var(--accent); text-shadow: inherit;
  }
  #cmd.ghost { color: var(--alert); }

  /* 入力欄と「NEXT」欄：画面の下に固定して、次にできることを常に見せる */
  #term { padding-bottom: 0; }
  .dock {
    position: sticky; bottom: 0; z-index: 2; background: var(--panel);
    margin-top: 10px; padding: 8px 0 14px; border-top: 1px dashed var(--line);
    transition: opacity .3s;
  }
  .dock.busy #next { opacity: .3; pointer-events: none; }
  #next { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  #next:empty { display: none; }
  #next .next-label { color: var(--dim); font-size: 11px; letter-spacing: .25em; margin-right: 2px; }
  #next .chip {
    margin: 0; padding: 1px 9px; border: 1px solid var(--line); border-radius: 12px; color: var(--accent);
    white-space: nowrap; text-shadow: none;
  }
  #next .chip.ow, #next .chip.warn { color: var(--warn); border-color: rgba(255,193,77,.4); }
  #next .chip.go { border-color: rgba(61,255,168,.45); }

  /* タイトル */
  .title-logo {
    font-size: clamp(30px, 8vw, 60px); letter-spacing: .12em; color: var(--accent); margin: 18px 0 6px; line-height: 1.2;
    text-shadow: 0 0 22px rgba(61,255,168,.45);
  }
  /* 待機中、ときどきロゴにノイズが走る（JS が .noise を一瞬だけ付ける）
     赤と青に切れたロゴの破片が横にずれ、細かい走査線の帯が上から下へ通り抜ける */
  .title-logo::before, .title-logo::after {
    content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; white-space: nowrap;
    pointer-events: none; text-shadow: none; opacity: 0;
  }
  .title-logo::before { color: #ff2d6f; }
  .title-logo::after { color: #2de2ff; }
  .title-logo.noise::before { animation: tnA .32s steps(1); }
  .title-logo.noise::after { animation: tnB .32s steps(1); }
  .title-logo.noise { animation: tnShake .32s steps(1); }
  @keyframes tnA {
    0%   { opacity: .85; clip-path: inset(18% 0 62% 0); transform: translateX(-9px); }
    25%  { clip-path: inset(62% 0 14% 0); transform: translateX(7px); }
    50%  { clip-path: inset(38% 0 42% 0); transform: translateX(-5px); }
    75%  { clip-path: inset(4% 0 82% 0);  transform: translateX(3px); }
    100% { opacity: 0; }
  }
  @keyframes tnB {
    0%   { opacity: .85; clip-path: inset(55% 0 25% 0); transform: translateX(8px); }
    25%  { clip-path: inset(10% 0 72% 0); transform: translateX(-6px); }
    50%  { clip-path: inset(72% 0 6% 0);  transform: translateX(4px); }
    75%  { clip-path: inset(30% 0 50% 0); transform: translateX(-3px); }
    100% { opacity: 0; }
  }
  @keyframes tnShake { 0% { transform: translateX(2px) skewX(-6deg); } 40% { transform: translateX(-2px); } 70% { transform: none; } }
  .title-logo .tl-noise {
    position: absolute; left: -2%; right: -2%; top: -20%; height: 22%; pointer-events: none; opacity: 0;
    background: repeating-linear-gradient(to bottom, rgba(184,245,216,.35) 0 1px, transparent 1px 3px);
    mix-blend-mode: screen;
  }
  .title-logo.noise .tl-noise { animation: tnBand .32s linear; }
  @keyframes tnBand { 0% { top: -20%; opacity: .9; } 100% { top: 100%; opacity: .2; } }
  .subtitle { color: var(--dim); letter-spacing: .3em; font-size: 12px; margin-bottom: 14px; animation: tlSub 1s 1.6s ease-out both; }

  /* タイトルの登場（約2.3秒・スタイリッシュに）：
     細い光の線が真ん中から伸びる → 線から上下に開くように文字が現れ、文字間がきゅっと詰まる
     → 線は下に降りて下線になる → 光が文字の上を横切る → 副題 */
  .title-logo { position: relative; display: inline-block; }
  .title-logo .tl-text {
    display: inline-block; opacity: 0; letter-spacing: .5em; clip-path: inset(50% 0 50% 0);
    animation: tlOpen 1s .45s cubic-bezier(.2, .7, .2, 1) forwards;
  }
  @keyframes tlOpen {
    0%   { opacity: .7; clip-path: inset(50% 0 50% 0); letter-spacing: .5em; filter: blur(3px); }
    55%  { clip-path: inset(0 0 0 0); }
    100% { opacity: 1; clip-path: inset(0 0 0 0); letter-spacing: .12em; filter: none; }
  }
  /* 「//」だけ白っぽく控えめに */
  .title-logo .tl-sep { color: var(--fg); opacity: .55; text-shadow: none; }
  /* 光の線：真ん中から左右へ伸び、そのまま下に降りて下線になる */
  .title-logo .tl-line {
    position: absolute; left: 0; right: 0; top: 50%; height: 1px; transform: scaleX(0);
    background: linear-gradient(90deg, transparent, var(--accent), transparent); box-shadow: 0 0 10px var(--accent);
    animation: tlLineIn .5s cubic-bezier(.3, .7, .2, 1) forwards, tlLineDrop .6s .9s cubic-bezier(.5, 0, .2, 1) forwards;
  }
  @keyframes tlLineIn { to { transform: scaleX(1); } }
  @keyframes tlLineDrop { to { top: calc(100% + 4px); opacity: .6; } }
  /* 光の帯：文字の上だけを、左から右へサッと横切る */
  .title-logo .tl-shine {
    position: absolute; left: 0; top: 0; color: transparent; text-shadow: none; pointer-events: none; white-space: nowrap;
    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.8) 50%, transparent 62%);
    background-size: 300% 100%; background-position: 150% 0; -webkit-background-clip: text; background-clip: text;
    animation: tlShine .9s 1.5s ease-in-out both;
  }
  @keyframes tlShine { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  @keyframes tlSub { from { opacity: 0; letter-spacing: .7em; } to { opacity: 1; letter-spacing: .3em; } }

  /* 任務開始のカード */
  .mission {
    border: 1px solid var(--warn); border-radius: 4px; padding: 10px 16px; margin: 12px 0; position: relative;
    background: linear-gradient(90deg, rgba(255,193,77,.08), transparent 70%); animation: cardIn .6s ease-out;
    white-space: normal;
  }
  .mission .m-label { color: var(--warn); font-size: 12px; letter-spacing: .5em; }
  .mission .m-title { font-size: 22px; color: var(--warn); letter-spacing: .12em; text-shadow: 0 0 14px rgba(255,193,77,.5); }
  .mission .m-obj { margin-top: 4px; }
  .mission .m-meta { color: var(--dim); font-size: 12px; }
  .mission .m-case { color: var(--fg); opacity: .8; font-size: 13px; margin-top: 2px; }
  @keyframes cardIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  /* ロック画面：真ん中に LOCKED のパネル（広がって点き、南京錠が閉まり、赤く脈打つ） */
  .auth { white-space: normal; margin: 14px 0 6px; }
  /* 状態パネル：lock / deny は赤、unlock / found は緑、warn は黄 */
  .spanel { --c: var(--alert); --bg: rgba(255,77,106,.08); --scan: rgba(255,77,106,.22); white-space: normal; margin: 14px 0 6px; }
  .spanel.unlock, .spanel.found { --c: var(--accent); --bg: rgba(61,255,168,.07); --scan: rgba(61,255,168,.2); }
  .spanel.warn { --c: var(--warn); --bg: rgba(255,193,77,.08); --scan: rgba(255,193,77,.2); }
  .auth .spanel { margin: 6px 0 0; }
  .lockpanel {
    position: relative; overflow: hidden; width: fit-content; max-width: 100%; margin: 0 auto;
    display: flex; align-items: center; gap: 14px; padding: 10px 30px;
    color: var(--c); border: 1px solid var(--c); border-radius: 4px; background: var(--bg);
    box-shadow: 0 0 22px -6px var(--c), 0 0 16px -8px var(--c) inset;
    animation: lockIn .5s ease-out both, lockPulse 2.2s .9s ease-in-out infinite;
  }
  /* 走査線が上から下へ流れ続ける */
  .lockpanel::after {
    content: ""; position: absolute; left: 0; right: 0; top: -40%; height: 40%;
    background: linear-gradient(to bottom, transparent, var(--scan), transparent);
    animation: lockScan 2.6s linear infinite;
  }
  .lock-title { font-size: 26px; letter-spacing: .5em; margin-right: -.5em; text-shadow: 0 0 14px currentColor; }
  .spanel .icon { width: 24px; height: 26px; flex: none; filter: drop-shadow(0 0 6px currentColor); }
  .spanel.lock .shackle { animation: shackleClose .35s .35s cubic-bezier(.5, 0, .7, 1.6) both; }
  .spanel.unlock .shackle { animation: shackleOpen .4s .35s cubic-bezier(.3, 1.6, .6, 1) both; }
  .spanel.deny .lockpanel { animation: lockIn .5s ease-out both, denyShake .4s .45s both, lockPulse 2.2s 1s ease-in-out infinite; }
  .lock-sub { text-align: center; color: var(--c); opacity: .75; font-size: 11px; letter-spacing: .25em; margin-top: 6px; }
  @keyframes lockIn {
    0% { transform: scaleX(0); opacity: 0; }
    40% { transform: scaleX(1.04); opacity: 1; filter: brightness(2.5); }
    55% { opacity: .4; }
    70% { opacity: 1; filter: none; }
    100% { transform: none; }
  }
  @keyframes lockPulse { 50% { box-shadow: 0 0 30px -4px var(--c), 0 0 20px -6px var(--c) inset; } }
  @keyframes lockScan { to { top: 100%; } }
  @keyframes shackleClose { from { transform: translateY(-5px); } to { transform: none; } }
  @keyframes shackleOpen { from { transform: none; } to { transform: translateY(-5px); } }
  @keyframes denyShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .auth-need { font-size: 17px; color: var(--warn); margin: 18px 0 10px; letter-spacing: .05em; }
  .auth-hint { line-height: 1.7; }
  .auth-fields {
    display: grid; grid-template-columns: max-content 1fr; column-gap: 16px; row-gap: 2px;
    margin: 12px 0 0; padding: 6px 12px; border-left: 2px solid var(--line); background: rgba(255,255,255,.02);
  }
  .auth-fields .slots { letter-spacing: .2em; white-space: nowrap; }
  .auth-notes { color: var(--dim); font-size: 12px; margin-top: 12px; line-height: 1.7; }
  .auth-choice { display: flex; gap: 22px; }

  /* 小ネタ：師匠（＝製作者）のプロフィール */
  .profile {
    white-space: normal; margin: 14px 0; padding: 12px 16px; max-width: 520px;
    border: 1px solid rgba(143,200,255,.45); border-radius: 4px; background: rgba(143,200,255,.05);
    box-shadow: 0 0 20px -8px var(--voice); animation: cardIn .6s ease-out;
  }
  .pf-head { color: var(--voice); font-size: 12px; letter-spacing: .3em; }
  .pf-role { color: var(--fg); font-size: 16px; margin: 4px 0 10px; }
  .pf-fields { display: grid; grid-template-columns: max-content 1fr; column-gap: 16px; row-gap: 3px; font-size: 14px; }
  .pf-link { color: var(--voice); }
  .pf-msg { color: var(--voice); line-height: 1.9; margin: 10px 0 4px; }
  .profile .pf-fields { margin-top: 10px; padding-top: 8px; border-top: 1px dashed rgba(143,200,255,.25); font-size: 12px; }
  /* サイン：オレンジの筆記体。ペンで書いていくように左から右へ現れ、書き終わりに一瞬強く光る */
  .pf-sign { display: flex; justify-content: flex-end; height: 64px; }
  .pf-sign svg {
    height: 64px; width: auto; overflow: visible;
    clip-path: inset(-20% 100% -20% -5%);
    animation: signReveal 1.3s cubic-bezier(.3, .15, .6, 1) forwards, signGlow .9s 1.25s ease-out both;
  }
  .pf-sign text { font-size: 50px; fill: #ff9a3c; }
  @keyframes signReveal { to { clip-path: inset(-20% -5% -20% -5%); } }
  @keyframes signGlow {
    0% { filter: drop-shadow(0 0 6px rgba(255,122,26,.75)); }
    30% { filter: drop-shadow(0 0 14px rgba(255,150,60,1)) brightness(1.3); }
    100% { filter: drop-shadow(0 0 6px rgba(255,122,26,.75)); }
  }

  /* 検索：scanning は小さく、見出しは「何を探したか」を大きく、件数は小さく */
  .scan { font-size: 12px; margin-top: 4px; }
  .res-head { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 14px; margin: 10px 0 2px; }
  .res-title { color: var(--accent); font-size: 16px; text-shadow: 0 0 8px rgba(61,255,168,.35); }
  .res-count { color: var(--dim); font-size: 12px; }
  .res-head.none .res-title { color: var(--dim); text-shadow: none; }
  .line.result .doc { margin: 8px 0; }

  /* 移動したときの見出し：前の操作と間を空け、場所の名前を大きく */
  .node-head { margin-top: 34px; padding-top: 14px; }
  .node-head b { font-size: 19px; letter-spacing: .04em; }
  .line.node:not(.result) { margin-top: 6px; }

  /* cd で開いたフォルダの中身 */
  .dirview { white-space: normal; margin: 10px 0 4px; }
  .dir-path { color: var(--accent); font-size: 14px; }
  .dir-files { margin-top: 4px; padding-left: 12px; border-left: 2px solid var(--line); font-size: 14px; line-height: 1.6; }
  .dir-empty { color: var(--warn); }

  /* 予測ファイル・予測済のコマンド：列をそろえた表 */
  .sec-head { color: var(--dim); font-size: 11px; letter-spacing: .3em; margin: 14px 0 4px; }
  .pred { display: grid; grid-template-columns: 5.2em 1fr 4em; column-gap: 12px; white-space: normal; }
  .pred .p { color: var(--dim); text-align: right; }
  .rep { display: grid; grid-template-columns: 3.4em 3.6em 1fr; column-gap: 12px; white-space: normal; }

  /* 手がかり */
  /* 1つずつ出すときの、ふわっと浮かび上がる動き */
  .reveal { animation: revealIn .35s ease-out both; }
  @keyframes revealIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .evidence { color: var(--warn); white-space: normal; }
  .evi-card {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; width: fit-content; max-width: 100%;
    margin: 8px 0; padding: 4px 12px 4px 4px; border: 1px solid rgba(255,193,77,.35); border-radius: 3px;
    background: rgba(255,193,77,.05); animation: evidenceIn .8s ease-out;
  }
  .evi-tag { background: var(--warn); color: var(--bg); padding: 0 6px; font-size: 12px; letter-spacing: .12em; text-shadow: none; }
  .evi-n { color: var(--dim); font-size: 12px; }
  @keyframes evidenceIn { 0% { background: rgba(255,193,77,.35); } 100% { background: transparent; } }

  /* ニュース */
  .news { border-left: 3px solid var(--voice); padding: 2px 12px; margin: 6px 0; background: rgba(143,200,255,.05); animation: slideIn .4s ease-out; }
  .news .meta { font-size: 11px; }
  @keyframes slideIn { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* 見ている目（マウスを追いかける） */
  .eye-wrap { display: flex; flex-direction: column; align-items: center; margin: 20px 0; gap: 8px; }
  .eye {
    width: 180px; height: 90px; position: relative; border-radius: 50%; border: 2px solid var(--alert); overflow: hidden;
    background: radial-gradient(ellipse at center, #1a0006, #000 70%);
    box-shadow: 0 0 34px rgba(255,77,106,.55), inset 0 0 22px rgba(255,77,106,.45);
    animation: eyeOpen 1.4s ease-out, eyeBlink 5s 1.4s infinite;
  }
  .eye i {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
    background: radial-gradient(circle, #000 28%, var(--alert) 31%, #6a0014 62%, #2a0008 72%); transition: transform .12s;
  }
  .eye-cap { color: var(--alert); letter-spacing: .6em; font-size: 13px; }
  @keyframes eyeOpen { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes eyeBlink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.04); } }

  /* トレースメーター */
  .trace-label { display: flex; justify-content: space-between; font-size: 13px; }
  .bar { height: 10px; background: #000; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin: 4px 0 16px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s, background .6s; box-shadow: 0 0 10px currentColor; }
  .bar.racing i { transition: width .1s linear, background .3s; }
  aside.danger .bar { animation: dangerBar .8s infinite; }
  aside.danger #traceNum { color: var(--alert); animation: blink .8s steps(1) infinite; }
  @keyframes dangerBar { 50% { box-shadow: 0 0 14px var(--alert); border-color: var(--alert); } }
  /* アクセスログと手がかり */
  #log { list-style: none; padding: 0; margin: 0 0 14px; font-size: 12px; max-height: 32vh; overflow-y: auto; }
  #log li, #evi li { color: var(--dim); border-bottom: 1px dotted var(--line); padding: 2px 0; }
  #log li.bad { color: var(--alert); }
  #log li.ow { color: var(--warn); }
  #evi { list-style: none; padding: 0; margin: 0; font-size: 12px; max-height: 42vh; overflow-y: auto; }
  #evi li { color: var(--warn); }
  #evi li.new { animation: evidenceIn 1.6s ease-out; }
  .evi-head { display: flex; justify-content: space-between; }
  /* 右の欄の目標：全体の目標 → 任務の目的 → 済んだ目標 → 今の目標（＋手がかり） → 気になること */
  #evi .o-sec { color: var(--dim); font-size: 10px; letter-spacing: .3em; margin-top: 8px; border: 0; padding: 0; }
  #evi .o-sec:first-child { margin-top: 0; }
  #evi .o-case { color: var(--fg); border: 0; padding: 0 0 2px; }
  #evi .o-mission { color: var(--fg); opacity: .75; border: 0; padding: 0 0 2px; }
  #evi .o-done { color: var(--dim); }
  #evi .o-done::before { content: "✔ "; color: var(--accent); }
  #evi .o-now { color: var(--warn); border: 1px solid rgba(255,193,77,.4); border-radius: 3px; padding: 3px 6px; margin-top: 4px; background: rgba(255,193,77,.06); }
  #evi .o-n { float: right; color: var(--dim); }
  #evi .o-clue { padding-left: 1.2em; text-indent: -1.2em; border-bottom: 0; }
  #evi .o-clue.miss { color: var(--dim); opacity: .6; }
  #evi .o-side { color: var(--voice); margin-top: 4px; }
  #evi .o-side ~ .o-clue:not(.miss) { color: var(--voice); }

  /* 目標の達成・次の目標（ターミナルに出るカード） */
  .obj-card {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; width: fit-content; max-width: 100%;
    margin: 10px 0; padding: 5px 14px 5px 5px; border: 1px solid rgba(61,255,168,.45); border-radius: 3px;
    background: linear-gradient(90deg, rgba(61,255,168,.1), transparent 80%); animation: cardIn .5s ease-out; white-space: normal;
  }
  .obj-card .o-tag { background: var(--accent); color: var(--bg); padding: 0 6px; font-size: 12px; letter-spacing: .14em; text-shadow: none; }
  .obj-card.next { border-color: rgba(255,193,77,.5); background: linear-gradient(90deg, rgba(255,193,77,.08), transparent 80%); }
  .obj-card.next .o-tag { background: var(--warn); }
  .obj-card .o-text { color: var(--fg); letter-spacing: .06em; }
  .obj-card.clear .o-text { color: var(--accent); }

  .flash { animation: flash .5s 2; }
  @keyframes flash { 50% { background: #3a0a12; } }
  .flash-ok { animation: flashOk .6s; }
  @keyframes flashOk { 30% { background: #0a3a24; } }
  .shake { animation: shake .45s; }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 0); } 20%, 80% { transform: translate(4px, 1px); }
    30%, 50%, 70% { transform: translate(-6px, -1px); } 40%, 60% { transform: translate(6px, 1px); }
  }
  .jolt { animation: jolt .16s steps(2); }
  @keyframes jolt { 50% { transform: translate(2px, -1px); filter: hue-rotate(120deg) saturate(3); } }

  /* 回線をつなぐ演出 */
  .warp { animation: warp .8s ease-out; }
  @keyframes warp {
    0%   { filter: blur(8px) brightness(2.6); transform: scale(1.05); }
    40%  { filter: blur(1px) hue-rotate(40deg); transform: scale(.99); }
    100% { filter: none; transform: none; }
  }
  /* 画面が消える（ブラウン管の電源を切ったように） */
  .crt-off { animation: crtOff .75s forwards ease-in; }
  @keyframes crtOff {
    0% { transform: none; filter: none; }
    55% { transform: scale(1, .004); filter: brightness(5); }
    100% { transform: scale(0, .004); filter: brightness(8); opacity: 0; }
  }

  /* 逆ハッキング・接続遮断 */
  .glitch { animation: glitch .14s steps(2) infinite; }
  @keyframes glitch {
    0%   { transform: translate(0, 0); filter: none; }
    25%  { transform: translate(-4px, 2px); filter: hue-rotate(90deg) saturate(3); }
    50%  { transform: translate(3px, -2px); filter: invert(1); }
    75%  { transform: translate(-2px, -1px); filter: hue-rotate(-60deg); }
    100% { transform: translate(2px, 1px); filter: none; }
  }
  .unstable { animation: unstable 1.8s steps(1) infinite; }
  @keyframes unstable {
    0%, 100% { transform: none; filter: none; }
    82% { transform: translate(-3px, 1px); filter: hue-rotate(80deg) saturate(2.5); }
    86% { transform: translate(2px, -1px); filter: invert(.9); }
    90% { transform: none; filter: none; }
  }
  /* 画面全体の色（赤＝警報、青＝師匠が回線を奪い返した） */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 35; opacity: 0; transition: opacity .6s; }
  body.red #fx { opacity: 1; background: radial-gradient(ellipse at center, rgba(255,0,40,.06), rgba(255,0,40,.38)); animation: redPulse 1s infinite; }
  body.blue #fx { opacity: 1; background: radial-gradient(ellipse at center, rgba(80,160,255,.04), rgba(80,160,255,.3)); }
  @keyframes redPulse { 50% { opacity: .45; } }

  /* 最初の「CLICK TO CONNECT」画面（ここを押した瞬間から音が出せるので、入場の演出と音がぴったり合う） */
  #gate {
    position: fixed; inset: 0; z-index: 38; background: #000; display: none;
    align-items: center; justify-content: center; cursor: pointer;
  }
  #gate.on { display: flex; }
  #gate.leaving { animation: gateOut .45s ease-out forwards; }
  @keyframes gateOut { 0% { opacity: 1; } 25% { opacity: 1; background: #0d2a20; } 100% { opacity: 0; } }
  #gate .gate-inner { text-align: center; padding: 24px; }
  #gate .gate-title {
    color: var(--accent); letter-spacing: .3em; font-size: clamp(22px, 6vw, 40px); opacity: .35;
    text-shadow: 0 0 18px rgba(61,255,168,.4); margin-bottom: 28px;
  }
  #gate .gate-cta { color: var(--accent); letter-spacing: .35em; font-size: 16px; animation: blink 1.4s steps(1) infinite; }
  #gate .gate-note { color: var(--dim); font-size: 12px; margin-top: 18px; letter-spacing: .1em; }

  #overlay {
    position: fixed; inset: 0; z-index: 30; background: #000; display: none;
    overflow-y: auto; cursor: pointer; opacity: 0; transition: opacity 1s;
  }
  #overlay.on { display: flex; }
  #overlay.visible { opacity: 1; }
  #overlay.cut { transition: none; }
  #overlay .inner { margin: auto; max-width: 640px; padding: 48px 24px 80px; }
  #overlay .text { white-space: pre-wrap; line-height: 2.1; font-size: 16px; min-height: 1em; }
  #overlay .text::after { content: "▌"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  #overlay.typed .text::after { content: ""; }
  @keyframes blink { 50% { opacity: 0; } }
  #overlay .clues { margin-top: 32px; font-size: 13px; }
  #overlay .clues ul { margin: 6px 0 0; padding-left: 1.4em; }
  #overlay .clues li { color: var(--warn); list-style: "◆ "; animation: slideIn .4s ease-out; line-height: 1.8; }
  #overlay .clue-head { color: var(--dim); font-size: 11px; letter-spacing: .3em; }
  #overlay .clue-head span { letter-spacing: .05em; margin-left: 12px; font-size: 12px; }
  /* 次にやること：別枠で目立たせる */
  #overlay .todo {
    display: none; align-items: center; gap: 12px; margin-top: 28px; padding: 10px 14px;
    border: 1px solid rgba(61,255,168,.45); border-radius: 4px; background: rgba(61,255,168,.06);
    color: var(--accent); font-size: 15px; animation: slideIn .5s ease-out;
  }
  #overlay .todo.show { display: flex; }
  #overlay .todo-tag { background: var(--accent); color: var(--bg); font-size: 11px; letter-spacing: .2em; padding: 1px 7px; flex: none; }
  #overlay .endtag {
    margin-top: 40px; text-align: center; font-size: 28px; letter-spacing: .3em; color: var(--accent);
    opacity: 0; transform: scale(1.3); transition: opacity 2s, transform 2s; text-shadow: 0 0 18px currentColor;
  }
  #overlay .endtag.show { opacity: 1; transform: none; }
  #overlay .endtag.bad { color: var(--alert); }
  #overlay .hint { margin-top: 48px; text-align: center; color: var(--dim); font-size: 13px; opacity: 0; transition: opacity 1s; }
  #overlay .hint.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .wrap, .title-logo, .unstable, .glitch, body.red #fx { animation: none !important; }
    .title-logo .tl-shine { display: none; }
    .title-logo .tl-text { animation: none !important; opacity: 1; clip-path: none; letter-spacing: .12em; }
    .subtitle { animation: none !important; opacity: 1; }
    .title-logo .tl-line { animation: none !important; transform: none; top: calc(100% + 4px); }
  }

  /* スマホ：TRACE は1行、アクセスログは最新1件だけ（タップで開閉）
     ※ 上の通常ルールを上書きするため、必ずスタイルの最後に置く */
  @media (max-width: 800px) {
    .wrap { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: 100dvh; padding: 12px; gap: 8px; }
    header { order: -2; padding-bottom: 6px; }
    header h1 { font-size: 15px; letter-spacing: .1em; }
    header { gap: 6px; }
    #np { width: 1em; overflow: hidden; }
    #mute, #bgm { font-size: 11px; padding: 1px 5px; }
    #clock { font-size: 11px; }
    #term { padding: 12px 12px 0; }
    aside {
      order: -1; padding: 8px 12px; cursor: pointer;
      display: grid; grid-template-columns: max-content 1fr max-content max-content; column-gap: 10px; align-items: center;
    }
    aside::after { content: "▾"; color: var(--dim); font-size: 12px; grid-row: 1; grid-column: 4; }
    /* 手がかりの数は TRACE と同じ1行目に「◆ 2/3」とだけ出す */
    aside h2.evi-head { display: block; grid-row: 1; grid-column: 3; margin: 0; font-size: 12px; }
    aside h2.evi-head span:first-child { display: none; }
    #eviCount { color: var(--warn); }
    #eviCount:not(:empty)::before { content: "◆ "; }
    aside.open::after { content: "▴"; }
    .trace-label { gap: 8px; }
    .bar { margin: 0; }
    aside h2 { display: none; }
    /* スマホ：NEXT 欄は1行で、横にスクロール */
    #next { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #next::-webkit-scrollbar { display: none; }
    #log { grid-column: 1 / -1; max-height: 1.8em; overflow: hidden; margin: 4px 0 0; }
    #log li { border-bottom: none; padding: 0; }
    aside.open #log { max-height: 25vh; overflow-y: auto; }
    aside.open #log li { border-bottom: 1px dotted var(--line); padding: 2px 0; }
    #evi { display: none; grid-column: 1 / -1; }
    aside.open #evi { display: block; max-height: 20vh; margin-top: 6px; }
    .mission .m-title { font-size: 18px; }
    .lockpanel { padding: 8px 18px; gap: 10px; }
    .lock-title { font-size: 20px; letter-spacing: .35em; margin-right: -.35em; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <h1 id="gameTitle">BLIND//SPOT</h1>
    <span id="np" aria-live="polite">♪ 師匠のプレイリスト</span>
    <button id="bgm" type="button" aria-label="BGM のオン・オフ">BGM ON</button>
    <button id="mute" type="button" aria-label="音のオン・オフ">SOUND ON</button>
    <span id="clock" class="meta"></span>
  </header>

  <main class="panel" id="term">
    <div id="out"></div>
    <div class="dock" id="dock">
      <div id="next" aria-label="次にできること"></div>
      <form class="row" id="form" autocomplete="off">
        <span class="ps" id="prompt"></span>
        <input id="cmd" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" enterkeyhint="go" aria-label="コマンド入力">
        <button id="run" type="submit" aria-label="実行">⏎</button>
      </form>
    </div>
  </main>

  <aside class="panel" id="side">
    <div class="trace-label"><span>TRACE（逆探知）</span><span id="traceNum">0%</span></div>
    <div class="bar"><i id="traceBar"></i></div>
    <h2>ACCESS LOG</h2>
    <ul id="log"></ul>
    <h2 class="evi-head"><span>CASE FILE</span><span id="eviCount"></span></h2>
    <ul id="evi"></ul>
  </aside>
</div>

<div id="fx"></div>
<div id="overlay"></div>
<div id="gate"></div>

<script src="nz-crypto.js"></script>
<script src="scenario.data.js"></script>
<script>
// =========================================================
//  エンジン（シナリオは src/scenario.js 側で編集 → tools/build.html でビルド）
//  ?dev を付けて開くと、ビルドせずに src/scenario.js を直接読み込む
//  ?line=回線コード を付けて開くと、その任務から始まる（uzu から渡すリンク用）
//
//  流れ：回線コードを入力 → 回線をつなぐ演出 → 任務 → 任務完了 → uzu に戻って報告
//  操作はターミナルのコマンド。ssh（接続）、back（戻る）、search（検索）、cd（フォルダ移動）
//  演出中は画面をクリック（または Enter）すると早送りできる
// =========================================================

// ---------------- 効果音（Web Audio でその場で合成する。音声ファイルは使わない） ----------------
// 方針：ピコピコした矩形波は使わない。サイン波・フィルターをかけたノイズ・低音で、映画の UI のような質感にする
const SFX = (() => {
  let ctx = null, out = null, echo = null, noiseBuf = null, siren = null;
  let muted = false, bgmOn = true, bgmWant = false, bgm = null;
  // ブラウザは、ページを一度も触っていない間は音を出させない（その間の音は一時停止して溜まる）。
  // 溜まった音が最初のクリックでまとめて鳴らないよう、触るまでの効果音は鳴らさずに捨てる
  let touched = false;
  const canPlay = c => touched || c.state === "running";
  try { muted = localStorage.getItem("uzu-muted") === "1"; bgmOn = localStorage.getItem("uzu-bgm") !== "0"; } catch {}

  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
      // 全体：音量 → コンプレッサー（大きな音をまとめる）→ スピーカー
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -6; comp.ratio.value = 8; // 大きくしても音が割れないように押さえる
      out = ctx.createGain();
      out.gain.value = 2.7; // 全体の音量（効果音はここで決まる）
      out.connect(comp).connect(ctx.destination);
      // エコー：音が空間に残る感じ
      const delay = ctx.createDelay(1), fb = ctx.createGain(), lp = ctx.createBiquadFilter(), wet = ctx.createGain();
      delay.delayTime.value = 0.28; fb.gain.value = 0.38; lp.type = "lowpass"; lp.frequency.value = 2200; wet.gain.value = 0.5;
      echo = ctx.createGain();
      echo.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(wet); wet.connect(out);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function env(g, t, vol, dur, attack = 0.004) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function route(node, o) {
    node.connect(out);
    if (o.echo) { const s = ctx.createGain(); s.gain.value = o.echo; node.connect(s).connect(echo); }
  }
  // 音程のある音（既定はサイン波。filter を付けるとこもった音になる）
  function tone(freq, dur, o = {}) {
    if (muted) return;
    const c = ac(); if (!c || !canPlay(c)) return;
    const t = c.currentTime + (o.at || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    env(g, t, o.vol ?? 0.1, dur, o.attack);
    let last = osc;
    if (o.filter) { const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = o.filter; last = last.connect(f); }
    last.connect(g);
    route(g, o);
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  // ノイズ（フィルターで「ザッ」「ゴォ」「カチ」などに変える。sweep で周波数を動かす）
  function hiss(dur, o = {}) {
    if (muted) return;
    const c = ac(); if (!c || !canPlay(c)) return;
    const t = c.currentTime + (o.at || 0);
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const f = c.createBiquadFilter();
    f.type = o.filter || "bandpass"; f.frequency.setValueAtTime(o.freq || 2000, t); f.Q.value = o.q ?? 1;
    if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
    const g = c.createGain(); env(g, t, o.vol ?? 0.1, dur, o.attack);
    src.connect(f).connect(g);
    route(g, o);
    src.start(t, Math.random()); src.stop(t + dur + 0.05);
  }

  const api = {
    get muted() { return muted; },
    toggle() {
      muted = !muted;
      try { localStorage.setItem("uzu-muted", muted ? "1" : "0"); } catch {}
      if (muted) this.siren(false); else ac();
      applyBgm();
      return muted;
    },
    // 最初にクリック・タップ・キー入力をしたときに呼ぶ。ここから先の音は鳴らす
    wake() { touched = true; if (!muted) ac(); },
    // キー入力：乾いたクリックに、少しだけ芯のある音を重ねる
    key: () => { hiss(0.014, { vol: 0.075, freq: 4800, q: 1.2 }); tone(1900 + Math.random() * 300, 0.012, { vol: 0.02 }); },
    // 師匠の無線：行の頭で一度だけ「ザッ」
    radio: () => { hiss(0.1, { vol: 0.07, freq: 1700, q: 2.5 }); tone(2800, 0.035, { vol: 0.012 }); },
    tick: () => tone(3400, 0.008, { vol: 0.02 }),
    // Enter：低い「トン」と、軽いクリック
    enter: () => { tone(160, 0.1, { vol: 0.18 }); hiss(0.025, { vol: 0.06, freq: 3000 }); },
    // 名前やボタンを選んだとき：近未来の画面のような、ガラスをはじいた澄んだ短い音
    select: () => {
      tone(180, 0.035, { vol: 0.05 });                                    // 低い「トッ」で輪郭をつける
      hiss(0.01, { vol: 0.03, filter: "highpass", freq: 8000 });          // 空気感のある細いノイズ
      tone(2637, 0.08, { vol: 0.03, echo: 0.3 });                         // 高い音（ミ）
      tone(3951, 0.06, { vol: 0.018, at: 0.014, echo: 0.3 });             // 少しずらして5度上（シ）を重ねる
    },
    // ボタンにカーソルを合わせたとき：選んだときの音と同じ系統の、小さく短い「チッ」
    hover: () => {
      hiss(0.006, { vol: 0.015, filter: "highpass", freq: 9000 });
      tone(3951, 0.025, { vol: 0.01 });
    },
    // 中継点を通過：ソナーのような短いピン
    hop: i => tone(1320 + i * 40, 0.14, { vol: 0.05, echo: 0.5 }),
    // 転移：低い地鳴りと、こもった音が開いていくノイズ
    warp: () => {
      tone(42, 1.4, { vol: 0.3, slide: 30, attack: 0.05 });
      hiss(1.1, { vol: 0.12, filter: "lowpass", freq: 180, sweep: 5500, q: 0.7, attack: 0.6, echo: 0.3 });
    },
    // 任務開始のカード・結末の見出し：重い一撃と、高い残響
    card: () => {
      tone(55, 1.8, { vol: 0.38, slide: 36 });
      hiss(0.5, { vol: 0.14, filter: "lowpass", freq: 900, sweep: 120 });

    objective: () => {

    },
    static: () => hiss(0.18, { vol: 0.09, freq: 1200, q: 0.6 }),
    power: () => { tone(900, 0.6, { vol: 0.07, slide: 40 }); hiss(0.2, { vol: 0.07, filter: "lowpass", freq: 1500 }); },
    boom: () => {
      tone(48, 2.2, { vol: 0.45, slide: 26 });

    // 警報：こもったうねり
    siren(on) {

      const c = ac(); if (!c) return;
      const osc = c.createOscillator(), lfo = c.createOscillator(), depth = c.createGain(), f = c.createBiquadFilter(), g = c.createGain();

    },
    // BGM：師匠が流している音楽。on / off は「流したい」という希望で、音を消している間は鳴らさない
    music(on, opt = {}) { bgmWant = on; applyBgm(opt); },
    get bgmOn() { return bgmOn; },
    get bgmPlaying() { return !!bgm; },
    toggleBgm() {
      bgmOn = !bgmOn;
      try { localStorage.setItem("uzu-bgm", bgmOn ? "1" : "0"); } catch {}

      return bgmOn;
    },
    // 師匠がしゃべる間は、少しだけ音量を下げる
    duck(on) {

      bgm.bus.gain.setTargetAtTime(on ? BGM_VOL * 0.45 : BGM_VOL, t, 0.15);
    },
    onBgmChange: null,
  };

  // ---------------- BGM の演奏 ----------------
  // 作業に集中できる、落ち着いたロー・ファイ寄りの曲。長く聞いても疲れないように：
  //   ・テンポはゆっくり（88）。ドラムは柔らかく小さく、少しだけハネさせる
  //   ・和音は Am9 → Fmaj7 → Dm9 → Em7 を2小節ずつ。こもった柔らかい音で、ゆっくり息をするように揺れる
  //   ・メロディは毎回その場で作る（前の音の近くの音を選ぶので、フレーズに聞こえる）。同じくり返しにならない
  //   ・最初の4小節はドラムなし。32小節（約1分半）ごとに、ドラムが抜けて静かになる区間がある
  function applyBgm(opt = {}) {
    const play = bgmWant && bgmOn && !muted;
    if (play && !bgm) startBgm();
    else if (!play && bgm) stopBgm(opt);
    api.onBgmChange?.();
  }

  // BGM_VOL は全体の音量に対する BGM の割合（効果音より控えめに、後ろで小さく流れる程度）
  const BPM = 88, STEP = 60 / BPM / 4, BGM_VOL = 0.021;
  const SWING = STEP * 0.18; // 裏の16分を少し遅らせて、機械っぽさを消す
  const CHORDS = [
    { root: 55.00, pad: [261.63, 329.63, 392.00, 493.88], mel: [440.00, 493.88, 523.25, 659.25, 783.99] }, // Am9
    { root: 43.65, pad: [220.00, 261.63, 329.63, 392.00], mel: [440.00, 523.25, 659.25, 783.99] },         // Fmaj7
    { root: 73.42, pad: [174.61, 220.00, 261.63, 329.63], mel: [440.00, 523.25, 587.33, 659.25] },         // Dm9
    { root: 82.41, pad: [196.00, 246.94, 293.66, 392.00], mel: [392.00, 493.88, 587.33, 659.25] },         // Em7
  ];

  function startBgm() {
    const c = ac(); if (!c) return;
    const t = c.currentTime;
    // ラジオのつまみを回したように、こもった音から開いていく
    const bus = c.createGain(), lp = c.createBiquadFilter();
    bus.gain.setValueAtTime(0.0001, t);
    bus.gain.exponentialRampToValueAtTime(BGM_VOL, t + 3);
    lp.type = "lowpass"; lp.frequency.setValueAtTime(300, t); lp.frequency.exponentialRampToValueAtTime(14000, t + 5);
    bus.connect(lp).connect(out);
    // BGM 専用の残響（BGM の音量・フェード・テープ停止がそのまま効くよう、bus に戻す）
    const bgmEcho = c.createGain(), delay = c.createDelay(1), fb = c.createGain(), elp = c.createBiquadFilter();
    delay.delayTime.value = STEP * 3; fb.gain.value = 0.38; elp.type = "lowpass"; elp.frequency.value = 1600;
    bgmEcho.connect(delay); delay.connect(elp); elp.connect(fb); fb.connect(delay); elp.connect(bus);
    bgm = { bus, lp, echo: bgmEcho, step: 0, next: t + 0.1, timer: null, mel: 2, rest: 0 };
    bgm.timer = setInterval(scheduleBgm, 25);
    scheduleBgm();
  }
  function stopBgm(opt = {}) {
    const b = bgm; bgm = null;
    const t = ctx.currentTime;
    clearInterval(b.timer);
    if (opt.tape) {
      // テープが止まるように、音がしぼんで途切れる
      b.lp.frequency.cancelScheduledValues(t);
      b.lp.frequency.setValueAtTime(b.lp.frequency.value, t);
      b.lp.frequency.exponentialRampToValueAtTime(80, t + 0.5);
      b.bus.gain.cancelScheduledValues(t);
      b.bus.gain.setValueAtTime(b.bus.gain.value || BGM_VOL, t);
      b.bus.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    } else {
      b.bus.gain.cancelScheduledValues(t);
      b.bus.gain.setValueAtTime(b.bus.gain.value || BGM_VOL, t);
      b.bus.gain.exponentialRampToValueAtTime(0.0001, t + (opt.fast ? 0.05 : 1.5));
    }
    setTimeout(() => { try { b.bus.disconnect(); } catch {} }, 2000);
  }
  // 少し先の分まで、音符を予約しておく（タブが裏に回ってタイマーが遅れても途切れにくいよう多めに）
  function scheduleBgm() {
    if (!bgm) return;
    // まだ音を出せない間は曲を先に進めない（触った時点から、曲の頭が自然に始まる）
    if (!canPlay(ctx)) { bgm.next = ctx.currentTime + 0.1; return; }
    const ahead = document.hidden ? 1.5 : 0.15;
    while (bgm.next < ctx.currentTime + ahead) {
      playStep(bgm.step, bgm.next);
      bgm.next += STEP;
      bgm.step++;
    }
  }
  function playStep(n, t) {
    const s = n % 16, bar = Math.floor(n / 16), ch = CHORDS[Math.floor(bar / 2) % 4], bus = bgm.bus;
    const tt = s % 2 ? t + SWING : t;       // 裏拍だけ少し遅らせる
    const calm = bar < 4 || bar % 32 >= 28; // 最初の4小節と、32小節ごとの静かな区間
    // 和音とベースは2小節ごとに、長く伸ばす
    if (s === 0 && bar % 2 === 0) { pad(bus, t, ch.pad, STEP * 32); sub(bus, t, ch.root, STEP * 31); }
    if (!calm) {
      if (s === 0 || s === 10) kick(bus, t, s === 0 ? 1 : 0.7);
      if (s === 4 || s === 12) rim(bus, t);
    }
    if (bar >= 2 && !calm) shaker(bus, tt, s % 4 === 2 ? 1 : 0.45 + Math.random() * 0.3);
    // メロディ：8分の位置で、ときどきポロンと鳴らす（静かな区間は少し多め）
    if (s % 2 === 0 && bar >= 2 && Math.random() < (calm ? 0.22 : 0.13)) {
      if (bgm.rest > 0) { bgm.rest--; return; }
      const pool = ch.mel;
      const moves = [-1, -1, 0, 1, 1, 2];
      bgm.mel = Math.max(0, Math.min(pool.length - 1, bgm.mel + moves[Math.floor(Math.random() * moves.length)]));
      keys(bus, tt, pool[bgm.mel]);
      if (Math.random() < 0.3) bgm.rest = 2; // フレーズの切れ目で少し休む
    }
  }
  function voice(bus, t, dur, vol, build, attack = 0.005) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(bus);
    build(g);
    return g;
  }
  // キック：短く柔らかい「トッ」
  function kick(bus, t, v) {
    voice(bus, t, 0.3, 0.55 * v, g => {
      const o = ctx.createOscillator();
      o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.12);
      o.connect(g); o.start(t); o.stop(t + 0.32);
    });
  }
  // リムショット：残響つきの小さな「コッ」
  function rim(bus, t) {
    const g = voice(bus, t, 0.06, 0.1, g => {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf;
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2600; f.Q.value = 5;
      src.connect(f).connect(g); src.start(t, Math.random()); src.stop(t + 0.08);
      const o = ctx.createOscillator(); o.frequency.value = 1700;
      const og = ctx.createGain(); og.gain.value = 0.3;
      o.connect(og).connect(g); o.start(t); o.stop(t + 0.03);
    });
    const s = ctx.createGain(); s.gain.value = 0.35; g.connect(s).connect(bgm.echo);
  }
  // シェイカー：ごく小さな「シャッ」
  function shaker(bus, t, v) {
    voice(bus, t, 0.05, 0.012 * v, g => {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf;
      const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 6500;
      src.connect(f).connect(g); src.start(t, Math.random()); src.stop(t + 0.07);
    }, 0.012);
  }
  // ベース：刻まずに低く伸ばす（小さいスピーカーでも聞こえるよう、1オクターブ上を少し重ねる）
  function sub(bus, t, freq, dur) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.15);
    g.gain.exponentialRampToValueAtTime(0.18, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(bus);
    const o = ctx.createOscillator(); o.frequency.value = freq; o.connect(g);
    const o2 = ctx.createOscillator(); o2.type = "triangle"; o2.frequency.value = freq * 2;
    const g2 = ctx.createGain(); g2.gain.value = 0.25; o2.connect(g2).connect(g);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  // 和音：こもった柔らかい音で、ゆっくり息をするように明るさが揺れる
  function pad(bus, t, notes, dur) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.035, t + 1.4);
    g.gain.setValueAtTime(0.035, t + dur - 0.2);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 1.6); // 次の和音と重なりながら消える
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 0.5;
    f.frequency.setValueAtTime(450, t);
    f.frequency.linearRampToValueAtTime(900, t + dur * 0.5);
    f.frequency.linearRampToValueAtTime(500, t + dur);
    f.connect(g).connect(bus);
    for (const note of notes) {
      for (const d of [0.997, 1.003]) {
        const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = note * d;
        o.connect(f); o.start(t); o.stop(t + dur + 1.7);
      }
    }
  }
  // メロディ：エレピやベルのような柔らかい音（1オクターブ上をうっすら重ねる）。残響多め
  function keys(bus, t, freq) {
    const g = voice(bus, t, 1.4, 0.06, g => {
      const o = ctx.createOscillator(); o.frequency.value = freq; o.connect(g);
      const o2 = ctx.createOscillator(); o2.frequency.value = freq * 2;
      const g2 = ctx.createGain(); g2.gain.setValueAtTime(0.35, t); g2.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
      o2.connect(g2).connect(g);
      o.start(t); o2.start(t); o.stop(t + 1.45); o2.stop(t + 1.45);
    }, 0.008);
    const s = ctx.createGain(); s.gain.value = 0.55; g.connect(s).connect(bgm.echo);
  }

  return api;
})();

(async () => {
const $ = id => document.getElementById(id);
const out = $("out"), cmd = $("cmd");
const params = new URLSearchParams(location.search);
const DEV = params.has("dev");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const finePointer = matchMedia("(pointer: fine)").matches;
let S, CH, state;
// プレイヤーのハンドル名（最初に師匠に聞かれて決める。ブラウザに覚えておく）
// シナリオの文章に {handle} と書くと、この名前に置きかわる
let handle = "";
try { handle = localStorage.getItem("uzu-handle") || ""; } catch {}
const who = () => handle || "guest";
const fill = s => String(s).replaceAll("{handle}", who());
const titlePrompt = () => `${who()}@safehouse:~$`;
let fast = false; // 演出の早送り中

const sleep = ms => new Promise(r => setTimeout(r, ms));
const wait = ms => sleep(fast ? Math.min(ms, 30) : ms); // 早送りできる待ち時間
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lower = s => String(s).normalize("NFKC").toLowerCase();
const pickOne = s => s[Math.floor(Math.random() * s.length)];
const randHex = n => Array.from({ length: n }, () => Math.floor(Math.random() * 256).toString(16).padStart(2, "0")).join(" ");
const randIp = () => `${pickOne([185, 193, 45, 104, 203])}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`;

function loadScript(src) {
  return new Promise((ok, ng) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => ng(new Error(src + " を読み込めません"));
    document.head.appendChild(s);
  });
}

async function loadScenario() {
  if (DEV) {
    await loadScript("../src/scenario.js");
    return SCENARIO;
  }
  if (!window.SCENARIO_DATA) throw new Error("scenario.data.js がありません（tools/build.html でビルドしてください）");
  return window.SCENARIO_DATA;
}

// 回線コードで任務を開く：開発モードは平文比較、公開データは復号
async function openChapter(code) {
  const c = NZ.norm(code);
  if (!c) return null;
  if (DEV) {
    const hit = Object.entries(S.chapters).find(([, ch]) => NZ.norm(ch.code) === c);
    return hit ? { id: hit[0], ...hit[1] } : null;
  }
  for (const box of S.chapters) {
    const text = await NZ.unlock(box, c);
    if (text !== null) return JSON.parse(text);
  }
  return null;
}

// 鍵付きノード：開けたら中身を合わせたノードを返す
async function tryUnlock(node, input) {
  const v = NZ.norm(input);
  if ("pass" in node.lock) return [].concat(node.lock.pass).map(NZ.norm).includes(v) ? node : null;
  for (const box of node.lock.boxes) {
    const text = await NZ.unlock(box, v);
    if (text !== null) return { ...node, ...JSON.parse(text) };
  }
  return null;
}

const nodeOf = id => state.opened.get(id) || CH.nodes[id];
const here = () => nodeOf(state.current);

// ---------------- 入力のロック ----------------
// 演出の途中はコマンドを受け付けない（入れ子で呼んでもよい）
let busyDepth = 0;
const isBusy = () => busyDepth > 0;
function focusCmd() { if (finePointer) cmd.focus(); }
async function busy(fn) {
  busyDepth++;
  cmd.disabled = true;
  $("dock").classList.add("busy");
  try {
    return await fn();
  } finally {
    if (--busyDepth <= 0) {
      busyDepth = 0;
      fast = false;
      $("dock").classList.remove("busy");
      if (!state.over) { cmd.disabled = false; focusCmd(); }
    }
  }
}

// ---------------- NEXT 欄：次にできることを、入力欄の上に常に出す ----------------
function chip(fill, label, cls = "") {
  return `<span class="chip pick ${cls}" data-fill="${esc(fill)}">${esc(label ?? fill)}</span>`;
}
function updateNext() {
  const box = $("next");
  const mode = state?.mode;
  let chips = [];
  if (mode?.type === "title") {
    // タイトル画面：ハンドル名が決まるまでは handle、決まったら connect を案内する
    chips = handle
      ? [chip("connect ", "connect 回線コード…", "go"), chip("handle ", "handle（呼び名を変える）")]
      : [chip("handle ", "handle 名前…", "go")];
  } else if (mode?.type === "handleConfirm") {
    chips = [chip("y", "y 決定", "go"), chip("n", "n 入れ直す")];
  } else if (!CH || state.over) {
    box.innerHTML = "";
    return;
  } else if (mode?.type === "user" || mode?.type === "password") {
    chips = [`<span class="chip pick warn" data-cancel>やめる（入力しない）</span>`];
    if (mode.type === "password" && mode.user) chips.push(`<span class="chip pick" data-reuser>ユーザーIDを変える</span>`);
  } else if (mode?.type === "confirm") {
    chips = [chip("y", "y 進む", "ow"), chip("n", "n やめる")];
  } else if (state.current) {
    const node = here();
    if (node.search) chips.push(chip("search ", "search 〇〇", "go"));
    for (const d of node.dir || []) chips.push(chip(`cd ${d.name}`));
    for (const l of state.links) chips.push(chip(`ssh ${l.name}`, `ssh ${l.name}${l.oneway ? "（一方通行）" : ""}`, l.oneway ? "ow" : ""));
    if (state.history.length) chips.push(chip("back"));
  }
  box.innerHTML = chips.length ? `<span class="next-label">NEXT</span>${chips.join("")}` : "";
  // NEXT 欄の高さが変わると最後の行が隠れるので、いちばん下までスクロールし直す
  scrollDown();
}

// 演出で行の中身があとから伸びても（照合中… など）、いちばん下についていく。

let followBottom = true;
$("term").addEventListener("scroll", () => {
  const t = $("term");
  followBottom = t.scrollHeight - t.scrollTop - t.clientHeight < 40;
});
if (window.ResizeObserver) {
  const ro = new ResizeObserver(() => { if (followBottom) scrollDown(); });
  ro.observe($("out"));
  ro.observe($("dock"));
}
function pulse(el, cls, ms = 600) {
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

// 文字化けした状態から、左から順に正しい文字に戻っていく（解読の演出）
const GLYPH_A = "!#$%&*+=?@0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
const GLYPH_W = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン";
const glyphFor = ch => /\s/.test(ch) ? ch : ch.charCodeAt(0) < 0x2000 ? pickOne(GLYPH_A) : pickOne(GLYPH_W);
function textNodes(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.trim() ? 1 : 3 });
  const list = [];
  while (w.nextNode()) list.push(w.currentNode);
  return list;
}
async function decode(el, ms = 450) {
  if (REDUCED || fast) return;
  const nodes = textNodes(el);
  const orig = nodes.map(n => [...n.nodeValue]);
  const frames = Math.max(4, Math.round(ms / 30));
  for (let f = 1; f <= frames; f++) {
    if (fast) break;
    const p = f / frames;
    nodes.forEach((n, i) => {
      const o = orig[i], k = Math.floor(o.length * p);
      n.nodeValue = o.slice(0, k).join("") + o.slice(k).map(glyphFor).join("");
    });
    await sleep(30);
  }
  nodes.forEach((n, i) => { n.nodeValue = orig[i].join(""); });
}

// 台本の1行：[師匠] はセリフ、[!] は警告、[*] [+] はシステム。1文字ずつ打ち出す
function lineParts(s) {
  s = fill(s);
  if (s.startsWith("[師匠]")) return { cls: "say", text: s.replace(/^\[師匠\]\s*/, ""), say: true };
  if (s.startsWith("[!")) return { cls: "alert", text: s };
  if (/^\[[*+]\]/.test(s)) return { cls: "sys", text: s };
  return { cls: "", text: s };
}
function printLine(s) {
  const { cls, text, say } = lineParts(s);
  return print(say ? `<span class="who">師匠</span>${esc(text)}` : esc(text), cls);
}
// 師匠がしゃべっている間だけ BGM を少し下げる（しゃべり終わって少ししたら戻す）
let duckTimer = null;
function duckBgm(ms = 2600) {
  SFX.duck(true);
  clearTimeout(duckTimer);
  duckTimer = setTimeout(() => SFX.duck(false), ms);
}

// opt.charMs：1文字ごとの間隔を指定する（「…………」をゆっくり出すときなど）
async function typeLine(s, opt = {}) {
  const { cls, text, say } = lineParts(s);
  const d = print(say ? `<span class="who">師匠</span><span class="t"></span>` : `<span class="t"></span>`, cls);
  const t = d.querySelector(".t");
  if (cls === "alert") SFX.alert();
  if (say) { SFX.radio(); duckBgm(); }
  const chars = [...text];
  for (let i = 0; i < chars.length; i++) {
    if (fast || REDUCED) break;
    t.textContent += chars[i];
    if (i % 6 === 0) scrollDown();
    await sleep(opt.charMs ?? ("。、…！？".includes(chars[i]) ? 90 : say ? 28 : 16));
  }
  t.textContent = text;
  scrollDown();
  return d;
}
// beat：話し始める前の「間」。出来事のあとに余韻を残してから、師匠が口を開く
async function speak(lines, beat = 0) {
  if (!lines?.length) return;
  await busy(async () => {
    if (beat) await wait(beat);
    for (const s of lines) { await wait(200); await typeLine(s); await wait(380); }
  });
}

// ---------------- 間（ま） ----------------
// 全体の「出てくる速さ」はここでまとめて調整する
//   react：出来事のあと、師匠が話し出すまでの余韻
//   block：かたまりを1つずつ出すときの間隔
//   small：見出しと中身の間などの、小さな間
const BEAT = { react: 1400, block: 380, small: 220 };
// parent の中に、かたまりを1つ足して（ふわっと出して）から、pause だけ待つ
async function reveal(parent, html, pause = BEAT.block) {
  const d = document.createElement("div");
  d.className = "reveal";
  d.innerHTML = html;
  parent.appendChild(d);
  scrollDown();
  await wait(pause);
  return d;
}

function shortHost(host) { return host.split(/[./]/)[0]; }
function setPrompt(text) { $("prompt").textContent = text; updateNext(); }
function normalPrompt() {
  setPrompt(`${who()}@${shortHost(here().host)}:~$`);
  cmd.type = "text";
}

function clockText() {
  const [h, m] = (CH?.clock || "00:00").split(":").map(Number);
  const t = h * 60 + m + state.minutes;
  return `${String(Math.floor(t / 60) % 24).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
}
function updateClock() { $("clock").textContent = CH ? `${CH.date} ${clockText()}` : ""; }
function addLog(text, cls = "") {
  const li = document.createElement("li");
  li.textContent = `${clockText()}  ${text}`;
  if (cls) li.className = cls;
  $("log").prepend(li);
}
function updateTrace(shown = state.trace) {
  const t = Math.min(100, Math.round(shown));
  $("traceNum").textContent = t + "%";
  $("traceBar").style.width = t + "%";
  $("traceBar").style.background = t >= 70 ? "var(--alert)" : t >= 40 ? "var(--warn)" : "var(--accent)";
  $("side").classList.toggle("danger", t >= 70);
}
function addTrace(n) {
  state.trace += n;
  updateTrace();
  pulse($("term"), "flash", 1000);
  pulse($("wrap"), "shake", 450);
  if (state.trace >= 100) {
    state.over = true;
    cmd.disabled = true;
    (async () => {
      await sleep(600);
      SFX.boom();
      print("*** CONNECTION LOST ***", "alert");
      $("wrap").classList.add("glitch");
      await sleep(1200);
      await powerOff();
      showEnding(S.gameOver, { retry: true });
    })();
  }
}
// 演出用：トレースの表示だけを一気に上げる（100% になってもゲームオーバーにしない）
async function raceTrace(to, ms) {
  const from = state.trace, steps = Math.max(1, Math.round(ms / 60));
  $("traceBar").parentElement.classList.add("racing");
  for (let i = 1; i <= steps; i++) {
    updateTrace(from + (to - from) * (i / steps) ** 1.5);
    if (i % 3 === 0) SFX.tick();
    await sleep(60);
  }
  $("traceBar").parentElement.classList.remove("racing");
  state.trace = to;
}

// 画面が消える（ブラウン管の電源を切ったように）
async function powerOff() {
  SFX.siren(false);
  SFX.music(false);
  SFX.power();
  $("wrap").classList.remove("glitch", "unstable");
  $("wrap").classList.add("crt-off");
  document.body.classList.remove("red", "blue");
  await sleep(850);
}

// 兄のプログラムの伏線：ときどき「送信エラー」が一瞬だけ出る
function maybeNoise() {
  if (!CH?.noise || state.over || isBusy() || state.mode) return;
  if (CH.noiseStop && state.visited.has(CH.noiseStop)) return;
  state.commands++;
  if (state.commands !== 4 && Math.random() > 0.12) return;
  const pkt = Math.floor(Math.random() * 0xffff).toString(16).padStart(4, "0");
  const d = print(`[pred-feed] pkt#${pkt} → 送信エラー（destination unreachable）`, "alert noise");
  SFX.static();
  pulse($("term"), "jolt", 160);
  setTimeout(() => d.remove(), 650);
}

// ---------------- 手がかり ----------------
function countClues(ch) {
  if (ch.clueTotal != null) return ch.clueTotal;
  let n = 0;
  for (const node of Object.values(ch.nodes)) {
    if (node.clue) n++;
    n += (node.search?.entries || []).filter(e => e.clue).length;
    n += (node.dir || []).filter(d => d.clue).length;
  }
  return n;
}
// ---------------- 目標（objectives） ----------------
// 任務の中の小さな目標を、上から順に1つずつ進める（書き方は src/scenario.js の先頭を参照）
const mainObjs = () => (CH?.objectives || []).filter(o => !o.side);
const sideObjs = () => (CH?.objectives || []).filter(o => o.side);
const nowObj = () => mainObjs()[state.objIdx] || null;
const objCount = o => (o.clues || []).filter(c => state.clues.includes(c)).length;
// その手がかりが、どの目標のものか（今の目標・済んだ目標・気になること のうち、見えているものだけ）
function objOf(label) {
  return [...mainObjs().slice(0, state.objIdx + 1), ...sideObjs()].find(o => (o.clues || []).includes(label)) || null;
}
function objDone(o) {
  const u = o.until || {};
  if (u.opened) return state.opened.has(u.opened);
  if (u.visited) return state.visited.has(u.visited);
  if (u.clue) return state.clues.includes(u.clue);
  return false;   // goal は任務完了のときに済ませる
}

function updateClueCount() {
  const o = nowObj();
  const total = CH ? countClues(CH) : 0;
  $("eviCount").textContent = CH?.objectives?.length && !state.objShown ? "" : o?.clues?.length ? `${objCount(o)}/${o.clues.length}` : total ? `${state.clues.length}/${total}` : "";
  renderObjectives();
}

// 右の欄：CASE（全体の目標）→ MISSION（任務の目的）→ 済んだ目標 → ▶ 今の目標と、その手がかり → 気になること
function renderObjectives(fresh) {
  const box = $("evi");
  const li = (cls, html) => `<li class="${cls}">${html}</li>`;
  const clueItems = o => (o.clues || []).map(c => state.clues.includes(c)
    ? li(`o-clue${c === fresh ? " new" : ""}`, `◆ ${esc(c)}`) : li("o-clue miss", "◇ ？？？")).join("");
  let html = "";
  if (S.caseGoal && CH?.objective) html += li("o-sec", "CASE") + li("o-case", esc(S.caseGoal));
  if (CH?.objective) html += li("o-sec", "MISSION") + li("o-mission", esc(CH.objective));
  if (!CH?.objectives?.length) {
    // 目標のない任務（エピローグなど）は、手がかりを新しい順に並べるだけ
    if (state.clues.length) html += li("o-sec", "EVIDENCE") + [...state.clues].reverse().map(c => li(c === fresh ? "new" : "", esc(c))).join("");
    box.innerHTML = html;
    return;
  }
  // 最初の目標のカードがターミナルに出るまでは、右の欄にも目標を出さない
  if (!state.objShown) { box.innerHTML = html; return; }
  const mains = mainObjs();
  html += li("o-sec", "OBJECTIVE");
  mains.slice(0, state.objIdx).forEach(o => {
    html += li("o-done", `${esc(o.text)}${o.clues?.length ? `<span class="o-n">${objCount(o)}/${o.clues.length}</span>` : ""}`);
  });
  const o = nowObj();
  if (o) {
    html += li("o-now", `${esc(o.text)}${o.clues?.length ? `<span class="o-n">${objCount(o)}/${o.clues.length}</span>` : ""}`);
    html += clueItems(o);
  }
  // 見つけてはいるが、まだ出ていない目標の手がかり
  const shown = new Set([...mains.slice(0, state.objIdx + 1), ...sideObjs()].flatMap(x => x.clues || []));
  const extra = state.clues.filter(c => !shown.has(c));
  if (extra.length) html += li("o-sec", "MEMO") + extra.map(c => li(`o-clue${c === fresh ? " new" : ""}`, `◆ ${esc(c)}`)).join("");
  for (const s of sideObjs()) {
    if (!objCount(s)) continue;   // ひとつも見つけていない「気になること」は、まだ出さない
    html += li("o-sec o-side", `？ ${esc(s.text)}<span class="o-n">${objCount(s)}/${s.clues.length}</span>`) + clueItems(s);
  }
  box.innerHTML = html;
}

// 目標が済んでいたら「OBJECTIVE CLEAR」→ 次の目標を出す（いくつか続けて済むこともある）
async function checkObjectives() {
  let cleared = false;
  while (nowObj() && objDone(nowObj())) {
    const o = nowObj();
    state.objIdx++;
    await wait(cleared ? 300 : BEAT.small);
    cleared = true;
    SFX.objective();
    print(`<div class="obj-card clear"><span class="o-tag">OBJECTIVE CLEAR</span><span class="o-text">${esc(o.text)}</span></div>`);
    addLog(`CLEAR  ${o.text}`);
    updateClueCount();
  }
  if (cleared && nowObj()) {
    await wait(700);
    showObjective(nowObj());
    await wait(BEAT.small);
  }
}
function showObjective(o, tag = "NEXT OBJECTIVE") {
  if (!o) return;
  SFX.select();
  decode(print(`<div class="obj-card next"><span class="o-tag">${tag}</span><span class="o-text">${esc(o.text)}</span></div>`), 400);
}

function addClue(label) {
  if (!label || state.clues.includes(label)) return;
  state.clues.push(label);
  updateClueCount();
  renderObjectives(label);
  // カードの数字は「その目標の手がかり n / N」（目標のない手がかりは任務全体の数）
  const o = objOf(label), total = countClues(CH);
  const n = o ? `${esc(o.text)}　${objCount(o)} / ${o.clues.length}` : total ? `${state.clues.length} / ${total}` : "";
  print(`<div class="evi-card"><span class="evi-tag">EVIDENCE</span><span>${esc(label)}</span>`
    + (n ? `<span class="evi-n">${n}</span>` : "") + `</div>`, "evidence");
  SFX.evidence();
}

// ---------------- ノード ----------------
// 接続先の名前：data-name があればそれ、なければリンク文字列の先頭語の「.」より前
// （tools/build.html の重複チェックも同じ決め方）
function linkName(a) {
  if (a.dataset.name) return a.dataset.name;
  return a.textContent.trim().split(/[\s　]/)[0].split(".")[0];
}

// 本文 HTML をターミナル用に変換し、接続先の一覧を取り出す
function parseNode(html) {
  const box = document.createElement("div");
  box.innerHTML = html;
  const links = [];
  box.querySelectorAll("a[data-go]").forEach(a => {
    const text = a.textContent.trim();
    const desc = text.includes("──") ? text.split("──")[1].trim() : text;
    links.push({ name: linkName(a), go: a.dataset.go, oneway: a.hasAttribute("data-oneway"), desc });
  });
  box.querySelectorAll("ul.links").forEach(ul => ul.remove());
  box.querySelectorAll("a[data-go]").forEach(a => {
    const span = document.createElement("span");
    const name = esc(linkName(a));
    span.innerHTML = `<span class="tlink">${esc(a.textContent)}</span> <span class="tag pick" data-fill="ssh ${name}">[${name}]</span>`;
    a.replaceWith(span);
  });
  return { html: box.innerHTML, links };
}

// 今いる場所でできること（フォルダ・検索・接続先）を、本文と間を空けた1つのかたまりにまとめて出す
// フォルダ・検索・接続先を1つの表にまとめる（左に打つもの、右に説明。列がそろう）
function printMenu() {
  const node = here(), rows = [];
  for (const d of node.dir || []) {
    rows.push(`<span class="n pick" data-fill="cd ${esc(d.name)}">${esc(d.name)}/</span><span>${esc(d.desc || "")}</span>`);
  }
  if (node.search) {
    rows.push(`<span class="n pick" data-fill="search ">search 〇〇</span><span>${esc(node.search.label)}から「〇〇」を探す</span>`);
  }
  for (const l of state.links) {
    rows.push(`<span class="n pick${l.oneway ? " ow" : ""}" data-fill="ssh ${esc(l.name)}">${esc(l.name)}</span><span${l.oneway ? ' class="ow"' : ""}>${esc(l.desc)}${l.oneway ? "　【一方通行】" : ""}</span>`);
  }
  if (!rows.length) return false;
  print(`<div class="menu reveal"><div class="ls">${rows.join("")}</div></div>`);
  return true;
}
const printLinks = () => printMenu();

// 画面をさかのぼった古い一覧は押せないようにする
function disablePicks() {
  out.querySelectorAll(".pick").forEach(el => el.classList.remove("pick"));
}

// 移動したときの表示：アドレス → 場所の名前 → 本文 → （間）→ 行き先の一覧、の順に1つずつ出す
async function showNode() {
  disablePicks();
  const node = here();
  const { html, links } = parseNode((node.body || "").replaceAll("{handle}", esc(who())));
  state.links = links;
  const head = print(`<span class="host">▶ ssh://${esc(node.host)}</span>`, "node-head");
  await wait(BEAT.small);
  head.insertAdjacentHTML("beforeend", `\n<b class="reveal">${esc(fill(node.title))}</b>`);
  scrollDown();
  await wait(BEAT.block);
  if (html.trim()) await decode(print(html, "node reveal"));
  await wait(BEAT.block);
  printMenu();
  normalPrompt();
}

async function enterNode(id, opt = {}) {
  const node = nodeOf(id);
  if (state.current && !opt.isBack) state.history.push(state.current);
  if (opt.oneway) state.history = [];
  state.current = id;
  updateClock();

  const first = !state.visited.has(id);
  if (opt.oneway) addLog(`ONE-WAY → ${node.host}`, "ow");
  else if (first) addLog(`→ ${node.host}`);
  state.visited.add(id);

  await busy(async () => {
    await showNode();
    if (first) {
      if (node.clue) { await wait(600); addClue(node.clue); }
      await speak(node.say, BEAT.react);
    }
    await checkObjectives();
    if (node.goal) await runGoal(node.goal);
  });
}

// 転移（演出つき）。鍵付きなら先にパスワードを聞く
async function connect(id, opt = {}) {
  const node = nodeOf(id);
  await busy(async () => {
    const line = print(`Connecting to ${esc(node.host)} `, "dim");
    for (let i = 0; i < 8; i++) { await wait(50); line.innerHTML += "▓"; SFX.tick(); scrollDown(); }
    line.innerHTML += ` <span class="sys">${10 + Math.floor(Math.random() * 60)}ms</span>`;
    state.minutes += 2 + Math.floor(Math.random() * 4);
    updateClock();
  });

  if (node.lock && !state.opened.has(id)) {
    const lock = node.lock, len = lockLen(lock);
    disablePicks();
    await busy(() => showLockScreen(node, lock, len));
    if (!state.said.has("lock:" + id)) { state.said.add("lock:" + id); await speak(lock.say, BEAT.react); }
    if (lock.user) askUser(id, opt);
    else askPass(id, opt);
    return;
  }
  await enterNode(id, opt);
}

// ---------------- 認証（ユーザーID → パスワード） ----------------
// ---------------- 状態パネル ----------------
// 大事な状態の変化（ロック・解除・失敗・一方通行・発見）を、真ん中のパネル＋演出で見せる
const PADLOCK = `<svg class="icon padlock" viewBox="0 0 24 28" aria-hidden="true">
  <path class="shackle" d="M6 12V8a6 6 0 0 1 12 0v4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="3" y="12" width="18" height="14" rx="2.5" fill="currentColor"/>
  <rect x="11" y="16.5" width="2" height="5" rx="1" fill="#000"/>
</svg>`;
const ICONS = {
  lock: PADLOCK,
  unlock: PADLOCK,
  deny: `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 8l8 8M16 8l-8 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  warn: `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 23 21.5H1Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 9v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="18.3" r="1.4" fill="currentColor"/></svg>`,
  found: `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6.5A1.5 1.5 0 0 1 3.5 5H9l2 2.5h9.5A1.5 1.5 0 0 1 22 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 18.5Z" fill="currentColor"/></svg>`,
};
function panelHtml(kind, title, sub) {
  return `<div class="spanel ${kind}"><div class="lockpanel">${ICONS[kind]}<span class="lock-title">${esc(title)}</span></div>`
    + (sub ? `<div class="lock-sub">${sub}</div>` : "") + `</div>`;
}
async function showLockScreen(node, lock, len) {
  const lines = s => esc(s || "").replace(/\n/g, "<br>");
  const fields = [];
  if (lock.user) fields.push(`<span class="dim">${esc(lock.user.prompt || "ユーザーID")}</span><span>${lines(lock.user.hint)}</span>`);
  if (len) fields.push(`<span class="dim">パスワード</span><span><span class="warn slots">${"_".repeat(len)}</span>（${len}文字）</span>`);
  // LOCKED が出て、掛け金が「ガチャッ」と閉まるのを見せてから、案内を読む順番に1つずつ出す
  SFX.alert();
  pulse($("wrap"), "shake", 450);
  const auth = print(`<div class="auth"></div>`).querySelector(".auth");
  await reveal(auth, panelHtml("lock", "LOCKED", `ACCESS RESTRICTED ── ${esc(node.host)}`), 520);
  SFX.lock();
  await wait(900);
  await reveal(auth, `<div class="auth-need">認証が必要です。</div>`, 550);
  await reveal(auth, `<div class="auth-hint">${lines(lock.hint)}</div>`, 450);
  if (fields.length) await reveal(auth, `<div class="auth-fields">${fields.join("")}</div>`, 400);
  await reveal(auth, `<div class="auth-notes">※ ${lock.prompt ? "間違えると" : "パスワードを間違えると"}トレースが上昇します<br>※ 何も入力せずに Enter（または back）で戻れます　<span class="n pick" data-cancel>[やめる]</span></div>`, BEAT.small);
}
// パスワードの文字数（showLength のときだけ見せる。公開データではビルド時に len を入れておく）
const lockLen = lock => lock.showLength ? (lock.len ?? [...[].concat(lock.pass)[0]].length) : 0;

function askUser(id, opt) {
  const u = nodeOf(id).lock.user;
  state.mode = { type: "user", id, opt, label: u.prompt || "user" };
  cmd.type = "text";
  setPrompt(`${state.mode.label}:`);
  focusCmd();
}
function askPass(id, opt, user) {
  const lock = nodeOf(id).lock;
  state.mode = { type: "password", id, opt, user, label: lock.prompt || "password" };
  cmd.type = lock.prompt ? "text" : "password";
  passPrompt();
  focusCmd();
}
// 文字数を見せる鍵では、打った文字数を [5/17] のように出す
function passPrompt() {
  const m = state.mode, len = lockLen(nodeOf(m.id).lock);
  setPrompt(len ? `${m.label} [${[...cmd.value].length}/${len}]:` : `${m.label}:`);
}
// ユーザーID を確かめる（大文字小文字・全角半角・空白は区別しない）
function checkUser(lock, raw) {
  const u = lock.user, v = NZ.norm(raw);
  const key = Object.keys(u.ids).find(k => NZ.norm(k) === v);
  if (!key) return { error: "そのユーザーIDは登録されていません。" };
  const account = u.ids[key];
  if (u.disabled?.[account]) return { error: u.disabled[account] };
  return { account };
}

// ---------------- 検索 ----------------
// 検索用に文字をそろえる：全角・半角、大文字・小文字、ひらがな・カタカナ、長音（ー）のあるなしを区別しない
// （「ゆーざーID」「ユーザID」でも「ユーザーID」が見つかる）
const fold = s => lower(s).replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)).replace(/ー/g, "");

function searchText(e) {
  if (!e._text) {
    const box = document.createElement("div");
    box.innerHTML = e.html;
    box.querySelectorAll(".nosearch").forEach(el => el.remove());
    e._text = fold(box.textContent + " " + (e.keys || ""));
  }
  return e._text;
}

// 言いかえ（aliases）：「userid」→「ユーザーID」のように、同じ意味の言葉を1つにまとめる
function unalias(conf, s) {
  const k = fold(s).replace(/\s+/g, "");
  for (const [canon, list] of Object.entries(conf.aliases || {})) {
    if ([canon, ...list].some(a => fold(a).replace(/\s+/g, "") === k)) return canon;
  }
  return s;
}

async function search(arg) {
  const node = here();
  if (!node.search) return print("search: ここには検索できるものがありません。", "dim");
  const q = arg.trim();
  const conf = node.search, limit = conf.limit ?? 3;
  // 全体が言いかえに当たればそれを、当たらなければ言葉ごとに言いかえる
  const terms = fold(unalias(conf, q)).split(/\s+/).filter(Boolean).map(t => fold(unalias(conf, t)).replace(/\s+/g, "")).filter(Boolean);
  if (!terms.length) return print("使い方：search &lt;言葉&gt;（スペースで区切ると条件を重ねられます）", "dim");

  const hits = conf.entries.filter(e => terms.every(t => searchText(e).includes(t)));
  const shown = hits.slice(0, limit);
  state.minutes += 1;
  updateClock();
  addLog(`QUERY "${q}" @${shortHost(node.host)}`);

  await busy(async () => {
    // 検索中の演出：件数が回っていく
    const total = conf.records ?? 10000, frames = 14;
    const line = print("", "dim scan");
    for (let f = 1; f <= frames; f++) {
      line.textContent = `scanning [${"▮".repeat(f)}${"·".repeat(frames - f)}] ${Math.round(total * f / frames).toLocaleString()} records`;
      SFX.tick();
      await wait(32);
    }
    await showResults(conf, q, terms, hits, shown, limit);
  });
}

async function showResults(conf, q, terms, hits, shown, limit) {
  // 見せかけの総件数（totals）：その言葉1つだけで検索したときに、大企業らしい件数を出す
  const key = Object.keys(conf.totals || {}).find(k => fold(k).replace(/\s+/g, "") === terms.join(""));
  const total = hits.length ? Math.max(hits.length, key ? conf.totals[key] : 0) : 0;
  // 見出し：「何を探したか」を大きく、件数は小さく横に
  print(`<div class="res-head${hits.length ? "" : " none"}"><span class="res-title">${esc(conf.label)} ─ 「${esc(q)}」</span>`
    + `<span class="res-count">${hits.length ? `${total.toLocaleString()} 件${total > limit ? `（上位 ${limit} 件を表示）` : ""}` : "0 件"}</span></div>`);
  if (!hits.length) print(esc(conf.empty || "該当するものはありません。"), "dim");
  // 結果は1件ずつ（解読しながら）出す
  await wait(BEAT.small);
  for (const e of shown) {
    decode(print(`<div class="doc">${e.html}</div>`, "node result reveal"), 380);
    await wait(450);
  }

  const clues = shown.map(e => e.clue).filter(c => c && !state.clues.includes(c));
  // 手がかりのカードも1枚ずつ
  if (clues.length) {
    await wait(700);
    for (const c of clues) { addClue(c); await wait(450); }
  }

  // 師匠のひとこと（それぞれ一度だけ）
  const lines = [];
  for (const e of shown) {
    if (e.say && !state.said.has(e)) { state.said.add(e); lines.push(...e.say); }
  }
  const goal = shown.find(e => e.goal)?.goal;
  if (!goal) {
    (conf.notes || []).forEach((n, i) => {
      const key = `${state.current}:note${i}`;
      if (state.said.has(key)) return;
      if ([].concat(n.when).some(w => terms.some(t => t.includes(fold(w))))) { state.said.add(key); lines.push(...n.say); }
    });
  }
  await speak(lines, BEAT.react);
  await checkObjectives();
  if (goal) await runGoal(goal);
}
