<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任務2 BGM くらべ</title>
<style>
  body { margin: 0; background: #05090a; color: #b8f5d8; font-family: "BIZ UDGothic", Consolas, monospace; padding: 24px 16px; line-height: 1.7; }
  h1 { font-size: 15px; color: #3dffa8; letter-spacing: .2em; margin: 0 0 6px; }
  p.note { color: #5d8f7c; font-size: 13px; margin: 0 0 14px; }
  label { font-size: 13px; color: #b8f5d8; display: inline-flex; gap: 6px; align-items: center; margin-bottom: 12px; cursor: pointer; }
  .ctrl { border: 1px dashed rgba(61,255,168,.3); border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; }
  .ctrl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0; }
  .ctrl-label { color: #8fb8a6; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card { border: 1px solid rgba(61,255,168,.35); border-radius: 6px; background: #0b1214; padding: 12px 14px; }
  .card.playing { border-color: #ffc14d; box-shadow: 0 0 14px rgba(255,193,77,.35); }
  .name { color: #3dffa8; font-size: 15px; }
  .desc { color: #8fb8a6; font-size: 12px; margin: 4px 0 10px; }
  button { font: inherit; font-size: 13px; color: #05090a; background: #3dffa8; border: 0; border-radius: 12px; padding: 3px 14px; cursor: pointer; }
  .card.playing button { background: #ffc14d; }
  .ctrl button { background: #0b1214; color: #b8f5d8; border: 1px solid rgba(61,255,168,.4); }
  .ctrl button.on { background: #3dffa8; color: #05090a; }
  #zapBtn { background: #ff7ad9 !important; color: #05090a !important; border: 0 !important; }
</style>
</head>
<body>
<h1>任務2（ボーナスタイム）の BGM くらべ</h1>
<p class="note">押すと再生、もう一度押すと止まります（同時に鳴るのは1曲だけ）。ゲームと同じ音量で鳴らしています。<br>
下の「盛り上がり」と「実行」は、<b>遊びに音楽が連動する</b>案のお試しです。「盛り上がり」を変えると楽器の数が変わり（ゲームでは、進むほど自動で上がる想定）、「実行」を押すとリズムに合わせて音が入ります（ゲームでは、ボタンを押した瞬間に鳴る想定）。3曲とも対応しています。</p>
<label><input type="checkbox" id="loud"> 大きめに聞く（ゲームより3倍の音量。聞きくらべ用）</label>
<div class="ctrl">
  <div class="ctrl-row"><span class="ctrl-label">盛り上がり（遊びの進み具合）　押すと、今のループ（8小節）の終わりで切りかわる　<b id="lvState"></b></span>
    <button type="button" class="lv on" data-level="0">0 入ったばかり</button>
    <button type="button" class="lv" data-level="1">1</button>
    <button type="button" class="lv" data-level="2">2</button>
    <button type="button" class="lv" data-level="3">3 サビ</button>
  </div>
  <div class="ctrl-row"><button type="button" id="zapBtn">⚡ 実行（コマンドを打った瞬間の音）</button><span class="ctrl-label">再生中に押すと、リズムに合わせて鳴る</span></div>
</div>
<div class="grid" id="grid"></div>

<script>
// docs/index.html の BGM と同じ作り（全体の音量・コンプレッサー・音色はゲームと同じ）
const BGM_VOL = 0.021;
let ctx, out, noiseBuf, cur = null, level = 0;
function ac() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -6; comp.ratio.value = 8;
    out = ctx.createGain(); out.gain.value = 2.7; out.connect(comp).connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}
const vol = () => BGM_VOL * (document.getElementById("loud").checked ? 3 : 1);
document.getElementById("loud").onchange = () => { if (cur) cur.bus.gain.setTargetAtTime(vol(), ctx.currentTime, 0.1); };

function start(track, card) {
  stop();
  const c = ac(), t = c.currentTime, STEP = 60 / track.bpm / 4;
  const bus = c.createGain(); bus.gain.setValueAtTime(0.0001, t); bus.gain.exponentialRampToValueAtTime(vol(), t + 2);
  bus.connect(out);
  const echo = c.createGain(), delay = c.createDelay(1), fb = c.createGain(), elp = c.createBiquadFilter();
  delay.delayTime.value = STEP * 3; fb.gain.value = 0.38; elp.type = "lowpass"; elp.frequency.value = 1600;
  echo.connect(delay); delay.connect(elp); elp.connect(fb); fb.connect(delay); elp.connect(bus);
  cur = { track, card, bus, echo, STEP, step: 0, next: t + 0.1, level, want: level, zap: false };
  cur.timer = setInterval(schedule, 25);
  card.classList.add("playing"); card.querySelector("button").textContent = "■ 停止";
}
function stop() {
  if (!cur) return;
  const b = cur; cur = null; clearInterval(b.timer);
  b.bus.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.2);
  setTimeout(() => { try { b.bus.disconnect(); } catch {} }, 1500);
  b.card.classList.remove("playing"); b.card.querySelector("button").textContent = "▶ 再生";
}
function schedule() {
  if (!cur) return;
  while (cur.next < ctx.currentTime + 0.15) {
    // 「実行」のアクセントは、次の16分ちょうどに鳴らす（リズムに合う）
    if (cur.zap) { cur.zap = false; zap(cur.bus, cur.next); }
    // 盛り上がりの切りかえは、ループ（8小節＝128 ステップ）の頭でだけ反映する
    if (cur.step % 128 === 0) cur.level = cur.want;
    cur.track.play(cur.step, cur.next, cur); cur.next += cur.STEP; cur.step++;
  }
}

// ---------- 共通の音色 ----------
function voice(bus, t, dur, v, build, attack = 0.005) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g.connect(bus); build(g); return g;
}
const send = (g, amount) => { const s = ctx.createGain(); s.gain.value = amount; g.connect(s).connect(cur.echo); };
function kick(bus, t, v) {
  voice(bus, t, 0.3, 0.55 * v, g => { const o = ctx.createOscillator(); o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.12); o.connect(g); o.start(t); o.stop(t + 0.32); });
}
function rim(bus, t) {
  const g = voice(bus, t, 0.06, 0.1, g => {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2600; f.Q.value = 5;
    src.connect(f).connect(g); src.start(t, Math.random()); src.stop(t + 0.08);
    const o = ctx.createOscillator(); o.frequency.value = 1700; const og = ctx.createGain(); og.gain.value = 0.3; o.connect(og).connect(g); o.start(t); o.stop(t + 0.03);
  });
  send(g, 0.35);
}
function hat(bus, t, v = 1) {
  voice(bus, t, 0.035, 0.011 * v, g => { const src = ctx.createBufferSource(); src.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 7800; src.connect(f).connect(g); src.start(t, Math.random()); src.stop(t + 0.05); }, 0.002);
}
// オープンハイハット：少し長く「シーッ」と残る（裏拍で、ノリを足す）
function openHat(bus, t) {
  voice(bus, t, 0.14, 0.009, g => { const src = ctx.createBufferSource(); src.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 6500; src.connect(f).connect(g); src.start(t, Math.random()); src.stop(t + 0.16); }, 0.004);
}
// シンバルのような「シャーン」：やわらかいノイズが長く残る（サビの頭で）
function crash(bus, t) {
  const g = voice(bus, t, 1.6, 0.03, g => {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.setValueAtTime(5000, t); f.frequency.exponentialRampToValueAtTime(2500, t + 1.6);
    src.connect(f).connect(g); src.start(t, Math.random()); src.stop(t + 1.65);
  }, 0.005);
  send(g, 0.3);
}
// サビに入る瞬間の「ドーン」：深いキックと、低いうなり
function boom(bus, t) {
  voice(bus, t, 1.4, 0.7, g => { const o = ctx.createOscillator(); o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(32, t + 1.2); o.connect(g); o.start(t); o.stop(t + 1.45); }, 0.003);
  const g = voice(bus, t, 1.2, 0.05, g => {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(2500, t); f.frequency.exponentialRampToValueAtTime(150, t + 1.2);
    src.connect(f).connect(g); src.start(t, Math.random()); src.stop(t + 1.25);
  }, 0.003);
  send(g, 0.4);
}
// ふんわりした薄い和音：サイン波と三角波で、後ろに明るさを足すだけ（ノコギリ波の壁にはしない）
function softPad(bus, t, notes, dur) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.014, t + 0.3);
  g.gain.setValueAtTime(0.014, t + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.4);
  g.connect(bus);
  for (const note of notes) {
    const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = note; o.connect(g); o.start(t); o.stop(t + dur + 0.45);
    const o2 = ctx.createOscillator(); o2.frequency.value = note * 2; const g2 = ctx.createGain(); g2.gain.value = 0.25; o2.connect(g2).connect(g); o2.start(t); o2.stop(t + dur + 0.45);
  }
  send(g, 0.25);
}
// 裏拍で「タッ」と刻む、エレピ風の短い和音（ハウスのカッティング）
function chordStab(bus, t, notes, dur) {
  const g = voice(bus, t, dur, 0.03, g => {
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 1; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(700, t + dur);
    f.connect(g);
    for (const note of notes) {
      const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = note; o.connect(f); o.start(t); o.stop(t + dur + 0.05);
      const o2 = ctx.createOscillator(); o2.frequency.value = note * 2; const g2 = ctx.createGain(); g2.gain.setValueAtTime(0.3, t); g2.gain.exponentialRampToValueAtTime(0.01, t + 0.08); o2.connect(g2).connect(f); o2.start(t); o2.stop(t + dur + 0.05);
    }
  }, 0.003);
  send(g, 0.3);
}
// 粒の立った軽いメロディの音：三角波を、フィルターで一瞬だけ開く
function pluck(bus, t, freq, dur) {
  const g = voice(bus, t, dur, 0.032, g => {
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 2; f.frequency.setValueAtTime(3000, t); f.frequency.exponentialRampToValueAtTime(600, t + dur * 0.7);
    const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = freq; o.connect(f).connect(g); o.start(t); o.stop(t + dur + 0.05);
  }, 0.003);
  send(g, 0.45);
}
// 「実行」のアクセント：リズムに合わせて鳴る「ビシュッ」
function zap(bus, t) {
  const g = voice(bus, t, 0.35, 0.153, g => {
    const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.setValueAtTime(1200, t); o.frequency.exponentialRampToValueAtTime(220, t + 0.25);
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 2400; o.connect(f).connect(g); o.start(t); o.stop(t + 0.36);
  }, 0.003);
  send(g, 0.5);
  kick(bus, t, 1.53);   // 実行の音は大きめ（前の 1.7 倍）
}

// ---------- いまの曲（ネオン）の音色：docs/index.html と同じ ----------
function neonPad(bus, t, notes, dur, pump) {
  const g = ctx.createGain(), base = 0.03, beat = dur / 4;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(base, t + 0.4);
  if (pump) for (let k = 0; k < 4; k++) { const tb = t + k * beat; g.gain.setValueAtTime(base * 0.25, tb + 0.01); g.gain.linearRampToValueAtTime(base, tb + beat * 0.75); }
  g.gain.setValueAtTime(base, t + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.6);
  const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 0.7; f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(1600, t + dur);
  f.connect(g).connect(bus);
  for (const note of notes) for (const d of [0.994, 1.006]) { const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = note * d; o.connect(f); o.start(t); o.stop(t + dur + 0.7); }
  send(g, 0.25);
}
function neonBass(bus, t, freq, dur, v) {
  voice(bus, t, dur, 0.15 * v, g => {
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 3; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(200, t + dur); f.connect(g);
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = freq; o.connect(f);
    const o2 = ctx.createOscillator(); o2.frequency.value = freq; o2.connect(g);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }, 0.004);
}
function neonClap(bus, t) {
  const g = voice(bus, t, 0.22, 0.07, g => {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1600; f.Q.value = 0.9;
    src.connect(f).connect(g); src.start(t, Math.random()); src.stop(t + 0.25);
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08); const og = ctx.createGain(); og.gain.value = 0.4; o.connect(og).connect(g); o.start(t); o.stop(t + 0.1);
  }, 0.002);
  send(g, 0.6);
}
function neonArp(bus, t, freq, dur, v) {
  const g = voice(bus, t, dur, 0.026 * v, g => {
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 4; f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(500, t + dur * 0.8);
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = freq; o.connect(f).connect(g); o.start(t); o.stop(t + dur + 0.05);
  }, 0.003);
  send(g, 0.35);
}
function neonLead(bus, t, freq, dur) {
  const g = voice(bus, t, dur * 1.05, 0.035, g => {
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 2400; f.Q.value = 1; f.connect(g);
    const vib = ctx.createOscillator(), depth = ctx.createGain();
    vib.frequency.value = 5.2; depth.gain.setValueAtTime(0, t); depth.gain.linearRampToValueAtTime(freq * 0.006, t + Math.min(0.25, dur * 0.6));
    vib.connect(depth);
    for (const d of [0.997, 1.003]) { const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = freq * d; depth.connect(o.frequency); o.connect(f); o.start(t); o.stop(t + dur * 1.05 + 0.05); }
    vib.start(t); vib.stop(t + dur * 1.05 + 0.05);
  }, 0.02);
  send(g, 0.45);
}

// ---------- C1・C2 の音色 ----------
function clap3(bus, t, v = 1) {
  for (const d of [0, 0.012, 0.024]) {
    const g = voice(bus, t + d, 0.12, 0.07 * v, g => {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1300; f.Q.value = 1.2;
      src.connect(f).connect(g); src.start(t + d, Math.random()); src.stop(t + d + 0.14);
    }, 0.002);
    if (d === 0.024) send(g, 0.3);
  }
}
function snare(bus, t, v = 1) {
  const g = voice(bus, t, 0.18, 0.09 * v, g => {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1500; f.Q.value = 0.8;
    src.connect(f).connect(g); src.start(t, Math.random()); src.stop(t + 0.2);
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08); const og = ctx.createGain(); og.gain.value = 0.4; o.connect(og).connect(g); o.start(t); o.stop(t + 0.1);
  }, 0.003);
  send(g, 0.25);
}
function pad(bus, t, notes, dur, bright = 900) {
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.035, t + Math.min(1.4, dur * 0.4)); g.gain.setValueAtTime(0.035, t + dur - 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 1.6);
  const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 0.5; f.frequency.setValueAtTime(bright * 0.5, t); f.frequency.linearRampToValueAtTime(bright, t + dur * 0.5); f.frequency.linearRampToValueAtTime(bright * 0.55, t + dur);
  f.connect(g).connect(bus);
  for (const n of notes) for (const d of [0.997, 1.003]) { const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = n * d; o.connect(f); o.start(t); o.stop(t + dur + 1.7); }
}
function pumpBass(bus, t, freq, dur, v) {
  voice(bus, t, dur, 0.16 * v, g => {
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 2; f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(220, t + dur); f.connect(g);
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = freq; o.connect(f);
    const o2 = ctx.createOscillator(); o2.frequency.value = freq / 2; o2.connect(g);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }, 0.004);
}
function rollBass(bus, t, freq, dur, v) {
  voice(bus, t, dur, 0.13 * v, g => {
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 3; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(250, t + dur); f.connect(g);
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = freq; o.connect(f); o.start(t); o.stop(t + dur + 0.05);
  }, 0.003);
}
function riser(bus, t, dur) {
  voice(bus, t, dur, 0.05, g => {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.5; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(4000, t + dur);
    src.connect(f).connect(g); src.start(t); src.stop(t + dur + 0.05);
  }, dur * 0.9);
}
function blip(bus, t, freq) {
  const g = voice(bus, t, 0.22, 0.035, g => { const o = ctx.createOscillator(); o.frequency.value = freq; o.connect(g); o.start(t); o.stop(t + 0.25); }, 0.003);
  send(g, 0.5);
}

// ---------- 候補 ----------
const NEON = [
  { root: 55.00, pad: [220.00, 261.63, 329.63], arp: [220.00, 261.63, 329.63, 440.00] },
  { root: 43.65, pad: [174.61, 220.00, 261.63], arp: [174.61, 220.00, 261.63, 349.23] },
  { root: 65.41, pad: [196.00, 261.63, 329.63], arp: [261.63, 329.63, 392.00, 523.25] },
  { root: 49.00, pad: [196.00, 246.94, 293.66], arp: [196.00, 246.94, 293.66, 392.00] },
];
const NEON_ARP = [0, 1, 2, 3, 2, 1, 2, 3, 0, 2, 1, 3, 2, 3, 1, 2];
const NEON_LEAD = [
  [[0, 4, 659.25], [4, 2, 587.33], [6, 2, 523.25], [8, 4, 587.33], [12, 4, 659.25]],
  [[0, 6, 523.25], [6, 2, 440.00], [8, 4, 523.25], [12, 4, 587.33]],
  [[0, 4, 659.25], [4, 2, 587.33], [6, 2, 523.25], [8, 8, 392.00]],
  [[0, 6, 587.33], [6, 2, 493.88], [8, 4, 587.33], [12, 4, 523.25]],
];
const TRACKS = [
  {
    id: "N", name: "いまの曲：ネオン", desc: "テンポ114。夜の街のネオンのような、爽快なシンセウェーブ（Am→F→C→G）。オクターブで弾むベース、拍ごとに脈打つパッド、ときどき入るメロディ。いまゲームに入っているもの（盛り上がり 0〜3 で楽器の数が変わるようにしてある）。",
    bpm: 114,
    play(n, t, b) {
      const s = n % 16, bar = Math.floor(n / 16), ch = NEON[bar % 4], bus = b.bus, ST = b.STEP, L = b.level;
      const rest = bar % 32 >= 30;
      if (s === 0) neonPad(bus, t, ch.pad, ST * 16, L >= 1 && !rest);
      if (L >= 1 && s % 2 === 0) neonBass(bus, t, (s / 2) % 2 ? ch.root * 2 : ch.root, ST * 1.8, s % 4 === 0 ? 0.6 : 1);
      if (L >= 1 && !rest && s % 4 === 0) kick(bus, t, 0.85);
      if (L >= 2 && !rest) { if (s === 4 || s === 12) neonClap(bus, t); hat(bus, t, s % 4 === 2 ? 1 : s % 2 ? 0.55 : 0.3); }
      neonArp(bus, t, ch.arp[NEON_ARP[s]], ST * 0.9, L === 0 || rest ? 0.55 : 1);
      if (L >= 3 && bar % 8 >= 4) for (const [at, len, f] of NEON_LEAD[bar % 4]) if (at === s) neonLead(bus, t, f, ST * len);
    },
  },
  {
    id: "C1", name: "ミニマル・ラン（サビつき）", desc: "テンポ128。暗くクールで、ベースが16分で転がり続ける（Dm→B♭→C→A）。盛り上がり 0：ベース・ドラム・手拍子／1：「ポッ」のフレーズとアルペジオ／2：メロディ。3 にすると、ループの終わりの「ため」のあと「ドーン」とサビに入る：2 の音はそのまま、和音が1小節ごと（Dm→B♭→F→C）に変わって勢いが出て、ドラムが強くなり、8分音符で細かく刻む、高めへのぼるサビのメロディ。",
    bpm: 128,
    seq: [0, -1, 3, -1, 1, -1, 4, 2, -1, 0, -1, 3, -1, 5, 2, -1],
    prog: [
      { root: 73.42, pad: [293.66, 349.23, 440.00], arp: [293.66, 349.23, 440.00, 587.33] },   // Dm
      { root: 58.27, pad: [233.08, 293.66, 349.23], arp: [233.08, 293.66, 349.23, 466.16] },   // B♭
      { root: 65.41, pad: [261.63, 329.63, 392.00], arp: [261.63, 329.63, 392.00, 523.25] },   // C
      { root: 55.00, pad: [220.00, 277.18, 329.63], arp: [220.00, 277.18, 329.63, 440.00] },   // A
    ],
    // メロディ（段階2）：和音ごとに2小節で1フレーズ（[16分の位置 0〜31, 長さ, 周波数]）
    lead: [
      [[0, 6, 587.33], [6, 2, 523.25], [8, 8, 440.00], [16, 6, 523.25], [22, 2, 587.33], [24, 8, 659.25]],
      [[0, 6, 587.33], [6, 2, 523.25], [8, 8, 466.16], [16, 8, 440.00], [24, 8, 349.23]],
      [[0, 6, 523.25], [6, 2, 587.33], [8, 8, 659.25], [16, 6, 587.33], [22, 2, 523.25], [24, 8, 392.00]],
      [[0, 8, 554.37], [8, 8, 440.00], [16, 8, 329.63], [24, 8, 440.00]],
    ],
    // ── サビ：調は Aメロと同じ D マイナー。Aメロの最後の A から、サビの頭の Dm に「着地」する
    //   進行は Dm → B♭ → F → C を1小節ずつ（2小節ごとだったのが1小節ごとになり、勢いが出る。F と C で明るく上がる）
    chorus: [
      { root: 73.42, pad: [293.66, 349.23, 440.00], arp: [293.66, 349.23, 440.00, 587.33] },   // Dm
      { root: 58.27, pad: [233.08, 293.66, 349.23], arp: [233.08, 293.66, 349.23, 466.16] },   // B♭
      { root: 43.65, pad: [261.63, 349.23, 440.00], arp: [261.63, 349.23, 440.00, 523.25] },   // F
      { root: 65.41, pad: [261.63, 329.63, 392.00], arp: [261.63, 329.63, 392.00, 523.25] },   // C
    ],
    // サビのメロディ（1小節ずつ、[16分の位置, 長さ, 周波数]）。8小節で1まわり。
    //   8分音符を中心に細かく刻み、3拍目の前で少し食う（「タタタ・ターン・タタタ」）サビらしいノリ。後半は上へのぼる
    hook: [
      [[0, 2, 587.33], [2, 2, 698.46], [4, 2, 880.00], [6, 3, 783.99], [10, 2, 698.46], [12, 2, 659.25], [14, 2, 698.46]],   // Dm
      [[0, 2, 698.46], [2, 2, 698.46], [4, 2, 659.25], [6, 3, 587.33], [10, 2, 523.25], [12, 2, 587.33], [14, 2, 466.16]],   // B♭
      [[0, 2, 523.25], [2, 2, 587.33], [4, 2, 698.46], [6, 3, 880.00], [10, 2, 783.99], [12, 2, 698.46], [14, 2, 783.99]],   // F（のぼる）
      [[0, 3, 659.25], [3, 3, 783.99], [6, 2, 659.25], [8, 2, 523.25], [10, 2, 587.33], [12, 4, 659.25]],                    // C
      [[0, 2, 587.33], [2, 2, 698.46], [4, 2, 880.00], [6, 3, 783.99], [10, 2, 698.46], [12, 2, 659.25], [14, 2, 698.46]],
      [[0, 2, 698.46], [2, 2, 698.46], [4, 2, 659.25], [6, 3, 587.33], [10, 2, 523.25], [12, 2, 587.33], [14, 2, 466.16]],
      [[0, 2, 523.25], [2, 2, 698.46], [4, 2, 880.00], [6, 3, 1046.50], [10, 2, 880.00], [12, 2, 783.99], [14, 2, 880.00]],  // F：いちばん高い ド まで
      [[0, 2, 659.25], [2, 2, 783.99], [4, 2, 880.00], [6, 2, 783.99], [8, 2, 659.25], [10, 2, 587.33], [12, 4, 659.25]],    // C：最後は次の頭の レ へ
    ],
    play(n, t, b) {
      const s = n % 16, bar = Math.floor(n / 16), bus = b.bus, ST = b.STEP, L = b.level;
      // サビ（3）：盛り上がりはループの頭でだけ切りかわるので、サビもループの頭から始まる
      if (L >= 3) { if (b.chorusStart == null) b.chorusStart = bar; return this.playChorus(n, t, b, bar - b.chorusStart, s); }
      b.chorusStart = null;
      // サビに上がる予約があるときは、ループの最後の1小節が「ため」（強いスネアの連打）になる
      const inBuild = b.want >= 3 && bar % 8 === 7;

      const step2 = Math.floor(bar / 2) % 4, ch = this.prog[step2];
      const pool = [293.66, 349.23, 392.00, 440.00, 523.25, 587.33];
      const build = bar % 8 === 7 || inBuild, intro = bar < 2;
      const ARP = [0, 1, 2, 3, 2, 1, 2, 3, 0, 2, 1, 3, 2, 3, 1, 2];
      const pos = (bar % 2) * 16 + s;
      // ── 0：ベース・ドラム・手拍子
      if (s === 0 && bar % 2 === 0) pad(bus, t, ch.pad, ST * 32, L >= 1 ? 1150 : 700);
      if (!(build && s >= 8)) rollBass(bus, t, ch.root * [1, 1, 2, 1][s % 4], ST * 0.9, s % 4 === 0 ? 0.6 : 1);
      if (L >= 2 && !(build && s >= 8) && s % 2 === 0) neonBass(bus, t, ch.root, ST * 1.6, 0.45);
      if (!intro && !(build && s >= 12) && s % 4 === 0) kick(bus, t, 0.9);
      if (!intro) { hat(bus, t, s % 4 === 2 ? 1.6 : 0.6); if (s === 4 || s === 12) clap3(bus, t); }
      if (build && s === 0) riser(bus, t, ST * 16);
      // 「ため」：スネアがだんだん細かく、強くなる（サビの直前は16分）
      if (inBuild) { if (s < 8 ? s % 4 === 0 : s < 12 ? s % 2 === 0 : true) snare(bus, t, 0.35 + s * 0.05); }
      else if (build && s >= 8 && s % 2 === 0) snare(bus, t, 0.4 + (s - 8) * 0.08);
      // ── 1：「ポッ」のフレーズ全部・裏拍で開くハイハット・アルペジオ（0 では「ポッ」がときどきだけ）
      const k = this.seq[s];
      if (k >= 0 && (L >= 1 || Math.random() < 0.35)) blip(bus, t, pool[k]);
      if (L >= 1 && !intro && s % 4 === 2) openHat(bus, t);
      if (L >= 1 && !(build && s >= 8)) neonArp(bus, t, ch.arp[ARP[s]], ST * 0.9, 0.8);
      // ── 2：メロディ
      if (L >= 2 && !build) for (const [at, len, f] of this.lead[step2]) if (at === pos) neonLead(bus, t, f, ST * len);
    },
    // サビ：2 の音（転がるベース・「ポッ」・アルペジオ・メロディ）は全部残し、その上に盛り上げる音を足す
    //   和音は1小節ごとに変わり、ドラムが強くなる。うるさいシンセの壁は使わない
    playChorus(n, t, b, cbar, s) {
      const bus = b.bus, ST = b.STEP, ch = this.chorus[cbar % 4];
      const last = cbar % 8 === 7;
      const pool = [293.66, 349.23, 392.00, 440.00, 523.25, 587.33];
      const ARP = [0, 1, 2, 3, 2, 1, 2, 3, 0, 2, 1, 3, 2, 3, 1, 2];
      // 入った瞬間：「ドーン」と「シャーン」。あとは4小節ごとに「シャーン」
      if (cbar === 0 && s === 0) { boom(bus, t); crash(bus, t); }
      else if (s === 0 && cbar % 4 === 0) crash(bus, t);
      // 和音（1小節ごと、いちばん明るく開いたパッド）
      if (s === 0) pad(bus, t, ch.pad, ST * 16, 1400);
      // 2 と同じ、転がるベースと、厚いベース
      if (!(last && s >= 8)) rollBass(bus, t, ch.root * [1, 1, 2, 1][s % 4], ST * 0.9, s % 4 === 0 ? 0.6 : 1);
      if (!(last && s >= 8) && s % 2 === 0) neonBass(bus, t, ch.root, ST * 1.6, 0.55);
      // ドラムは強く：4つ打ち、手拍子＋スネア、裏で開くハイハット、16分のハイハット
      if (s % 4 === 0 && !(last && s >= 12)) kick(bus, t, 1);
      if (s === 4 || s === 12) { clap3(bus, t, 1.1); snare(bus, t, 0.55); }
      if (s % 4 === 2) openHat(bus, t);
      hat(bus, t, s % 2 ? 0.8 : 1.3);
      if (last && s >= 8) snare(bus, t, 0.4 + (s - 8) * 0.07);   // 8小節目の後半はスネアが詰まって、次の頭へ
      // 2 と同じ「ポッ」のフレーズと、アルペジオ
      const k = this.seq[s];
      if (k >= 0) blip(bus, t, pool[k]);
      if (!(last && s >= 8)) neonArp(bus, t, ch.arp[ARP[s]], ST * 0.9, 0.9);
      // 裏で「タッ」と刻む和音（ノリを足す）
      if ([2, 6, 10, 13].includes(s)) chordStab(bus, t, ch.pad, ST * 1.2);
      // サビのメロディ（2 と同じ音色で、高めへのぼる歌えるフレーズ）
      for (const [at, len, f] of this.hook[cbar % 8]) if (at === s) neonLead(bus, t, f, ST * len);
    },
  },
  {
    id: "C2", name: "ブリープ・チェイス", desc: "テンポ136。追いかけっこのような、いちばんの疾走感。2小節で1周する、覚えやすい「ポッ」のフレーズがくり返す。刻むベースと手拍子、8小節ごとに盛り上げ → ドロップ。",
    bpm: 136,
    mel: [5, -1, 3, -1, 4, -1, 2, 3, -1, 5, -1, 3, 2, -1, 0, -1, 0, -1, 2, -1, 3, -1, 2, 0, -1, 3, -1, 4, 5, -1, 4, 3],
    play(n, t, b) {
      const s = n % 16, bar = Math.floor(n / 16), bus = b.bus, ST = b.STEP, L = b.level;
      const root = [73.42, 73.42, 58.27, 65.41][Math.floor(bar / 2) % 4], pool = [293.66, 349.23, 392.00, 440.00, 523.25, 587.33];
      const build = bar % 8 === 7;
      if (s % 2 === 0) pumpBass(bus, t, root, ST * 1.5, s % 4 === 0 ? 0.5 : 1);
      if (L >= 1 && !(build && s >= 8) && s % 4 === 0) kick(bus, t, 0.9);
      if (L >= 2) { hat(bus, t, s % 2 ? 0.6 : 1); if (s === 4 || s === 12) clap3(bus, t, 0.9); }
      if (build && s === 0) riser(bus, t, ST * 16);
      if (build && L >= 2 && s >= 8) snare(bus, t, 0.3 + (s - 8) * 0.07);
      const k = this.mel[(bar % 2) * 16 + s];
      if (L >= 1 && k >= 0) blip(bus, t, pool[k]);
      if (L >= 3 && s === 0 && bar % 2 === 0) pad(bus, t, [293.66, 349.23, 440.00], ST * 32, 800);
    },
  },
];

// 盛り上がり（遊びの進み具合）：0 → 3 で楽器が増える
document.querySelectorAll(".lv").forEach(btn => btn.onclick = () => {
  level = Number(btn.dataset.level);
  document.querySelectorAll(".lv").forEach(x => x.classList.toggle("on", x === btn));
  if (cur) cur.want = level;   // すぐには変えず、今のループ（8小節）の終わりで切りかえる
});
// 今の段階と、次のループで切りかわる予約を表示する
setInterval(() => {
  const el = document.getElementById("lvState");
  el.textContent = !cur ? "" : cur.want !== cur.level ? `今 ${cur.level} → 次のループで ${cur.want}` : `今 ${cur.level}`;
}, 200);
// 実行のアクセント（再生中だけ）
document.getElementById("zapBtn").onclick = () => { if (cur) cur.zap = true; };

const grid = document.getElementById("grid");
for (const tr of TRACKS) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="name">${tr.id}　${tr.name}</div><div class="desc">${tr.desc}</div><button type="button">▶ 再生</button>`;
  card.querySelector("button").onclick = () => (cur?.card === card ? stop() : start(tr, card));
  grid.appendChild(card);
}
